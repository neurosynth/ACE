        xlink:type=\"simple\">Creative Commons Attribution License</ext-link>, which
        permits unrestricted use, distribution, and reproduction in any medium, provided
        the original author and source are credited.</license-p></license>\n</permissions>\n<self-uri
        content-type=\"pdf\" xlink:href=\"info:doi/10.1371/journal.pone.0360047\"/>\n<abstract>\n<p>Given
        the shortage of specialized teachers, Initial Teacher Education requires alternative
        teacher preparation routes, such as Alternative Teaching Certification Programs,
        that allow the incorporation of professionals who already possess prior work
        experience into the educational system. However, this situation raises new
        challenges regarding the design and implementation of the teacher preparation
        model within these programs. Consequently, this study aims to map and synthesize
        the existing evidence on the characteristics of practice-based teacher education
        (PBTE) programs, understood as an approach in which professional learning
        is constructed through authentic, situated teaching experiences rather than
        primarily theoretical instruction, designed for individuals who already hold
        technical, bachelor\u2019s, or professional degrees. The review will be conducted
        following the JBI (Joanna Briggs Institute) methodology for scoping reviews,
        and will be reported in accordance with PRISMA-ScR guidelines. Data extraction
        and synthesis will be structured around the JBI Participants, Concept, and
        Context (PCC) analytical framework. Database searches will be conducted in
        Web of Science (WoS) and Scopus, including studies published between 2009
        and 2025 in English, Spanish, and Portuguese. The review will specifically
        examine program duration, mentoring structures, practicum design, institutional
        type, teaching strategies, and reported outcomes. This protocol has been registered
        in the Open Science Framework (OSF) and will be publicly available once approved.</p>\n</abstract>\n<funding-group>\n<funding-statement>This
        study was supported by Vicerrector\xEDa Acad\xE9mica and Centro de Investigaci\xF3n
        para la Educaci\xF3n Superior \u2013 Fondo USS-FIN-2026_APC_VRA-013.</funding-statement>\n</funding-group>\n<counts>\n<fig-count
        count=\"0\"/>\n<table-count count=\"2\"/>\n<page-count count=\"8\"/>\n</counts>\n<custom-meta-group>\n<custom-meta
        id=\"data-availability\">\n<meta-name>Data Availability</meta-name>\n<meta-value>No
        datasets were generated or analysed during the current study. All relevant
        data from this study will be made available upon study completion.</meta-value>\n</custom-meta>\n</custom-meta-group>\n</article-meta>\n</front>\n<body>\n<sec
        id=\"sec001\" sec-type=\"intro\">\n<title>Introduction</title>\n<p>Initial
        Teacher Education (ITE; in Spanish, <italic>Formaci\xF3n Inicial Docente</italic>,
        FID) is understood as a systematic and structured process aimed at developing
        the professional competencies required for teaching across the different levels
        of the educational system [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref001\">1</xref>,<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref002\">2</xref>].</p>\n<p>At a global
        level, the United Nations estimate that approximately 44 million new teachers
        will be needed by 2030 in order to respond to the growing educational demand
        [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref003\">3</xref>]. This shortage
        poses concrete demands on teacher preparation systems, which must not only
        increase enrollment, but also guarantee training that is both high in quality
        and relevant to current teaching practice.</p>\n<p>In this context, alternative
        teaching certification programs have emerged as a relevant alternative within
        the Chilean tertiary education system. For the purposes of this review, Alternative
        Teaching Certification Programs (ATCPs) are defined as initial teacher education
        pathways designed for individuals who already hold a prior technical, professional,
        or academic qualification, offering an abbreviated or alternative route to
        a teaching credential that recognizes prior learning and work experience [<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref004\">4</xref>]. These programs connect
        prior learning experiences with the completion of a bachelor\u2019s degree
        in education and a specific disciplinary teaching certification. The National
        Accreditation Commission (CNA; in Spanish: [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref005\">5</xref>]
        defines these programs as designed, formalized, and implemented with the purpose
        of offering study continuity to individuals who already hold a prior professional
        or technical degree or an academic qualification, recognizing work experience
        and knowledge acquired within the school system. Notwithstanding, their growth
        also raises challenges regarding the program\u2019s quality assurance, particularly
        under current regulations, in which accreditation is required to enroll new
        students.</p>\n<p>In response to these challenges, it becomes necessary to
        reconsider the teacher preparation models offered to pre-service teachers.
        Within this scenario, the international approach of Practice-Based Teacher
        Education (PBTE) has gained relevance. PBTE argues that professional learning
        should be constructed through authentic teaching experiences that integrate
        pedagogical theory, disciplinary knowledge, and situated action in the classroom
        [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref006\">6</xref>,<xref ref-type=\"bibr\"
        rid=\"pone.0360047.ref007\">7</xref>]. This approach implies a substantial
        transformation in the design of ITE (FID) programs, particularly in relation
        to mentoring practices and the articulation between universities and schools.
        Unlike models focused primarily on theoretical or didactic preparation, PBTE
        promotes the active participation of pre-service teachers in simulated teaching,
        analysis of real classroom practices, guided mentorship, and systematic processes
        of critical reflection [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref008\">8</xref>,<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref009\">9</xref>]. Its implementation
        becomes especially relevant in alternative teaching certification programs,
        where candidates bring prior educational and/or work experiences that require
        pedagogical proposals capable of recognizing and articulating those forms
        of knowledge with concrete opportunities for situated and contextualized professional
        development. While PBTE is associated with stronger practical readiness and
        greater coherence between theory and classroom action, the literature also
        identifies persistent tensions regarding the risk of reducing the theoretical
        and disciplinary foundations of teacher preparation, the resource demands
        of high-quality mentorship, and the variability in how authentic practice
        is operationalized across programs and institutional contexts.</p>\n<p>Despite
        its expansion, the ways in which this approach is implemented to guide pedagogical
        processes in teacher education programs vary significantly across countries,
        institutions, and levels of development of teacher preparation systems [<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref010\">10</xref>\u2013<xref ref-type=\"bibr\"
        rid=\"pone.0360047.ref013\">13</xref>]. These experiences illustrate that
        PBTE is being adopted and adapted through diverse methodological approaches,
        without yet converging on shared definitions, common program structures, or
        agreed criteria for what constitutes a practice-based component in teacher
        preparation. This conceptual and empirical heterogeneity signals a field that
        is still under development, for which a scoping review is the most appropriate
        first synthesis step rather than a systematic effectiveness review.</p>\n<p>Given
        the diversity of frameworks, designs, and contexts involved, a scoping review
        was considered the most appropriate methodological approach. Unlike systematic
        reviews focused on effectiveness, scoping reviews allow researchers to explore
        the range, nature, and characteristics of a broad body of literature, map
        emergent categories, and synthesize key concepts [<xref ref-type=\"bibr\"
        rid=\"pone.0360047.ref014\">14</xref>,<xref ref-type=\"bibr\" rid=\"pone.0360047.ref015\">15</xref>].
        This approach is particularly pertinent when the field of study is under development,
        as is the case of PBTE, and when a structured overview of the available knowledge
        is required.</p>\n<p>For this reason, the purpose of this scoping review is
        to map the available literature on PBTE, identifying its main characteristics
        in terms of program duration, mentoring structures, practicum design, and
        institutional type, as well as pedagogical strategies and reported outcomes,
        in the context of alternative teaching certification programs that enable
        professionals with prior educational experiences and certifications to obtain
        a teaching degree.</p>\n<sec id=\"sec002\">\n<title>Research question</title>\n<p>What
        evidence does the literature report regarding the design, implementation,
        and outcomes of practice-based initial teacher education programs for individuals
        with existing degrees, including post-baccalaureate, alternative, and consecutive
        routes?</p>\n</sec>\n</sec>\n<sec id=\"sec003\" sec-type=\"materials|methods\">\n<title>Methods</title>\n<p>The
        proposed scoping review will be conducted in accordance with the Joanna Briggs
        Institute (JBI) methodology for scoping reviews, as outlined in the JBI Manual
        for Evidence Synthesis [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref014\">14</xref>],
        and following the PRISMA-ScR recommendations [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref016\">16</xref>].
        The protocol has been registered in the Open Science Framework (OSF) under
        the registration number <ext-link ext-link-type=\"uri\" xlink:href=\"https://doi.org/10.17605/OSF.IO/UTR6V\"
        xlink:type=\"simple\">10.17605/OSF.IO/UTR6V</ext-link>, ensuring transparency
        and traceability throughout the process.</p>\n<sec id=\"sec004\">\n<title>Inclusion
        criteria</title>\n<p>Participants: Studies involving both teacher candidates
        and teacher educators participating in programs explicitly defined by their
        authors as alternative teaching certification programs, and that are directed
        at students or professionals who hold a prior academic or professional qualification
        (e.g., bachelor\u2019s degree, tertiary technical degree, or professional
        title) will be included. Studies reporting only on traditional initial teacher
        education programs (i.e., those involving teacher candidates without such
        prior qualifications) will be excluded.</p>\n<p>Concept: Studies examining
        initial teacher education programs that implement a practice-based teacher
        education (PBTE) approach will be considered. PBTE is characterized by the
        structured and systematic integration of authentic teaching experiences as
        the core element of teacher professional learning. Such experiences include,
        among others, simulated lessons, analysis of real classroom practice, reflective
        practice, and guided mentorship provided by experienced educators [<xref ref-type=\"bibr\"
        rid=\"pone.0360047.ref006\">6</xref>,<xref ref-type=\"bibr\" rid=\"pone.0360047.ref017\">17</xref>].
        For the purposes of this review, a program will be considered PBTE-aligned
        if it explicitly incorporates at least one of the three processes described
        by Grossman et al. [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref008\">8</xref>]:
        representation of practice, decomposition of practice, or approximation to
        practice, implemented in a structured and recurring manner within the program
        design. No restrictions will be placed regarding the length of the program,
        disciplinary area, intended education level, or any other characteristics
        of the program or its participants. The language of program implementation
        is not a restriction; however, publications reporting on the program must
        be written in English, Spanish, or Portuguese, as these are the languages
        the research team can assess.</p>\n<p>Context: Studies conducted in practice-based
        initial teacher education programs directed at individuals with prior academic
        or professional qualifications (post-baccalaureate/alternative/consecutive
        routes) and delivered by higher education institutions worldwide will be included.</p>\n</sec>\n<sec
        id=\"sec005\">\n<title>Types of sources</title>\n<p>This scoping review will
        consider studies adopting experimental and quasi-experimental designs. Likewise,
        analytical observational studies including prospective and retrospective cohort
        studies, case-control studies, and analytical cross-sectional studies will
        be included. Descriptive observational designs such as case series, single
        case reports, and descriptive cross-sectional studies will be considered.</p>\n<p>Additionally,
        qualitative studies informed by approaches such as phenomenology, grounded
        theory, ethnography, qualitative description, and action research will be
        included. Opinion pieces and reflective articles relevant to the object of
        study and meeting the inclusion criteria will also be considered. Opinion
        and reflective articles are included because PBTE within alternative teaching
        certification programs is an emerging area in which much of the available
        knowledge is still expressed through expert commentary and practitioner reflection
        rather than empirical studies. During data charting, these sources will be
        flagged by type and synthesized separately from empirical studies in the narrative
        synthesis.</p>\n</sec>\n<sec id=\"sec006\">\n<title>Search strategy</title>\n<p>Systematic
        database searches will be conducted in Web of Science Core Collection and
        Scopus. These two databases were selected because they offer the broadest
        interdisciplinary coverage of peer-reviewed literature in education and social
        sciences, support advanced Boolean search logic, and together index the large
        majority of high-impact journals in teacher education research [<xref ref-type=\"bibr\"
        rid=\"pone.0360047.ref018\">18</xref>,<xref ref-type=\"bibr\" rid=\"pone.0360047.ref019\">19</xref>].
        The search strings were structured in three thematic blocks: Block A covers
        PBTE terminology, Block B covers initial teacher education, and Block C covers
        alternative certification programs. The three blocks are crossed using the
        AND operator. No language restriction is applied at the level of program implementation;
        studies are limited to those published in English, Spanish, or Portuguese,
        reflecting the linguistic competencies of the research team. Studies published
        between 2009 and 2025 will be included, as this period corresponds to the
        emergence and consolidation of practice-based approaches in teacher education,
        particularly with the development of models such as practice-based teacher
        education and the consolidation of concepts such as core practices and high-leverage
        practices [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref007\">7</xref>,<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref008\">8</xref>]. The complete Boolean
        search strategies for both databases are presented in <xref ref-type=\"table\"
        rid=\"pone.0360047.t001\">Table 1</xref> (Web of Science) and <xref ref-type=\"table\"
        rid=\"pone.0360047.t002\">Table 2</xref> (Scopus).</p>\n<table-wrap id=\"pone.0360047.t001\"
        position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pone.0360047.t001</object-id><label>Table
        1</label><caption><title>Web of Science Core Collection search strategy (TS\u2009=\u2009Topic
