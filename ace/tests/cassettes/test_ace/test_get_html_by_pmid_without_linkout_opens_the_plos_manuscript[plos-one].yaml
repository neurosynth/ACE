        id=\"t002fn001\"><p>Source: Prepared by the authors.</p></fn>\n</table-wrap-foot>\n</table-wrap>\n</sec>\n<sec
        id=\"sec007\">\n<title>Selection of studies and sources of evidence</title>\n<p>All
        citations will be imported into Rayyan, a systematic screening tool, and duplicates
        will be removed automatically. Prior to full-scale screening, a pilot test
        will be conducted with four articles selected purposively from the initial
        search results to represent a range of study designs and geographic contexts.
        The pilot aims to confirm inter-rater agreement on the application of the
        eligibility criteria and to identify any ambiguity in their wording. An agreement
        rate below 75% on the pilot set will trigger a joint discussion between reviewers
        and, if necessary, a revision of the inclusion and exclusion criteria before
        full screening proceeds. It is acknowledged that four articles constitute
        a limited pilot sample given the conceptual complexity of PBTE; the research
        team will therefore remain attentive to recurring disagreements during the
        early stages of full screening as an informal extension of the pilot phase.
        After the pilot, titles and abstracts will be assessed independently by at
        least two reviewers. References that meet the inclusion criteria will proceed
        to full-text assessment, which will also be conducted independently by two
        reviewers. Any discrepancies will be resolved by consensus or by involving
        a third reviewer.</p>\n<p>The complete study selection process will be reported
        in the final review using a PRISMA-ScR flow diagram for scoping reviews [<xref
        ref-type=\"bibr\" rid=\"pone.0360047.ref020\">20</xref>].</p>\n</sec>\n<sec
        id=\"sec008\">\n<title>Data extraction</title>\n<p>Data will be extracted
        independently by two or more reviewers using a data extraction tool specifically
        designed by the research team for this review. This tool will include structured
        fields aligned with the PCC framework (Participants, Concept, and Context).
        Furthermore, this tool will also include additional variables concerning methodological
        designs, program implementation characteristics, and the main findings reported
        in each study. This strategy will ensure a systematic, rigorous, and coherent
        data collection process aligned with the objectives of the scoping review.</p>\n<p>The
        data extraction form will be piloted with an initial sample of included studies
        to assess its relevance, clarity, and alignment with the review objectives.
        Based on the pilot, the research team will refine the form as necessary before
        proceeding with full data extraction. Any modifications made to the extraction
        tool during the review process will be documented and justified in the final
        review to ensure transparency and reproducibility.</p>\n<p>In cases where
        relevant information is not available in the full text of a study, corresponding
        authors will be contacted to request missing data or necessary clarifications.
        If no response is received within two weeks, a reminder will be sent. If the
        information remains unavailable after a further two weeks, the missing data
        will be coded as not reported. If the search yields fewer studies than anticipated,
        the research team will broaden the search terms and extend manual reference
        list screening before concluding that the evidence base is genuinely limited.
        If a database becomes temporarily inaccessible during the search window, the
        search for that database will be repeated when access is restored and the
        execution date will be documented in the PRISMA-ScR flow diagram.</p>\n</sec>\n<sec
        id=\"sec009\">\n<title>Data analysis and presentation</title>\n<p>The results
        will be presented descriptively and narratively, organized around the components
        of the PCC framework and directly addressing the objectives and central research
        question of the review. Accordingly, different formats will be used to enhance
        the visualization and understanding of the findings.</p>\n<p>First, the results
        will be organized into tables that will map key characteristics of the included
        studies, such as country of origin, type of program, participant population,
        type of institution, methodological approach, implemented practice-based components,
        and main findings. These tables will provide an overview of how practice-based
        teacher education has been addressed in programs aimed at individuals with
        prior technical, academic, or professional qualifications.</p>\n<p>Second,
        graphical representations and thematic maps will be used to identify patterns,
        knowledge gaps, and geographical or institutional concentrations within the
        available evidence. These visualizations will support the identification of
        emerging areas, recurrent practices, and potential gaps in the implementation
        of the PBTE approach across specific contexts.</p>\n<p>In addition, a narrative
        synthesis will be conducted to interpret the findings in relation to the PCC
        framework. Themes will be identified using a primarily deductive approach
        structured around the dimensions stated in the research objective, specifically
        program duration, mentoring structures, practicum design, and institutional
        type, while remaining open to inductively coding patterns that emerge from
        the data and do not fit these predefined categories. Two reviewers will independently
        group the extracted data into preliminary themes. Discrepancies in theme labeling
        or grouping will be resolved by discussion and, where necessary, by a third
        reviewer.</p>\n<p>Finally, in accordance with the purposes of a scoping review,
        no critical appraisal of methodological quality will be conducted for the
        included studies. However, when appropriate, comments will be made regarding
        the diversity of designs and methodologies used, with the aim of informing
        future systematic or empirical research.</p>\n</sec>\n<sec id=\"sec010\">\n<title>Significance</title>\n<p>At
        the national level, this review responds directly to the expansion of alternative
        teaching certification programs in Chile under accreditation requirements
        that currently lack an evidence base on how practice-based components should
        be designed and implemented. Mapping international evidence on PBTE can therefore
        inform program design and quality assurance criteria in this specific context.
        At the global level, given the United Nations projection of approximately
        44 million additional teachers needed by 2030 [<xref ref-type=\"bibr\" rid=\"pone.0360047.ref003\">3</xref>],
        alternative certification routes are expanding as a workforce strategy across
        multiple countries. This review contributes by synthesizing, for the first
        time, evidence on how practice-based approaches have been conceptualized and
        implemented specifically within this type of program, supporting future systematic
        reviews and informing policy decisions in national systems facing comparable
        teacher shortage pressures.</p>\n</sec>\n<sec id=\"sec011\">\n<title>Limitations</title>\n<p>This
        protocol presents several anticipated limitations. First, restricting the
        systematic database search to Web of Science and Scopus, while justified by
        their interdisciplinary coverage and advanced Boolean search capabilities,
        means that studies indexed exclusively in discipline-specific or regional
        databases may not be captured. Second, the pilot test involves only four articles,
        which is a modest sample given the conceptual complexity of PBTE; this is
        acknowledged and partially mitigated by the informal extension of the pilot
        phase during early full-text screening. Third, the inclusion of opinion and
        reflective articles alongside empirical studies introduces heterogeneity in
        the strength of evidence synthesized; this is addressed by analyzing and reporting
        these source types separately in the narrative synthesis. Fourth, consistent
        with standard scoping review methodology, no formal quality appraisal of included
        studies will be conducted; the review will therefore map the breadth of available
        evidence rather than evaluate its methodological robustness. Fifth, while
        the regulatory context of Chilean alternative teaching certification programs
        motivates this study, the global scope of the review means that findings will
        need to be interpreted in light of each country\u2019s specific institutional
        and regulatory conditions.</p>\n</sec>\n</sec>\n</body>\n<back>\n<ack>\n<p>This
