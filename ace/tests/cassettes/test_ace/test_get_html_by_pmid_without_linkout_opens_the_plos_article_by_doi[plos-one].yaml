        date-type=\"accepted\"><day>21</day><month>9</month><year>2026</year></date>\n</history>\n<permissions>\n<copyright-year>2026</copyright-year>\n<copyright-holder>Urra-Barra
        et al</copyright-holder>\n<license xlink:href=\"http://creativecommons.org/licenses/by/4.0/\"
        xlink:type=\"simple\">\n<license-p>This is an open access article distributed
