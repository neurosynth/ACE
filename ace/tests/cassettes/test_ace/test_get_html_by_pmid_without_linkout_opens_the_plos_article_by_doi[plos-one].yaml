        />\n  <meta name=\"description\" content=\"Given the shortage of specialized
        teachers, Initial Teacher Education requires alternative teacher preparation
        routes, such as Alternative Teaching Certification Programs, that allow the
        incorporation of professionals who already possess prior work experience into
        the educational system. However, this situation raises new challenges regarding
        the design and implementation of the teacher preparation model within these
        programs. Consequently, this study aims to map and synthesize the existing
        evidence on the characteristics of practice-based teacher education (PBTE)
        programs, understood as an approach in which professional learning is constructed
        through authentic, situated teaching experiences rather than primarily theoretical
        instruction, designed for individuals who already hold technical, bachelor&rsquo;s,
        or professional degrees. The review will be conducted following the JBI (Joanna
        Briggs Institute) methodology for scoping reviews, and will be reported in
        accordance with PRISMA-ScR guidelines. Data extraction and synthesis will
        be structured around the JBI Participants, Concept, and Context (PCC) analytical
        framework. Database searches will be conducted in Web of Science (WoS) and
        Scopus, including studies published between 2009 and 2025 in English, Spanish,
        and Portuguese. The review will specifically examine program duration, mentoring
        structures, practicum design, institutional type, teaching strategies, and
        reported outcomes. This protocol has been registered in the Open Science Framework
        (OSF) and will be publicly available once approved.\" />\n\n  <meta name=\"citation_abstract\"
