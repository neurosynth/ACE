        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Table 2. </span>
        Scopus search strategy (TITLE-ABS-KEY field).</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pone.0360047.t002\">\n
        \             https://doi.org/10.1371/journal.pone.0360047.t002</a></p></div></div>\n\n<div
        id=\"section4\" class=\"section toc-section\"><a id=\"sec007\" name=\"sec007\"
        class=\"link-target\" title=\"Selection of studies and sources of evidence\"></a>\n<h3>Selection
        of studies and sources of evidence</h3>\n<a id=\"article1.body1.sec2.sec4.p1\"
        name=\"article1.body1.sec2.sec4.p1\" class=\"link-target\"></a><p>All citations
        will be imported into Rayyan, a systematic screening tool, and duplicates
        will be removed automatically. Prior to full-scale screening, a pilot test
        will be conducted with four articles selected purposively from the initial
        search results to represent a range of study designs and geographic contexts.
        The pilot aims to confirm inter-rater agreement on the application of the
        eligibility criteria and to identify any ambiguity in their wording. An agreement
        rate below 75% on the pilot set will trigger a joint discussion between reviewers
        and, if necessary, a revision of the inclusion and exclusion criteria before
        full screening proceeds. It is acknowledged that four articles constitute
        a limited pilot sample given the conceptual complexity of PBTE; the research
        team will therefore remain attentive to recurring disagreements during the
        early stages of full screening as an informal extension of the pilot phase.
        After the pilot, titles and abstracts will be assessed independently by at
        least two reviewers. References that meet the inclusion criteria will proceed
        to full-text assessment, which will also be conducted independently by two
        reviewers. Any discrepancies will be resolved by consensus or by involving
        a third reviewer.</p>\n<a id=\"article1.body1.sec2.sec4.p2\" name=\"article1.body1.sec2.sec4.p2\"
        class=\"link-target\"></a><p>The complete study selection process will be
        reported in the final review using a PRISMA-ScR flow diagram for scoping reviews
        [<a href=\"#pone.0360047.ref020\" class=\"ref-tip\">20</a>].</p>\n</div>\n\n<div
        id=\"section5\" class=\"section toc-section\"><a id=\"sec008\" name=\"sec008\"
        class=\"link-target\" title=\"Data extraction\"></a>\n<h3>Data extraction</h3>\n<a
        id=\"article1.body1.sec2.sec5.p1\" name=\"article1.body1.sec2.sec5.p1\" class=\"link-target\"></a><p>Data
        will be extracted independently by two or more reviewers using a data extraction
        tool specifically designed by the research team for this review. This tool
        will include structured fields aligned with the PCC framework (Participants,
        Concept, and Context). Furthermore, this tool will also include additional
        variables concerning methodological designs, program implementation characteristics,
        and the main findings reported in each study. This strategy will ensure a
        systematic, rigorous, and coherent data collection process aligned with the
        objectives of the scoping review.</p>\n<a id=\"article1.body1.sec2.sec5.p2\"
        name=\"article1.body1.sec2.sec5.p2\" class=\"link-target\"></a><p>The data
        extraction form will be piloted with an initial sample of included studies
        to assess its relevance, clarity, and alignment with the review objectives.
        Based on the pilot, the research team will refine the form as necessary before
        proceeding with full data extraction. Any modifications made to the extraction
        tool during the review process will be documented and justified in the final
        review to ensure transparency and reproducibility.</p>\n<a id=\"article1.body1.sec2.sec5.p3\"
        name=\"article1.body1.sec2.sec5.p3\" class=\"link-target\"></a><p>In cases
        where relevant information is not available in the full text of a study, corresponding
        authors will be contacted to request missing data or necessary clarifications.
        If no response is received within two weeks, a reminder will be sent. If the
        information remains unavailable after a further two weeks, the missing data
        will be coded as not reported. If the search yields fewer studies than anticipated,
        the research team will broaden the search terms and extend manual reference
        list screening before concluding that the evidence base is genuinely limited.
        If a database becomes temporarily inaccessible during the search window, the
        search for that database will be repeated when access is restored and the
        execution date will be documented in the PRISMA-ScR flow diagram.</p>\n</div>\n\n<div
        id=\"section6\" class=\"section toc-section\"><a id=\"sec009\" name=\"sec009\"
        class=\"link-target\" title=\"Data analysis and presentation\"></a>\n<h3>Data
        analysis and presentation</h3>\n<a id=\"article1.body1.sec2.sec6.p1\" name=\"article1.body1.sec2.sec6.p1\"
        class=\"link-target\"></a><p>The results will be presented descriptively and
        narratively, organized around the components of the PCC framework and directly
        addressing the objectives and central research question of the review. Accordingly,
        different formats will be used to enhance the visualization and understanding
        of the findings.</p>\n<a id=\"article1.body1.sec2.sec6.p2\" name=\"article1.body1.sec2.sec6.p2\"
        class=\"link-target\"></a><p>First, the results will be organized into tables
        that will map key characteristics of the included studies, such as country
        of origin, type of program, participant population, type of institution, methodological
        approach, implemented practice-based components, and main findings. These
        tables will provide an overview of how practice-based teacher education has
        been addressed in programs aimed at individuals with prior technical, academic,
        or professional qualifications.</p>\n<a id=\"article1.body1.sec2.sec6.p3\"
        name=\"article1.body1.sec2.sec6.p3\" class=\"link-target\"></a><p>Second,
        graphical representations and thematic maps will be used to identify patterns,
        knowledge gaps, and geographical or institutional concentrations within the
        available evidence. These visualizations will support the identification of
        emerging areas, recurrent practices, and potential gaps in the implementation
        of the PBTE approach across specific contexts.</p>\n<a id=\"article1.body1.sec2.sec6.p4\"
        name=\"article1.body1.sec2.sec6.p4\" class=\"link-target\"></a><p>In addition,
        a narrative synthesis will be conducted to interpret the findings in relation
        to the PCC framework. Themes will be identified using a primarily deductive
        approach structured around the dimensions stated in the research objective,
        specifically program duration, mentoring structures, practicum design, and
        institutional type, while remaining open to inductively coding patterns that
        emerge from the data and do not fit these predefined categories. Two reviewers
        will independently group the extracted data into preliminary themes. Discrepancies
        in theme labeling or grouping will be resolved by discussion and, where necessary,
        by a third reviewer.</p>\n<a id=\"article1.body1.sec2.sec6.p5\" name=\"article1.body1.sec2.sec6.p5\"
        class=\"link-target\"></a><p>Finally, in accordance with the purposes of a
        scoping review, no critical appraisal of methodological quality will be conducted
        for the included studies. However, when appropriate, comments will be made
        regarding the diversity of designs and methodologies used, with the aim of
        informing future systematic or empirical research.</p>\n</div>\n\n<div id=\"section7\"
        class=\"section toc-section\"><a id=\"sec010\" name=\"sec010\" class=\"link-target\"
        title=\"Significance\"></a>\n<h3>Significance</h3>\n<a id=\"article1.body1.sec2.sec7.p1\"
        name=\"article1.body1.sec2.sec7.p1\" class=\"link-target\"></a><p>At the national
        level, this review responds directly to the expansion of alternative teaching
        certification programs in Chile under accreditation requirements that currently
        lack an evidence base on how practice-based components should be designed
        and implemented. Mapping international evidence on PBTE can therefore inform
        program design and quality assurance criteria in this specific context. At
        the global level, given the United Nations projection of approximately 44
        million additional teachers needed by 2030 [<a href=\"#pone.0360047.ref003\"
        class=\"ref-tip\">3</a>], alternative certification routes are expanding as
        a workforce strategy across multiple countries. This review contributes by
        synthesizing, for the first time, evidence on how practice-based approaches
        have been conceptualized and implemented specifically within this type of
        program, supporting future systematic reviews and informing policy decisions
        in national systems facing comparable teacher shortage pressures.</p>\n</div>\n\n<div
        id=\"section8\" class=\"section toc-section\"><a id=\"sec011\" name=\"sec011\"
        class=\"link-target\" title=\"Limitations\"></a>\n<h3>Limitations</h3>\n<a
        id=\"article1.body1.sec2.sec8.p1\" name=\"article1.body1.sec2.sec8.p1\" class=\"link-target\"></a><p>This
        protocol presents several anticipated limitations. First, restricting the
        systematic database search to Web of Science and Scopus, while justified by
        their interdisciplinary coverage and advanced Boolean search capabilities,
        means that studies indexed exclusively in discipline-specific or regional
        databases may not be captured. Second, the pilot test involves only four articles,
        which is a modest sample given the conceptual complexity of PBTE; this is
        acknowledged and partially mitigated by the informal extension of the pilot
        phase during early full-text screening. Third, the inclusion of opinion and
        reflective articles alongside empirical studies introduces heterogeneity in
        the strength of evidence synthesized; this is addressed by analyzing and reporting
        these source types separately in the narrative synthesis. Fourth, consistent
        with standard scoping review methodology, no formal quality appraisal of included
        studies will be conducted; the review will therefore map the breadth of available
        evidence rather than evaluate its methodological robustness. Fifth, while
        the regulatory context of Chilean alternative teaching certification programs
        motivates this study, the global scope of the review means that findings will
        need to be interpreted in light of each country\u2019s specific institutional
        and regulatory conditions.</p>\n</div>\n</div>\n\n\n\n\n\n<div xmlns:plos=\"http://plos.org\"
