        content-type=\"letter-date\">24 Mar 2026</named-content></p>\n<p>PMEN-D-25-00562</p>\n<p>Associations
        Between Hurricane Stressors, Social Capital, and Climate Anxiety Among Individuals
        Who Experienced Hurricanes Helene and Milton</p>\n<p>PLOS Mental Health</p>\n<p>Dear
        Dr. Dalisay,</p>\n<p>Thank you for submitting your manuscript to PLOS Mental
        Health. After careful consideration, we feel that it has merit but does not
        fully meet PLOS Mental Health\u2019s publication criteria as it currently
        stands. Therefore, we invite you to submit a revised version of the manuscript
        that addresses the points raised during the review process.</p>\n<p>Please
        submit your revised manuscript by May 08 2026 11:59PM. If you will need more
        time than this to complete your revisions, please reply to this message or
        contact the journal office at <email xlink:type=\"simple\">mentalhealth@plos.org</email>.
        When you're ready to submit your revision, log on to <ext-link ext-link-type=\"uri\"
        xlink:href=\"https://www.editorialmanager.com/pmen/\" xlink:type=\"simple\">https://www.editorialmanager.com/pmen/</ext-link>
        and select the 'Submissions Needing Revision' folder to locate your manuscript
        file.</p>\n<p>Please include the following items when submitting your revised
        manuscript:</p>\n<list list-type=\"bullet\">\n<list-item><p>A letter that
        responds to each point raised by the editor and reviewer(s). You should upload
        this letter as a separate file labeled 'Response to Reviewers'.</p></list-item>\n<list-item><p>A
        marked-up copy of your manuscript that highlights changes made to the original
        version. You should upload this as a separate file labeled 'Revised Manuscript
        with Track Changes'.</p></list-item>\n<list-item><p>An unmarked version of
        your revised paper without tracked changes. You should upload this as a separate
        file labeled 'Manuscript'.</p></list-item>\n</list>\n<p>Guidelines for resubmitting
        your figure files are available below the reviewer comments at the end of
        this letter.</p>\n<p>We look forward to receiving your revised manuscript.</p>\n<p>Kind
        regards,</p>\n<p>Marc Eric Santos Reyes</p>\n<p>Academic Editor</p>\n<p>PLOS
        Mental Health</p>\n<p>Journal Requirements:</p>\n<p>1. We have noticed that
        you have uploaded Supporting Information files, but you have not included
        a list of legends. Please add a full list of legends for your Supporting Information
        files after the references list.</p>\n<p>If the reviewer comments include
        a recommendation to cite specific previously published works, please review
        and evaluate these publications to determine whether they are relevant and
        should be cited. There is no requirement to cite these works unless the editor
        has indicated otherwise.</p>\n<p>Additional Editor Comments (if provided):</p>\n<p>[Note:
        HTML markup is below. Please do not edit.]</p>\n<p>Reviewers' comments:</p>\n<p>Reviewer's
        Responses to Questions</p>\n<p><bold>Comments to the Author</bold></p>\n<p>1.
        Does this manuscript meet PLOS Mental Health\u2019s <ext-link ext-link-type=\"uri\"
        xlink:href=\"https://journals.plos.org/mentalhealth/s/criteria-for-publication\"
        xlink:type=\"simple\">publication criteria</ext-link>?&gt;</p>\n<p>Reviewer
        #1:\_Yes</p>\n<p>Reviewer #2:\_Partly</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>2.
        Has the statistical analysis been performed appropriately and rigorously?--&gt;?&gt;</p>\n<p>Reviewer
        #1:\_Yes</p>\n<p>Reviewer #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>3.
        Have the authors made all data underlying the findings in their manuscript
        fully available (please refer to the Data Availability Statement at the start
        of the manuscript PDF file)??&gt;</p>\n<p>The <ext-link ext-link-type=\"uri\"
        xlink:href=\"https://journals.plos.org/mentalhealth/s/data-availability\"
        xlink:type=\"simple\">PLOS Data policy</ext-link></p>\n<p>Reviewer #1:\_Yes</p>\n<p>Reviewer
        #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>4. Is the manuscript
        presented in an intelligible fashion and written in standard English??&gt;</p>\n<p>Reviewer
        #1:\_Yes</p>\n<p>Reviewer #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>Reviewer
        #1:\_The manuscript is well aligned with the scope of the journal. It addresses
        mental health and well-being in the context of climate-related disasters and
        examines psychosocial resources (social capital) as both risk and protective
        factors. The focus on climate anxiety, disaster exposure, and social capital
        directly fits areas such as environmental impacts on mental health, socio-economic
        aspects, and well-being. Overall, the data support the main conclusions, and
        the authors are largely careful not to overstate their findings.</p>\n<p>That
        said, several revisions are recommended to improve clarity, coherence, and
        interpretability.</p>\n<p>1. The cross-sectional design precludes any causal
        inference. While the authors generally avoid causal language, some interpretations
        (e.g., buffering versus amplifying effects) could be more cautiously framed
        as conditional associations rather than effects.</p>\n<p>2. Some reliability
        coefficients, particularly for linking social capital (\u03B1 = .66), are
        marginal. While not unacceptable, this limitation should be acknowledged when
        interpreting findings involving this construct.</p>\n<p>3. The variable climate
        change anxiety should be differenciated from the psychological construct anxiety,
        it is not well meassured for some of the conclusions.</p>\n<p>4. Table 1 introduces
        the variable Disaster Critical Thinking; however, this construct is not sufficiently
        described or theoretically framed in the main text. There is no clear definition,
        conceptual background, or justification for its inclusion provided in the
        introduction or methods sections. As a result, readers are left without an
        understanding of how Disaster Critical Thinking is conceptualized, how it
        differs from related constructs (e.g., risk perception, disaster preparedness,
        cognitive appraisal), or why it is relevant to climate anxiety within the
        proposed theoretical framework. To improve clarity and interpretability, the
        authors should: Explicitly define Disaster Critical Thinking in the text.
        Explain its theoretical grounding and relevance to disaster-related mental
        health outcomes. Describe how it was operationalized and measured before presenting
        it in Table 1.</p>\n<p>5. Figures 1, 2, and 3 present interaction effects
        between hurricane stressors and different forms of social capital. While the
        figures are visually clear, a legend or description of the figures are needed
        to adequately explain the meaning of the colored lines displayed in each figure.
        Specifically, the text does not explicitly state which colors correspond to
        low, mean, or high levels (e.g., \u22121 SD, mean, +1 SD) of the moderator
        variables.</p>\n<p>Reviewer #2:\_Abstract</p>\n<p>The abstract reads as though
        bonding capital is protective, when in fact its protective role is conditional
        and reverses under high stress.</p>\n<p>Introduction</p>\n<p>The authors should
        more explicitly explain the cognitive pathway by which a hurricane experience
        activates concern about climate change rather than generalized distress.</p>\n<p>Methods</p>\n<p>-
        The authors themselves acknowledge in the limitations section that hurricane
        stressors and climate change anxiety may not conceptually align well. This
        is not just a limitation, rather it poses a validity issue. The authors should
        either provide stronger theoretical justification for why hurricane exposure
        would activate climate-specific anxiety rather than general anxiety, or they
        should have added a general anxiety measure as a comparison outcome.</p>\n<p>-
        The alpha of linking social capital is below conventional .70 threshold. The
        authors need to justify this.</p>\n<p>Results</p>\n<p>- There's a logical
        inconsistency in the final paragraph regarding which type of social capital
        is being discussed (Line 324 &amp; 325). Please correctly explain.</p>\n<p>-
        From table 3 we can see that even at 1 SD below the mean on bonding capital,
        the hurricane stressor\u2013anxiety relationship remains positive and significant.
        This means bonding capital does not truly buffer, it only slows the strengthening
        of the relationship. The interpretation should be revised accordingly.</p>\n<p>Other
        issues</p>\n<p>- The paper refers to Figure 4 on line 319 but only Figures
        1, 2 &amp; 3 appears in the manuscript.</p>\n<p>- Table 1 includes Disaster
        critical thinking (M = 3.61, \u03B1 = .86) which is never mentioned in the
        Methods or Results sections. This variable should either be explained or removed.</p>\n<p>Reviewer
        #3:\_Major Strengths:</p>\n<p>1. The study is timely and relevant.</p>\n<p>2.
        There is a large sample size.</p>\n<p>3. There is a strong conceptual contribution,
        showing that social capital is not always protective.</p>\n<p>Major Weaknesses:</p>\n<p>1.
        There might be conceptual mismatch. There might be underlying concepts behind
        hurricane stressors to suggest that it might be relate to climate change anxiety.
        Further, hurricane stressors does not automatically suggest that they are
        thinking about climate change. For climate change anxiety to arise, they must
        attribute it to climate change. Some people may attribute hurricanes to disasters
        rather than climate change. Perhaps, this could be added to limitations as
        well. Further studies may include climate risk perception or climate change
        attribution.</p>\n<p>2. The theoretical grounding is stress process model,
        when thinking about CCA, better explanations of theories includes Environmental
        Identity and other ecological grief models.</p>\n<p>3. Only three items were
        used from Clayton's CCA scale. The original scale has multiple dimensions,
        the chosen items may just indicate rumination not really anxiety, particularly
        CCA.</p>\n<p>4. Moderating results is interesting but can you explain the
        implications in more detail.</p>\n<p>**********</p>\n<p><ext-link ext-link-type=\"uri\"
        xlink:href=\"https://journals.plos.org/mentalthealth/s/editorial-and-peer-review-process#loc-peer-review-history\"
        xlink:type=\"simple\">what does this mean?</ext-link>). If published, this
        will include your full peer review and any attached files.</p>\n<p><bold>Do
        you want your identity to be public for this peer review?</bold>\_\_If you
        choose \u201Cno\u201D, your identity will remain anonymous but your review
        may still be made public.</p>\n<p>For information about this choice, including
        consent withdrawal, please see our <ext-link ext-link-type=\"uri\" xlink:href=\"https://www.plos.org/privacy-policy\"
        xlink:type=\"simple\">Privacy Policy</ext-link></p>\n<p>Reviewer #1:\_<bold>Yes:</bold>\_\_Ruth
        Natalia Suarez Florez</p>\n<p>Reviewer #2:\_No</p>\n<p>Reviewer #3:\_No</p>\n<p>**********</p>\n<p>[NOTE:
