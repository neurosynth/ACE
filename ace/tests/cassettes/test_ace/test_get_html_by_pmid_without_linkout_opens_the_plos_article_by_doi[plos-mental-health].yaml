        id=\"pmen.0000749.g001\" position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pmen.0000749.g001</object-id><label>Fig
        1</label><caption><title>Bonding social capital as a moderator of the relationship
        between hurricane stressors and climate change anxiety.</title></caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pmen.0000749.g001\"
        xlink:type=\"simple\"/></fig>\n<p>Second, as <xref ref-type=\"table\" rid=\"pmen.0000749.t002\">Table
        2</xref> shows, the interaction between hurricane stressors and bridging social
        capital was significant (<italic>b</italic>\u2009=\u2009.053, se\u2009=\u2009.013,
        <italic>p</italic>\u2009&lt;\u2009.001). Similar to what was found for bonding
        social capital, the relationship between hurricane stressors and climate anxiety
        was not significant when bridging social capital was at 1SD below the mean
        (<italic>b</italic>\u2009=\u2009.015, <italic>se</italic>\u2009=\u2009.021,
        <italic>p</italic>\u2009=\u2009.464). Yet, as <xref ref-type=\"table\" rid=\"pmen.0000749.t003\">Table
        3</xref> indicates, this relationship became progressively stronger as levels
        of bridging social capital increased from its mean (<italic>b</italic>\u2009=\u2009.065,
        <italic>se</italic>\u2009=\u2009.016, <italic>p</italic>\u2009&lt;\u2009.001)
        to 1SD above the mean (<italic>b</italic>\u2009=\u2009.114, <italic>se</italic>\u2009=\u2009.020,
        <italic>p</italic>\u2009&lt;\u2009.001). The plot for this interaction is
        illustrated in <xref ref-type=\"fig\" rid=\"pmen.0000749.g002\">Fig 2</xref>.
        In contrast to the results for bonding social capital, <xref ref-type=\"fig\"
        rid=\"pmen.0000749.g002\">Fig 2</xref> indicates that at lower levels of hurricane
        stressors, climate anxiety was slightly higher for participants with higher
        bridging social capital. As hurricane stressors increased, the slope of the
        stress-anxiety relationship became steeper for participants with higher levels
        of bridging social capital. In contrast, the slope was relatively flat for
        those with low bridging social capital.</p>\n<fig id=\"pmen.0000749.g002\"
        position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pmen.0000749.g002</object-id><label>Fig
        2</label><caption><title>Bridging social capital as a moderator of the relationship
        between hurricane stressors and climate change anxiety.</title></caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pmen.0000749.g002\"
        xlink:type=\"simple\"/></fig>\n<p>Third, the interaction between hurricane
        stressors and linking social capital was also significant (<italic>b</italic>\u2009=\u2009.062,
        <italic>se</italic>\u2009=\u2009.014, <italic>p</italic>\u2009&lt;\u2009.001),
        and similar to the pattern found for both bonding and bridging social capital,
        the relationship between hurricane stressors and climate anxiety was not significant
        when linking social capital was at 1SD below the mean (<italic>b</italic>\u2009=\u2009.007,
        <italic>se</italic>\u2009=\u2009.021, <italic>p</italic>\u2009=\u2009.752).
        Yet, the relationship became stronger as levels of linking social capital
        increased from its mean (<italic>b</italic>\u2009=\u2009.065, <italic>se</italic>\u2009=\u2009.016,
        <italic>p</italic>\u2009&lt;\u2009.001) to 1SD above the mean (<italic>b</italic>\u2009=\u2009.123,
        <italic>se</italic>\u2009=\u2009.020, <italic>p</italic>\u2009&lt;\u2009.001)
        (see <xref ref-type=\"table\" rid=\"pmen.0000749.t003\">Table 3</xref> and
        <xref ref-type=\"fig\" rid=\"pmen.0000749.g003\">Fig 3</xref>). As shown in
        <xref ref-type=\"fig\" rid=\"pmen.0000749.g003\">Fig 3</xref>, the pattern
        of the plot for linking social capital is similar to that for bridging social
        capital. That is, at lower levels of hurricane stressors, climate anxiety
        was slightly higher for participants with higher linking social capital, and
        the slope for the relationship between hurricane stressors and climate anxiety
        was steeper for participants with higher linking social capital.</p>\n<fig
        id=\"pmen.0000749.g003\" position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pmen.0000749.g003</object-id><label>Fig
        3</label><caption><title>Linking social capital as a moderator of the relationship
        between hurricane stressors and climate change anxiety.</title></caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pmen.0000749.g003\"
        xlink:type=\"simple\"/></fig>\n</sec>\n<sec id=\"sec017\">\n<title>4.3 Ancillary
        analyses: Association of covariates with climate anxiety</title>\n<p>As <xref
        ref-type=\"table\" rid=\"pmen.0000749.t002\">Table 2</xref> shows, income
        (b = between\u2009.054 to.056) and black race/ethnicity (b = between\u2009.221
        to\u2009.222) were both positively associated with climate anxiety, and South
        Carolina residence (relative to the Florida reference group) was negatively
        associated (b = between -.251 to\u2009.228). Also, generalized anxiety as
        a covariate was positively associated with climate change anxiety (b = between
        -.182 to -.178).</p>\n</sec>\n</sec>\n<sec id=\"sec018\" sec-type=\"conclusions\">\n<title>5.
        Discussion</title>\n<p>Hurricanes Helene and Milton caused widespread devastation
        across several Southeastern states in the U.S. [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref001\">1</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref002\">2</xref>]. The first purpose
        of the present study was to test whether stressful experiences or stressors
        associated with Hurricanes Helene and Milton would be positively related with
        climate anxiety. We analyzed data from surveys conducted in the counties of
        four U.S. states impacted by the two hurricanes. Our finding confirms that
        hurricane stressors were positively associated with climate anxiety, supporting
        previous research conducted by Garfin and Wong-Parodi [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref008\">8</xref>] and more broadly expanding past research
        linking personal experiences with hurricanes to psychological distress. This
        finding is also consistent with the stress process model [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref014\">14</xref>], which explains why stressors such
        as hurricane-related losses and damages are associated with adverse psychological
        outcomes. Moreover, the positive association between hurricane stressors and
        climate anxiety aligns with the psychological mechanisms proffered by the
        environmental identity [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref022\">22</xref>]
        framework and the concept of ecological grief [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref023\">23</xref>],
        which both suggest that experiences with hurricane stressors could be interpreted
        through an ecological lens connecting immediate loss to the broader systemic
        threat of climate change. However, we note that our surveys did not include
        measures for environmental identity and ecological grief. Thus, future studies
        could examine these variables as potential mechanisms that may explain the
        association between hurricane stressors and climate anxiety. In addition,
        climate change risk perceptions or climate change attributions are also constructs
        that reflect cognitive appraisals of climate change as a threatening phenomenon
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref042\">42</xref>], and as such
        are conceptually similar to climate anxiety. As our study did not assess these
        constructs, future research could investigate how hurricane stressors may
        be linked to such variables.</p>\n<p>The second purpose of our study was to
        explore the relationship between social capital and climate anxiety. We examined
        three forms of social capital: bonding, bridging, and linking. Our findings,
        on the one hand, indicated that bonding social capital was inversely associated
        with climate anxiety. This finding could be reflective of the \u201Cbuffering\u201D
        or protective potential of bonding social capital and may align with the findings
        of a previous study by Hawkins and Maurer [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref029\">29</xref>],
        which suggested that bonding social capital, compared with bridging and linking
        social capital, may more effectively foster immediate support after a hurricane.
        As such, in our study, bonding social capital was negatively associated with
        anxieties about climate change for our participants who were recovering from
        Hurricane Helene/Milton. On the other hand, we found that both bridging and
        linking social capital were associated with heightened climate anxiety. We
        proffer one possible explanation for these results. Specifically, it could
        be that participants\u2019 heterogenous social ties, facilitated by bridging
        and linking social capital, may have comprised a large proportion of people
        expressing worries about the climate crisis. As such, this may have increased
        the likelihood of developing similar climate concerns. However, our surveys
        did not contain measures assessing the proportions of people expressing worries
        about the climate crisis within one\u2019s heterogenous networks. We thus
        recommend future studies be conducted to measure this variable and examine
        its potential role in explaining how bridging and linking social capital could
        be both positively associated with climate anxiety.</p>\n<p>The third purpose
        of our study was to explore the possibility that social capital would moderate
        the positive relationship between hurricane stressors and climate anxiety.
        To this end, our findings indicated that social capital did moderate the relationship
        between hurricane stressors and climate anxiety. However, the specific moderation
        pattern differed across bonding versus bridging and linking social capital.
        Specifically, our results suggested that bonding social capital\u2019s protective
        role is conditional and reverses under high stress, rather than following
        a classic buffering pattern [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref043\">43</xref>].
        As <xref ref-type=\"fig\" rid=\"pmen.0000749.g001\">Fig 1</xref> shows, participants
        with high bonding social capital reported lower climate anxiety at low stressor
        levels. A classic buffering pattern would reveal a flattening hurricane stressor-anxiety
        slope for the high-bonding social capital group and steeper slopes for the
        low and moderate groups. Yet, our data showed the opposite. The slope was
        steeper for the high bonding social capital group. That is, bonding social
        capital weakens the relationship between hurricane stressors and climate anxiety
        only when hurricane stressors were low. As stressors accumulated, bonding
        social capital strengthens the association between stressors and climate anxiety,
        possibly because stress was transmitted within dense social networks [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref031\">31</xref>]. Resources that are
        typically protective become less effective under high stress conditions [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref043\">43</xref>]. In the context of
        hurricane coping and recovery, close-knit networks of family and friends often
        provide critical support in the early stages of a disaster [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref023\">23</xref>]. However, when stressors accumulate,
        such as when hurricanes bring prolonged, repeated disruptions, the same networks
        may shift from being a source of support to a source of strain. For example,
        anxiety and worry may spread more easily within tightly knit groups, creating
        collective stress as shared resources become depleted. In addition, individuals
        embedded in strong bonding networks may feel the pressure to reciprocate by
        caring for others, which can amplify their own feelings of anxiety and emotional
        fatigue.</p>\n<p>Yet our pattern of findings for bridging and linking social
        capital suggested that they amplified the positive association between hurricanes
        stressors and climate anxiety. This finding is in contrast with previous research
        that indicated social capital to serve as a buffer or play a protective role
        against anxiety following disasters [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref011\">11</xref>].
        It is possible that higher bridging and linking social capital increases the
        potential of being exposed to a wider span of information regarding climate
        change, namely, those pertaining to climate threats. As we noted, past research
        has found that exposure to information about the impacts of climate change
        is positively associated with climate anxiety [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref016\">16</xref>].
        One practical implication of these findings is that risk communication delivered
        through bridging and linking networks is better designed to pair disaster
        information with concrete efficacy and coping resources, so that heightened
        awareness does not only translate into distress. As the association between
        hurricane stressors and climate anxiety was strongest among individuals with
        high linking social capital, governmental and institutional risk communicators,
        in particular, may wish to attend to the social or emotional\u2014not only
        the informational\u2014consequences of their messages following disaster events.</p>\n<p>Nevertheless,
        these findings collectively contribute to the literature by suggesting that
        the relationship between social capital and climate anxiety is more nuanced
        and there may be different theoretical mechanisms at play when assessing the
        role of social capital in one\u2019s disaster experience. It further underscores
        the complexity of social capital\u2019s role in different disaster scenarios.
        Furthermore, the just mentioned findings regarding social capital may also
        be reflective of the cognitive and structural dimensions of social capital.
        Its cognitive aspect focuses on trust and support perceptions, and they have
        been consistently linked to lowered anxiety and improved mental health state.
        However, studies have found that the structural dimension of social capital,
        indicated by one\u2019s participation or connection to social networks, are
        related to mental health outcomes in more ambiguous ways. For example, Wind
        and colleagues [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref044\">44</xref>]
        found that cognitive social capital was negatively related to mental health
        issues following a disaster, whereas structural social capital exacerbated
        feelings of anxiety. As the current operationalizations of social capital
        did not distinguish the cognitive and structural dimensions, the observed
        moderation relationship may be explained by the mixed effects of cognitive
        versus structural aspects of social capital.</p>\n<p>Finally, although they
        were included as covariates in our models, we again note the following findings.
        First, the measure for generalized anxiety had a stronger association with
        climate anxiety than hurricane stressors did. The simple explanation for this
        is that generalized anxiety and climate anxiety are both anxiety constructs
        and likely share underlying features, even though they remain both conceptually
        distinct in their specific focus or content. On the other hand, hurricane
        stressors are an external, event-based exposure variable, and as such, are
        less proximate to an internalizing symptom measure like climate anxiety. Second,
        income and black race/ethnicity (b around.22) were both positively associated
        with climate anxiety. These findings respectively imply that individuals with
        higher household incomes and those who identify as black may experience greater
        climate anxiety. We speculate that higher-income individuals may be disproportionately
        exposed to climate-related information, which may heighten their climate anxiety.
        Additionally, the well-documented vulnerability of black communities to the
        adverse effects of climate-related disasters such as hurricanes [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref045\">45</xref>] may similarly heighten their awareness
        of and anxiety about climate change. This warrants further investigation about
        potential racial and ethnic differences in climate anxiety. Finally, living
        in South Carolina was negatively associated with climate anxiety. One plausible
        explanation for this finding is the differential impact of Hurricanes Helene
        and Milton across states. While South Carolina was affected by Hurricane Helene,
        the storm\u2019s most severe impacts were concentrated elsewhere. Thus, it
        could be that the South Carolina residents sampled in our study may have experienced
        comparatively less devastation, which may in turn have produced lower levels
        of climate anxiety. Future research could examine this explanation by including
        state-level measures that account for differential hurricane impacts.</p>\n<sec
        id=\"sec019\">\n<title>5.1 Limitations and future directions</title>\n<p>Although
        our study provides interesting results regarding experiencing an environmental
        disaster on people\u2019s information behavior strategies, it has weaknesses
        that must be acknowledged. First, our study utilizes cross-sectional data.
        As a result, the cross-sectional design limits causal inference about whether
        social capital patterns preceded or resulted from hurricane exposure. Thus,
        we recommend future research, such as experimental studies be conducted to
        test whether in fact hurricane stressors are positively predictive of climate
        anxiety.</p>\n<p>Second, potential discrepancies in our measures may have
        influenced our findings. Specifically, while our primary independent variable
        focuses on hurricane-related stressors, the corresponding measure of anxiety
        focuses on the issue of climate change more broadly. The issue here is that
        people may not directly associate hurricane experiences with climate change-specific
        anxiety. To address this issue, future studies should examine general anxiety
        tied to the specific event, to ensure a more precise match between the disaster
        experienced and the anxiety measured.</p>\n<p>Third, regarding the measure
        used for climate change anxiety, we acknowledge that two of the three items
        drawn from Clayton and Karazsia\u2019s climate anxiety scale [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref009\">9</xref>] were taken from the scale\u2019s functional
        impairment subscale, while one was drawn from the cognitive-emotional subscale.
        It could be argued, therefore, that these items more precisely captured climate
        change-related preoccupation or functional impairment, constructs that are
        related to but distinct from core climate symptomology. We note, however,
        that this limitation does not invalidate our findings, but rather contextualizes
        the interpretation of our outcome variable. Specifically, the climate change
        anxiety measure used in our study should be understood as reflecting climate
        change-related cognitive preoccupation and functional impairment rather than
        climate anxiety in its fullest sense. Ultimately, we recommend that future
        research use the full measure of climate change anxiety, which can adequately
        capture both dimensions of climate anxiety conceptualized by Clayton and Karazsia
        (i.e., functional impairment and cognitive-emotional dimensions) [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref009\">9</xref>].</p>\n<p>Fourth, while the Cronbach\u2019s
        alpha for linking social capital in our study (\u03B1\u2009=\u2009.66) fell
        slightly below the conventional.70 threshold, this likely reflects the inherent
        multi-dimensionality of linking social capital as a construct rather than
        poor reliability per se. Cronbach\u2019s alpha assumes unidimensionality [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref046\">46</xref>]. This is a condition
        that works against linking social capital, which captures structurally distinct
        ties between individuals and institutional actors [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref022\">22</xref>]. Yet we should note that the mean inter-item
        correlation for the linking social items in our present study was.41. This
        falls within the acceptable range recommended for multidimensional constructs
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref047\">47</xref>], thus providing
        supplementary evidence of adequate reliability.</p>\n<p>Finally, the data
        analyzed for this study were not representative of the population of interest.
        Nevertheless, we believe the use of a non-probability sample is appropriate
        given the context. Identifying a representative sample of individuals affected
        by hurricanes poses significant challenges, particularly when many potential
        participants are engaged in recovery efforts or may lack the time or resources
        to participate in the current research. Thus, even though these are not representative
        data, we believe it would be difficult to obtain this type of sample given
        the situation after the hurricanes.</p>\n</sec>\n<sec id=\"sec020\" sec-type=\"conclusions\">\n<title>5.2
        Conclusion</title>\n<p>Our findings help extend the stress process model and
        social capital research by showing the more nuanced role of social capital.
        Specifically, we extended understanding of the link between hurricane-related
        stressors among those who have experienced major hurricanes and their levels
        of climate change anxiety, and the role of social capital in conditioning
        this link. We also found some evidence suggesting that bonding social capital\u2019s
        protective role is conditional and reverses under high stress. That is, bonding
        social capital may serve a protective role only when hurricane stressors are
        low, but not when they are high. Furthermore, rather than acting as a protective
        buffer, our study suggested higher levels of bridging and linking social capital
        were associated with more climate anxiety. While these findings for social
        capital may be viewed as more reflective of its \u201Cdark side\u201D potential
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref016\">16</xref>], it is worth
        noting that research suggests climate anxiety is also associated with adaptive
        coping strategies, such as increased engagement in pro-environmental behaviors
        and other actions to address or mitigate climate change [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref048\">48</xref>,<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref049\">49</xref>].
        As such, in cases where social capital strengthens the relationship between
        hurricane stressors and climate anxiety, higher levels of climate anxiety
        may result in adaptive climate-related actions, including greater engagement
        in pro-environmental and climate advocacy behaviors. Since our study did not
        assess climate anxiety\u2019s impact on behaviors, it is important for research
        to further analyze this possibility. Practically, we should consider strengthening
        close social support and basic coping skills before disasters occur and stress
        escalates. Post-disaster efforts should manage information flows with clear
        updates, specific resources, and tips to help those in need, and counter misinformation
        to limit unnecessary anxiety.</p>\n</sec>\n</sec>\n</body>\n<back>\n<ref-list>\n<title>References</title>\n<ref
