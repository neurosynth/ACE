        Has the statistical analysis been performed appropriately and rigorously?--&gt;?&gt;</p>\n<p>Reviewer
        #1:\_Yes</p>\n<p>Reviewer #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>4.
        Have the authors made all data underlying the findings in their manuscript
        fully available (please refer to the Data Availability Statement at the start
        of the manuscript PDF file)??&gt;</p>\n<p>The <ext-link ext-link-type=\"uri\"
        xlink:href=\"https://journals.plos.org/mentalhealth/s/data-availability\"
        xlink:type=\"simple\">PLOS Data policy</ext-link></p>\n<p>Reviewer #1:\_Yes</p>\n<p>Reviewer
        #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p>5. Is the manuscript
        presented in an intelligible fashion and written in standard English??&gt;</p>\n<p>Reviewer
        #1:\_Yes</p>\n<p>Reviewer #2:\_Yes</p>\n<p>Reviewer #3:\_Yes</p>\n<p>**********</p>\n<p><bold>Reviewer
        #1:</bold>\_\_Thank you for your careful revision of the manuscript. The revised
        version successfully addresses the reviewers' comments and demonstrates substantial
        improvements in clarity, coherence, and overall presentation. The study is
        well aligned with the scope of the journal, addressing an important and timely
        topic in mental health with a more clear theoretical framework, appropriate
        methodology, and conclusions that are well supported by the data. These revisions
        have significantly strengthened the manuscript, and I believe it is now suitable
        for publication and will make a valuable contribution to the literature on
        climate-related mental health and disaster recovery.</p>\n<p><bold>Reviewer
        #2:</bold>\_\_This is a substantive effort to address prior concerns.</p>\n<p>Here
        are my comments:</p>\n<p>Abstract</p>\n<p>Add one clause noting that associations
        held after controlling for GAD-7 as it was one of the largest and most robust
        predictors of the model to help readers easily understand the findings.</p>\n<p>Introduction
        &amp; Literature Review</p>\n<p>These sections read well, no major concern
        from my side.</p>\n<p>Materials and Methods</p>\n<p>Only 4 of the 7 standard
        GAD-7 items were used, and no rationale or reliability statistic is reported.
        Given how influential GAD-7 in Table 2, this omission is now more consequential.
        Report reliability for the 4-item measure and briefly justify the subset.</p>\n<p>With
        GAD-7 and climate anxiety both measured, reporting their bivariate correlation
        becomes essential. If that correlation is high, it raises a multicollinearity/construct-overlap
        question.</p>\n<p>Results</p>\n<p>Income (b around .054\u2013.056) and Black
        race/ethnicity (b around .22) are both significant positive predictors of
        climate anxiety, and South Carolina residence is a significant negative predictor
        (b around -.23 to -.25) relative to the Florida reference group. None of these
        is mentioned anywhere in Results or Discussion.</p>\n<p>The GAD-7's own effect
        size is large across all three models is more than double the effect size
        of hurricane stressor. This deserves explicit reporting and interpretation
        in Results.</p>\n<p>Table 2 reports R\xB2 for the three models but there is
        no \u0394R\xB2 comparing models with vs. without the GAD-7. A reader cannot
        tell how much unique variance generalized anxiety accounts for versus the
        focal predictors. Report \u0394R\xB2 (or a hierarchical entry step) for the
        GAD-7 covariate specifically.</p>\n<p>Discussion</p>\n<p>GAD-7, Income, Racial
        disparity, State-level effect all of them need to be explicitly address in
        the Discussion section.</p>\n<p><bold>Reviewer #3:</bold>\_\_Congratulations!</p>\n<p>**********</p>\n<p><ext-link
