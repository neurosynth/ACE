        xlink:type=\"simple\">Creative Commons Attribution License</ext-link>, which
        permits unrestricted use, distribution, and reproduction in any medium, provided
        the original author and source are credited.</license-p></license>\n</permissions>\n<self-uri
        content-type=\"pdf\" xlink:href=\"info:doi/10.1371/journal.pmen.0000749\"/>\n<abstract>\n<p>This
        study examined how hurricane stressors and three forms of social capital\u2014bonding,
        bridging, and linking\u2014are associated with climate anxiety, and whether
        the three forms of social capital would moderate the relationship between
        hurricane stressors and climate anxiety. We analyzed data from a cross-sectional
        survey (<italic>N</italic>\u2009=\u20091,342) administered in Georgia, North
        Carolina, and South Carolina following Hurricane Helene and in Florida following
        Hurricane Milton in 2024. Results showed that hurricane stressors were positively
        associated with climate anxiety, and these associations held after controlling
        for symptoms of generalized anxiety. Findings also revealed a nuanced role
        of social capital. Bonding social capital had a direct negative association
        with climate anxiety. However, our results suggested that bonding social capital\u2019s
        protective role is conditional and reverses under high stress. That is, bonding
        social capital weakened the relationship between hurricane stressors and climate
        anxiety only when hurricane stressors were low. As stressors accumulated,
        bonding social capital strengthened the association between stressors and
        climate anxiety. In contrast, both bridging and linking social capital were
        positively associated with climate anxiety and strengthened the positive relationship
        between hurricane stressors and climate anxiety. We discussed theoretical
        insights and practical implications.</p>\n</abstract>\n<funding-group>\n<funding-statement>The
        author(s) received no specific funding for this work.</funding-statement>\n</funding-group>\n<counts>\n<fig-count
        count=\"3\"/>\n<table-count count=\"3\"/>\n<page-count count=\"16\"/>\n</counts>\n<custom-meta-group>\n<custom-meta
        id=\"data-availability\">\n<meta-name>Data Availability</meta-name>\n<meta-value>The
        data analyzed in this study can be accessed on the following Open Society
        Foundations (OSF) page: <ext-link ext-link-type=\"uri\" xlink:href=\"https://osf.io/adg8f/overview\"
        xlink:type=\"simple\">https://osf.io/adg8f/overview</ext-link>.</meta-value>\n</custom-meta>\n</custom-meta-group>\n</article-meta>\n</front>\n<body>\n<sec
        id=\"sec001\" sec-type=\"intro\">\n<title>1. Introduction</title>\n<p>The
        Southeastern region of the United States experienced the compounded destructive
        effects of Hurricanes Helene and Milton during the fall of 2024 [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref001\">1</xref>,<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref002\">2</xref>].
        The intensities of both hurricanes have been linked to climate change [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref003\">3</xref>]. In the aftermath
        of these storms, news media reported that, beyond physical destruction, Hurricanes
        Helene and Milton had significant negative impacts on survivors\u2019 mental
        health [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref004\">4</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref005\">5</xref>]. These accounts are
        consistent with past studies providing compelling evidence that extreme weather
        events, including hurricanes, impose significant psychological strain, including
        heightened anxiety [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref006\">6</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref007\">7</xref>]. Prior research particularly
        demonstrates that individuals who experience hurricane stressors\u2014such
        as personal losses, injuries, or other disruptions\u2014may face an increased
        risk of developing climate anxiety [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref008\">8</xref>],
        a form of distress distinct from generalized anxiety and defined as emotional
        or psychological distress marked by heightened fear and constant worrying
        about the climate crisis [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref009\">9</xref>].</p>\n<p>Against
        the backdrop of studies examining climate anxiety, another line of research
        has highlighted the protective role of social capital, or social connections
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref010\">10</xref>], in mitigating
        distress associated with natural disasters [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref011\">11</xref>].
        Indeed, a long-established area of disaster research suggests that social
        capital could shape how communities respond to climate-related hazards and
        influence their capacity for recovery [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref012\">12</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref013\">13</xref>]. Despite this evidence,
        little is known about how social capital relates to climate anxiety, or whether
        social capital may moderate the psychological effects of hurricane stressors.</p>\n<p>To
        bridge the above-noted research gaps, the present study seeks to accomplish
        three goals. First, within the context of the recovery from Hurricanes Helene
        and Milton, we assess the relationship between hurricane stressors and climate
        anxiety. Second, we examine the relationship between social capital and climate
        anxiety. Third, we explore whether social capital moderates the relationship
        between hurricane stressors and climate anxiety. We analyze data from online
        surveys conducted in late 2024 with residents of U.S. Federal Emergency Management
        Agency (FEMA)-declared disaster counties in Georgia, North Carolina, and South
        Carolina, following Hurricane Helene, and in Florida following Hurricane Helene/Milton.</p>\n</sec>\n<sec
        id=\"sec002\">\n<title>2. Literature review</title>\n<sec id=\"sec003\">\n<title>2.1
        Hurricane stressors and climate anxiety</title>\n<p>The present study is guided
        by three theoretical frameworks to explain the relationship between hurricane
        stressors and climate anxiety: the stress process model, the environmental
        identity framework, and the concept of eco-grief.</p>\n<p>This stress process
        model provides a framework that explains the relationships between stressors,
        resources, and mental health outcomes [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref014\">14</xref>].
        According to this model, stressors, which are acute or chronic disruptive
        events (e.g., adversities due to a hurricane), trigger mental health responses,
        such as increased anxiety. The model also views resources as central in explaining
        how a stressor affects mental health outcomes. That is, the extent to which
        a stressor impacts one\u2019s mental health could be conditioned by the resources
        one has available to cope with the stressor. As we will discuss below, resources
        facilitated by social ties could play a role in moderating the relationship
        between hurricane stressors and climate-induced anxiety.</p>\n<p>Based on
        the stress process model, we first predict that hurricane stressors would
        be positively associated with climate anxiety. As mentioned, hurricane stressors
        refer to the adversities and critical losses of resources that one experiences
        due to a hurricane [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref015\">15</xref>].
        Such stressors can range from losing access to resources such as food, water,
        shelter, or electricity to experiencing injuries. Climate anxiety is a form
        of environment-related distress specifically tied to the perceived threat
        of climate change [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref016\">16</xref>],
        manifesting as extreme and persistent concern and rumination about climate
        change [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref009\">9</xref>]. A recent
        study conducted by Asgarizadeh et al. showed that personal past experiences
        with climate-related events was associated with heightened levels of anxiety
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref017\">17</xref>].</p>\n<p>Yet
        we note that direct experiences with hurricane stressors could plausibly produce
        generalized anxiety. As stated, research has specifically established a positive
        relationship between experiencing stressful hurricane events and increased
        levels of psychological distress [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref008\">8</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref018\">18</xref>], including anxiety
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref019\">19</xref>,<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref020\">20</xref>]. For instance, in their study of individuals
        who experienced Hurricane Katrina, Galea et al. found that hurricane-related
        stressors, namely, experiencing property loss, physical injury, and physical
        adversity, were positively associated with symptoms of anxiety [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref006\">6</xref>].</p>\n<p>However, climate anxiety represents
        a theoretically and empirically distinct outcome. Generalized anxiety is characterized
        by diffuse, object-independent excessive worry about a number of events, disproportionate
        to the actual likelihood or impact of those events [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref021\">21</xref>]. Climate anxiety, on the other hand,
        is object-specific and ecologically grounded and reflects an appraisal of
        systemic environmental threat rather than a pathological response to personal
        danger. Indeed, Clayton and Karazsia\u2019s [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref009\">9</xref>]
        work has demonstrated empirically that climate anxiety is distinct from general
        psychological distress, establishing it as a separate construct warranting
        independent investigation. In a 5-year cohort survey of Texas and Florida
        residents who directly experienced category 3 or higher hurricanes, Garfin
        and Wong-Parodi found that having previous direct exposure to hurricanes,
        measured with items such as having a home destroyed, losing property or a
        pet, and knowing someone who was injured, was positively associated with climate
        anxiety [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref008\">8</xref>].</p>\n<p>Complementing
        the stress process model, the framework of environmental identity [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref022\">22</xref>] and the concept of ecological grief
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref023\">23</xref>] provide the
        psychological mechanism for why directly experiencing hurricane stressors
        activates this climate-specific form of anxiety rather than generalized distress.
        First, on a cognitive level, environmental identity (EID) represents a sense
        of connection to the non-human natural environment influencing how individuals
        perceive and act toward the environment [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref022\">22</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref024\">24</xref>]. For people with
        strong EID, the natural environment plays an important role in their self-concept
        and who they are. Having a strong EID is positively linked with pro-environmental
        attitudes and behaviors [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref022\">22</xref>],
        as well as climate change risk perception and climate anxiety [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref025\">25</xref>]. While EID varies across individuals,
        the EID framework suggests that in processing the destruction resulting from
        a major hurricane, people may interpret such an event through an ecological
        framework. That is, through an ecological lens, hurricane-related stressors
        such as losses, damages, and adversities may not be perceived solely as personal
        misfortune. Rather, experiencing such stressors may serve as evidence of a
        larger, systemic environmental threat posed by climate change, thereby activating
        climate-specific anxiety rather than generalized anxiety. Furthermore, through
        an ecological lens, the losses and damages experienced because of an extreme
        weather event or natural disaster, such as a major hurricane, may manifest
        affectively as ecological grief, which refers to grief felt in response to
        experienced or anticipated ecological losses [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref023\">23</xref>].
        As grief itself has been known to associate with anxiety, researchers have
        found that ecological grief is associated with eco-related anxiety [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref023\">23</xref>,<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref026\">26</xref>]. In sum, environmental identity and
        ecological grief provide the psychological mechanism explaining why hurricane
        stressor experience produces climate anxiety as a distinct outcome rather
        than undifferentiated psychological distress.</p>\n<p>Based on the literature
        above, we propose the following hypothesis:</p>\n<p><bold>H1:</bold> Hurricane
        stressors will be positively associated with climate anxiety.</p>\n</sec>\n<sec
        id=\"sec004\">\n<title>2.2 Social capital</title>\n<p>Our study also examines
        the potential relationship between social capital and climate anxiety. Social
        capital refers to social ties and informal or formal connections that enable
        individuals to develop norms of trust, reciprocity, and honesty [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref010\">10</xref>]. People with higher social capital
        tend to be more likely to engage in collective action, ranging from joining
        or volunteering for community organizations to watching over their neighbors\u2019
        properties [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref010\">10</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref027\">27</xref>]. Scholars have identified
        three forms of social capital: bonding, bridging, and linking. Bonding, or
        homophilous social capital, refers to the strong ties one has with kin and
        close friends [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref028\">28</xref>].
        Such ties offer emotional support and build shared identity, although they
        tend to form among those who already share similar values and goals. In contrast
        to bonding social capital, bridging and linking social capital are both considered
        heterophilous, as they involve ties among individuals of diverse groups [<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref028\">28</xref>]. Bridging and linking
        social capital are typically facilitated through participation in political,
        civic, religious, and work-related activities. Such activities lean toward
        being goal-oriented and offer networking opportunities and access to external
        resources via extra-community ties [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref028\">28</xref>].
        However, bridging and linking social capital are conceptually distinct. Bridging
        social capital involves horizontal connections between people from different
        groups and social levels, while linking social capital represents vertical
        connections between people of varying levels of power (e.g., being connected
        to public officials).</p>\n<p>Social capital may serve a protective role against
        distress experienced because of disasters. For instance, a study conducted
        in Japan during the recovery from the 2011 Fukushima nuclear power plant disaster
        showed that higher levels of social capital were associated with experiencing
        less anxiety [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref011\">11</xref>].
        The central mechanism underlying social capital\u2019s protective role against
        distress is its capacity to facilitate the support that enables individuals
        to cope with a disaster. For example, Hawkins and Maurer [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref029\">29</xref>] analyzed social capital during the
        recovery period following Hurricane Katrina. They found that bonding social
        capital effectively fostered immediate support after the hurricane. That is,
        during the period immediately after Hurricane Katrina, most individuals who
        experienced the storm first received or lent help to their families or others
        in their immediate networks. Moreover, bridging and linking social capital,
        which connect individuals from different backgrounds, could facilitate access
        to resources needed to recover from a natural disaster [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref029\">29</xref>]. Bridging and linking social capital
        could serve as sources for instrumental support, or tangible resources, after
        a disaster such as a hurricane [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref029\">29</xref>].
        Examples of instrumental support in the context of hurricane recovery include
        receiving water, food, shelter, or financial assistance. Linking social capital,
        in particular, which encompasses connections between people of varying levels
        of power or authority (e.g., knowing a government official), could open access
        to resources that one would not otherwise have available [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref028\">28</xref>]. Having access to resources is important
        when navigating through or coping with stressful experiences. After a hurricane,
        those with connections to government officials or institutions may be the
        first to know where to look for governmental aid or how to apply for disaster
        relief. In this case, as Hawkins and Maurer\u2019s work suggests, bridging
        and linking social capital may be more important than bonding social capital
        for sustaining the long-term post-hurricane recovery and revitalization of
        a community [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref029\">29</xref>].</p>\n<p>However,
        it is important to acknowledge that a line of work informed by Portes indicates
        that social capital may have a \u201Cdark side\u201D [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref030\">30</xref>]. That is, it may result in negative
        consequences in relation to disaster resilience and mental health [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref031\">31</xref>\u2013<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref033\">33</xref>].
        For instance, disaster literature points to the \u201Ccontagion of stress\u201D
        effect of social capital among close-knit communities [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref031\">31</xref>]. Specifically, in cohesive communities,
        the stress experienced by one individual can easily spread through a well-connected
        social network, creating a contagion that then amplifies the entire community\u2019s
        anxiety levels [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref033\">33</xref>].
        Bonding social capital, which is based on strong ties shared among homogenous
        group members, may potentially heighten anxiety about climate change if such
        ties include individuals who already feel extremely anxious about the climate
        crisis. Thus, individuals within bonding social networks may also face similar
        challenges and experience similar levels of climate anxiety due to the homogeneity
        of such networks. Additionally, higher bridging and linking social capital
        increases the potential of being exposed to a wide range of information regarding
        climate change, particularly, those pertaining to climate threats. As previous
        research has found, exposure to information about the impacts of climate change
        is associated with heightened levels of climate anxiety [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref016\">16</xref>].</p>\n<p>In sum, the research to date
        indicates that social capital can serve a protective role against distress
        [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref011\">11</xref>,<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref028\">28</xref>,<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref029\">29</xref>].
        However, a specific line of research suggests social capital may function
        as a double-edged sword, exerting both positive and negative effects on disaster
        resilience [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref032\">32</xref>]
        and health outcomes [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref033\">33</xref>].
        In acknowledging the positive and negative aspects of social capital, we propose
        the following:</p>\n<p><bold>RQ1:</bold> How are (a) bonding, (b) bridging,
        and (c) linking social capital differentially associated with climate anxiety?</p>\n<p>We
        also examine the possibility that social capital would moderate the proposed
        relationship between hurricane stressors and climate anxiety. As previously
        stated, the stress process model views resources as central in explaining
        how a stressor affects mental health outcomes [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref014\">14</xref>].
        This model suggests that resources, such as those facilitated through social
        capital, would condition the effects that stressors have on mental health
        outcomes [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref015\">15</xref>].
        First, on the one hand, extant research supports a \u201Cbuffering\u201D potential
        of social capital. That is, it could help mitigate various forms of psychological
        distress and enhance mental health [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref034\">34</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref035\">35</xref>]. Such research specifically
        suggests that social capital markedly buffers the distress associated with
        experiencing a disaster [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref011\">11</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref036\">36</xref>]. An explanation for
        social capital\u2019s \u201Cbuffering\u201D potential is that it fosters the
        support and resources necessary to cope with a natural disaster.</p>\n<p>On
        the other hand, we also noted the \u201Cdark side\u201D potential of social
        capital [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref030\">30</xref>]. That
        is, it is possible that the stresses experienced because of a hurricane may
        be amplified by social capital, which would then result in heightened climate
        anxiety. Disaster literature points to the \u201Ccontagion of stress\u201D
        effect of social capital among close-knit communities [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref031\">31</xref>]. For instance, in cohesive communities,
        the stress experienced by one individual can easily spread through a well-connected
        social network, creating a contagion that then amplifies the entire community\u2019s
        anxiety levels [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref033\">33</xref>].</p>\n<p>In
        sum, the above literature suggests that social capital can both buffer and
        amplify the relationship between hurricane stressors and climate anxiety.
        However, the empirical evidence on how different types of social capital\u2014bonding,
        bridging, or linking\u2014can differently shape climate anxiety or moderate
        the psychological impact of hurricane stressors on anxiety, remains significantly
        under-explored. Instead of hypothesizing a uniform buffering effect, we propose
        the following research question:</p>\n<p><bold>RQ2:</bold> How will (a) bonding,
        (b) bridging, and (c) linking social capital moderate the proposed positive
        association between hurricane stressors and climate anxiety?</p>\n</sec>\n</sec>\n<sec
        id=\"sec005\" sec-type=\"materials|methods\">\n<title>3. Materials and methods</title>\n<sec
        id=\"sec006\">\n<title>3.1 Ethics statement</title>\n<p>The survey and study
        were approved by the Institutional Review Board (IRB) for human subjects research
        based at the University of Florida, Gainesville, FL, USA [IRB Protocol # ET00043626,
        Approval date: October 10, 2024] prior to data collection. Electronic informed
        consent, specifically, active consent via a click-through process, was ensured
        before participants were allowed to complete the survey. That is, prior to
        completing the online survey, participants read a cover page that informed
        them about the survey and study\u2019s purpose, the voluntary nature of the
        study, and that their responses would remain anonymous. The bottom of the
        informed consent page contained instructions stating that if participants
        agreed to participate, they could click on the \u201CI agree to participate\u201D
        button to continue; however, if they did not consent to participate, they
        could click on the \u201CI do not wish to participate\u201D button or just
        close the browser window.</p>\n</sec>\n<sec id=\"sec007\">\n<title>3.2 Procedure
        and participants</title>\n<p>This cross-sectional study utilized online surveys
        targeting residents of counties with FEMA disaster declarations in Georgia,
        North Carolina, and South Carolina following Hurricane Helene and in Florida
        following both Helene and Milton. We contracted Qualtrics to collect the data
        and administer the survey. Quota sampling was used to ensure representation
        across demographic characteristics, including age and sex. In Georgia, North
        Carolina, and South Carolina, surveys were administered in late October 2024,
        roughly one month after Hurricane Helene made landfall, through the end of
        November 2024 (recruitment of participants commenced on October 30, 2024,
        and ended on November 28, 2024). In Florida, the survey was administered through
        November 2024, about a month after Hurricane Milton made landfall (recruitment
        of participants commenced on November 9, 2024, and ended on November 21, 2024).
        In total, there were 3,329 completion attempts. Participants who did not consent
        to taking the survey, sped through the survey, or indicated that they did
        not live in a county impacted by either of the hurricanes, were excluded.
        This left a final sample size of <italic>N</italic>\u2009=\u20091,342. The
        completion rate was 40%.</p>\n</sec>\n<sec id=\"sec008\">\n<title>3.3 Measures</title>\n<sec
        id=\"sec009\">\n<title>3.3.1 Hurricane stressors.</title>\n<p>We asked participants
        whether, in the past month, they had indirectly or directly experienced hurricane-related
        stressors from Hurricane Helene/Milton. We listed the following six stressors:
        (a) lack of any resource (food, water, shelter, electricity) for over a week,
        (b) loss of sentimental possessions or pets, (c) self or household member
        had health problems, (d) financial loss, (e) housing situation changed as
        a result of the hurricane, and (f) experienced any issues with mold, contamination,
        or structural damage in your home due to the hurricane. The first four items
        were adapted from Lowe et al. [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref015\">15</xref>]
        and we created the two remaining items. Responses to all the items for hurricane-related
        stressors were scored with 1\u2009=\u2009yes, 0\u2009=\u2009no. We summed
        and combined the items to form a single measure (<italic>M</italic>\u2009=\u20092.32,
        <italic>SD</italic>\u2009=\u20091.91, \u03B1\u2009=\u2009.77).</p>\n</sec>\n<sec
        id=\"sec010\">\n<title>3.3.2 Climate change anxiety.</title>\n<p>Three items
        from Clayton and Karazsia\u2019s climate anxiety scale were used [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref009\">9</xref>]: (a) thinking about climate change makes
        it difficult for me to concentrate, (b) I have nightmares about climate change,
        and (c) my friends say I think about climate change too much [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref009\">9</xref>]. Responses were measured along a 5-point
        scale (1\u2009=\u2009strongly disagree, 5\u2009=\u2009strongly agree), then
        we averaged and combined the items to form a single measure (<italic>M</italic>\u2009=\u20092.47,
        <italic>SD</italic>\u2009=\u20091.07, a\u2009=\u2009.85).</p>\n</sec>\n<sec
        id=\"sec011\">\n<title>3.3.3 Social capital.</title>\n<p>Drawing on prior
        work on personal social capital, online/social-media-enabled social capital,
        bonding and bridging social capital, and linking social capital in disaster
        recovery, we adapted items to assess three forms of social capital relevant
        to post-disaster coping and resource access [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref029\">29</xref>,<xref
        ref-type=\"bibr\" rid=\"pmen.0000749.ref037\">37</xref>\u2013<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref039\">39</xref>]. Bonding social capital captured access
        to close interpersonal support, bridging social capital captured access to
        resources and information beyond one\u2019s immediate family or close friends,
        and linking social capital captured perceived access to government-related
        contacts, information, and disaster-relief resources.</p>\n<p><italic>Bonding</italic>
        social capital was measured with the following items: (a) I have people I
        can turn to and ask for help, (b) there is someone I can talk about my problems
        with, and (c) there is someone who can give me emotional support (1\u2009=\u2009strongly
        disagree, 5\u2009=\u2009strongly agree). The items were averaged and combined
        to form a single measure (<italic>M</italic>\u2009=\u20093.79, <italic>SD</italic>\u2009=\u2009.98,
        \u03B1\u2009=\u2009.88).</p>\n<p><italic>Bridging</italic> social capital
        was measured with three items: (a) I know someone with resources that my family
        or friends do not have, (b) there are people I can turn to for new job opportunities,
        and (c) I know someone who can help me learn about things that happen outside
        my community (1\u2009=\u2009strongly disagree, 5\u2009=\u2009strongly agree).
        We averaged and combined these items to form a single measure (<italic>M</italic>\u2009=\u20093.29,
        <italic>SD</italic>\u2009=\u2009.94, \u03B1 =\u2009.74).</p>\n<p><italic>Linking</italic>
        social capital was measured with the following three items: (a) I know someone
        who works in the government, (b) I know how to apply for disaster relief from
        the government, and (c) I know where to look for governmental aid during disasters
        (1\u2009=\u2009strongly disagree, 5\u2009=\u2009strongly agree). We averaged
        and combined the items to form a single measure (<italic>M</italic>\u2009=\u20093.08,
        <italic>SD</italic>\u2009=\u2009.95, \u03B1\u2009=\u2009.66).</p>\n</sec>\n<sec
        id=\"sec012\">\n<title>3.3.4 Covariates.</title>\n<p>We measured and controlled
        for age, biological sex, state (Florida, Georgia, North Carolina, South Carolina),
        educational attainment (continuous), income (continuous), race and ethnicity,
        and political orientation (1\u2009=\u2009very conservative, 5\u2009=\u2009very
        liberal). For state, Florida was treated as the reference group in all the
        regression models as discussed in our analytical strategy below. We thus included
        only Georgia, North Carolina, and South Carolina as covariates in the regression
        models. For race, White was treated as the reference group, and only Non-White
        Hispanic or Latino, Black, Asian and other ethnicities as covariates in our
        regression models. We also included a measure for generalized anxiety as a
        covariate [<xref ref-type=\"bibr\" rid=\"pmen.0000749.ref040\">40</xref>],
        which included the following four items adapted from the GAD-7 that asked
        respondents whether in the last 2 weeks, how often they had experienced the
        following: (a) been bothered by feeling nervous, anxious, or on edge, (b)
        been bothered by not being able to stop or control worrying, (c) been bothered
        by worrying too much about different things, and (d) been bothered by having
        trouble relaxing. Responses were averaged and combined to form a single measure
        (<italic>M</italic>\u2009=\u20092.17, <italic>SD</italic>\u2009=\u2009.96;
        \u03B1\u2009=\u2009.93). Finally, the bonding, bridging, and linking social
        capital were included as covariates when they were not respectively entered
        as moderators.</p>\n</sec>\n</sec>\n<sec id=\"sec013\">\n<title>3.4 Data analysis
        strategy</title>\n<p>All analyses were performed using SPSS version 30 and
        the regression analyses were performed using the PROCESS macro [<xref ref-type=\"bibr\"
        rid=\"pmen.0000749.ref041\">41</xref>]. Listwise deletion was used to deal
        with missing data, and as such, all analyses were performed on complete data
        (<italic>n</italic>\u2009=\u20091,327). To test H1 and investigate RQ, we
        used PROCESS Model 1 to estimate three separate moderation analyses, each
        respectively examining one form of social capital (bonding, bridging, and
        linking social capital) as a moderator of the hurricane stressor-climate anxiety
        relationship. This approach allowed us to isolate the unique moderating effect
        of each social capital type while controlling for the others. Ninety-five
        percent bootstrap confidence intervals (CIs) with 5,000 resamples were generated
        for inference tests. The hypothesized moderation effects were assessed at
        the analytical mean and one standard deviation below and above the mean of
        each social capital variable. All predictors (hurricane stressors and the
        three social capital variables) were mean-centered prior to analysis for the
        purpose of interpreting the correlation when the interaction term was added
        in the model. The covariates previously identified were included in all regression
        analyses. We note that prior to analyzing the data, we also inspected the
        zero-order correlation between the measure of generalized anxiety and climate
        change anxiety, which was <italic>r</italic>\u2009=\u2009.24 (<italic>p</italic>\u2009&lt;\u2009.05).
        This level of correlation does not raise concerns about multicollinearity.
        Lastly, all regression coefficients reported below are unstandardized (<italic>b</italic>).</p>\n</sec>\n</sec>\n<sec
        id=\"sec014\" sec-type=\"results\">\n<title>4. Results</title>\n<sec id=\"sec015\">\n<title>4.1
        Sample characteristics</title>\n<p>Participant characteristics are reported
        in <xref ref-type=\"table\" rid=\"pmen.0000749.t001\">Table 1</xref>. The
        mean age of participants was 46.03 years (<italic>SD</italic>\u2009=\u200917.33).
        There were also slightly more males (55.1%) than females (44.9%), a majority
        of the sample resided in Florida (53.5%), and most identified as White (63%)
        and politically moderate (39.3%). Finally, the median education level reported
        was \u201Cone or more years of college,\u201D and the median annual income
        reported was between \u201C$40,000-$59,999.\u201D</p>\n<table-wrap id=\"pmen.0000749.t001\"
