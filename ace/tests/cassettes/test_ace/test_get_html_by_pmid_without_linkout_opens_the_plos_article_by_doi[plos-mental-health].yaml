        type=\"text/javascript\"></script>\n<script src=\"/resource/js/components/figure_carousel.js\"
        type=\"text/javascript\"></script>\n<script src=\"/resource/js/vendor/jquery.dotdotdot.js\"
        type=\"text/javascript\"></script>\n\n\n        <div class=\"article-text\"
        id=\"artText\">\n          \n\n\n\n<div xmlns:plos=\"http://plos.org\" class=\"abstract
        toc-section abstract-type-\"><a id=\"abstract0\" name=\"abstract0\" data-toc=\"abstract0\"
        class=\"link-target\" title=\"Abstract\"></a><h2>Abstract</h2><div class=\"abstract-content\"><a
        id=\"article1.front1.article-meta1.abstract1.p1\" name=\"article1.front1.article-meta1.abstract1.p1\"
        class=\"link-target\"></a><p>This study examined how hurricane stressors and
        three forms of social capital\u2014bonding, bridging, and linking\u2014are
        associated with climate anxiety, and whether the three forms of social capital
        would moderate the relationship between hurricane stressors and climate anxiety.
        We analyzed data from a cross-sectional survey (<em>N</em>\u2009=\u20091,342)
        administered in Georgia, North Carolina, and South Carolina following Hurricane
        Helene and in Florida following Hurricane Milton in 2024. Results showed that
        hurricane stressors were positively associated with climate anxiety, and these
        associations held after controlling for symptoms of generalized anxiety. Findings
        also revealed a nuanced role of social capital. Bonding social capital had
        a direct negative association with climate anxiety. However, our results suggested
        that bonding social capital\u2019s protective role is conditional and reverses
        under high stress. That is, bonding social capital weakened the relationship
        between hurricane stressors and climate anxiety only when hurricane stressors
        were low. As stressors accumulated, bonding social capital strengthened the
        association between stressors and climate anxiety. In contrast, both bridging
        and linking social capital were positively associated with climate anxiety
        and strengthened the positive relationship between hurricane stressors and
        climate anxiety. We discussed theoretical insights and practical implications.</p>\n</div></div>\n\n\n<div
        xmlns:plos=\"http://plos.org\" class=\"articleinfo\"><p><strong>Citation:
        </strong>Dalisay F, Liu W, Yamamoto M, Chu H, Hmielowski J, Hong Y-R, et al.
        \ (2026) Associations between hurricane stressors, social capital, and climate
        anxiety among individuals who experienced Hurricanes Helene and Milton. PLOS
        Ment Health 3(10):\n           e0000749.\n        \n        https://doi.org/10.1371/journal.pmen.0000749</p><p><strong>Editor:
        </strong>Marc Eric Santos Reyes, University of Santo Tomas College of Science,
        PHILIPPINES</p><p><strong>Received: </strong>December 15, 2025; <strong>Accepted:
        </strong>September 22, 2026; <strong>Published: </strong> October 13, 2026</p><p><strong>Copyright:
        </strong> \xA9 2026 Dalisay et al. This is an open access article distributed
        under the terms of the <a href=\"http://creativecommons.org/licenses/by/4.0/\">Creative
        Commons Attribution License</a>, which permits unrestricted use, distribution,
        and reproduction in any medium, provided the original author and source are
        credited.</p><p><strong>Data Availability: </strong>The data analyzed in this
        study can be accessed on the following Open Society Foundations (OSF) page:
        <a href=\"https://osf.io/adg8f/overview\">https://osf.io/adg8f/overview</a>.</p><p><strong>Funding:
        </strong>The author(s) received no specific funding for this work.</p><p><strong>Competing
        interests: </strong> The authors have declared that no competing interests
        exist.</p></div>\n\n\n\n\n\n<div xmlns:plos=\"http://plos.org\" id=\"section1\"
        class=\"section toc-section\"><a id=\"sec001\" name=\"sec001\" data-toc=\"sec001\"
        class=\"link-target\" title=\"1. Introduction\"></a><h2>1. Introduction</h2><a
        id=\"article1.body1.sec1.p1\" name=\"article1.body1.sec1.p1\" class=\"link-target\"></a><p>The
        Southeastern region of the United States experienced the compounded destructive
        effects of Hurricanes Helene and Milton during the fall of 2024 [<a href=\"#pmen.0000749.ref001\"
        class=\"ref-tip\">1</a>,<a href=\"#pmen.0000749.ref002\" class=\"ref-tip\">2</a>].
        The intensities of both hurricanes have been linked to climate change [<a
        href=\"#pmen.0000749.ref003\" class=\"ref-tip\">3</a>]. In the aftermath of
        these storms, news media reported that, beyond physical destruction, Hurricanes
        Helene and Milton had significant negative impacts on survivors\u2019 mental
        health [<a href=\"#pmen.0000749.ref004\" class=\"ref-tip\">4</a>,<a href=\"#pmen.0000749.ref005\"
        class=\"ref-tip\">5</a>]. These accounts are consistent with past studies
        providing compelling evidence that extreme weather events, including hurricanes,
        impose significant psychological strain, including heightened anxiety [<a
        href=\"#pmen.0000749.ref006\" class=\"ref-tip\">6</a>,<a href=\"#pmen.0000749.ref007\"
        class=\"ref-tip\">7</a>]. Prior research particularly demonstrates that individuals
        who experience hurricane stressors\u2014such as personal losses, injuries,
        or other disruptions\u2014may face an increased risk of developing climate
        anxiety [<a href=\"#pmen.0000749.ref008\" class=\"ref-tip\">8</a>], a form
        of distress distinct from generalized anxiety and defined as emotional or
        psychological distress marked by heightened fear and constant worrying about
        the climate crisis [<a href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>].</p>\n<a
        id=\"article1.body1.sec1.p2\" name=\"article1.body1.sec1.p2\" class=\"link-target\"></a><p>Against
        the backdrop of studies examining climate anxiety, another line of research
        has highlighted the protective role of social capital, or social connections
        [<a href=\"#pmen.0000749.ref010\" class=\"ref-tip\">10</a>], in mitigating
        distress associated with natural disasters [<a href=\"#pmen.0000749.ref011\"
        class=\"ref-tip\">11</a>]. Indeed, a long-established area of disaster research
        suggests that social capital could shape how communities respond to climate-related
        hazards and influence their capacity for recovery [<a href=\"#pmen.0000749.ref012\"
        class=\"ref-tip\">12</a>,<a href=\"#pmen.0000749.ref013\" class=\"ref-tip\">13</a>].
        Despite this evidence, little is known about how social capital relates to
        climate anxiety, or whether social capital may moderate the psychological
        effects of hurricane stressors.</p>\n<a id=\"article1.body1.sec1.p3\" name=\"article1.body1.sec1.p3\"
        class=\"link-target\"></a><p>To bridge the above-noted research gaps, the
        present study seeks to accomplish three goals. First, within the context of
        the recovery from Hurricanes Helene and Milton, we assess the relationship
        between hurricane stressors and climate anxiety. Second, we examine the relationship
        between social capital and climate anxiety. Third, we explore whether social
        capital moderates the relationship between hurricane stressors and climate
        anxiety. We analyze data from online surveys conducted in late 2024 with residents
        of U.S. Federal Emergency Management Agency (FEMA)-declared disaster counties
        in Georgia, North Carolina, and South Carolina, following Hurricane Helene,
        and in Florida following Hurricane Helene/Milton.</p>\n</div>\n\n<div xmlns:plos=\"http://plos.org\"
        id=\"section2\" class=\"section toc-section\"><a id=\"sec002\" name=\"sec002\"
        data-toc=\"sec002\" class=\"link-target\" title=\"2. Literature review\"></a><h2>2.
        Literature review</h2>\n<div id=\"section1\" class=\"section toc-section\"><a
        id=\"sec003\" name=\"sec003\" class=\"link-target\" title=\"2.1 Hurricane
        stressors and climate anxiety\"></a>\n<h3>2.1 Hurricane stressors and climate
        anxiety</h3>\n<a id=\"article1.body1.sec2.sec1.p1\" name=\"article1.body1.sec2.sec1.p1\"
        class=\"link-target\"></a><p>The present study is guided by three theoretical
        frameworks to explain the relationship between hurricane stressors and climate
        anxiety: the stress process model, the environmental identity framework, and
        the concept of eco-grief.</p>\n<a id=\"article1.body1.sec2.sec1.p2\" name=\"article1.body1.sec2.sec1.p2\"
        class=\"link-target\"></a><p>This stress process model provides a framework
        that explains the relationships between stressors, resources, and mental health
        outcomes [<a href=\"#pmen.0000749.ref014\" class=\"ref-tip\">14</a>]. According
        to this model, stressors, which are acute or chronic disruptive events (e.g.,
        adversities due to a hurricane), trigger mental health responses, such as
        increased anxiety. The model also views resources as central in explaining
        how a stressor affects mental health outcomes. That is, the extent to which
        a stressor impacts one\u2019s mental health could be conditioned by the resources
        one has available to cope with the stressor. As we will discuss below, resources
        facilitated by social ties could play a role in moderating the relationship
        between hurricane stressors and climate-induced anxiety.</p>\n<a id=\"article1.body1.sec2.sec1.p3\"
        name=\"article1.body1.sec2.sec1.p3\" class=\"link-target\"></a><p>Based on
        the stress process model, we first predict that hurricane stressors would
        be positively associated with climate anxiety. As mentioned, hurricane stressors
        refer to the adversities and critical losses of resources that one experiences
        due to a hurricane [<a href=\"#pmen.0000749.ref015\" class=\"ref-tip\">15</a>].
        Such stressors can range from losing access to resources such as food, water,
        shelter, or electricity to experiencing injuries. Climate anxiety is a form
        of environment-related distress specifically tied to the perceived threat
        of climate change [<a href=\"#pmen.0000749.ref016\" class=\"ref-tip\">16</a>],
        manifesting as extreme and persistent concern and rumination about climate
        change [<a href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>]. A recent
        study conducted by Asgarizadeh et al. showed that personal past experiences
        with climate-related events was associated with heightened levels of anxiety
        [<a href=\"#pmen.0000749.ref017\" class=\"ref-tip\">17</a>].</p>\n<a id=\"article1.body1.sec2.sec1.p4\"
        name=\"article1.body1.sec2.sec1.p4\" class=\"link-target\"></a><p>Yet we note
        that direct experiences with hurricane stressors could plausibly produce generalized
        anxiety. As stated, research has specifically established a positive relationship
        between experiencing stressful hurricane events and increased levels of psychological
        distress [<a href=\"#pmen.0000749.ref008\" class=\"ref-tip\">8</a>,<a href=\"#pmen.0000749.ref018\"
        class=\"ref-tip\">18</a>], including anxiety [<a href=\"#pmen.0000749.ref019\"
        class=\"ref-tip\">19</a>,<a href=\"#pmen.0000749.ref020\" class=\"ref-tip\">20</a>].
        For instance, in their study of individuals who experienced Hurricane Katrina,
        Galea et al. found that hurricane-related stressors, namely, experiencing
        property loss, physical injury, and physical adversity, were positively associated
        with symptoms of anxiety [<a href=\"#pmen.0000749.ref006\" class=\"ref-tip\">6</a>].</p>\n<a
        id=\"article1.body1.sec2.sec1.p5\" name=\"article1.body1.sec2.sec1.p5\" class=\"link-target\"></a><p>However,
        climate anxiety represents a theoretically and empirically distinct outcome.
        Generalized anxiety is characterized by diffuse, object-independent excessive
        worry about a number of events, disproportionate to the actual likelihood
        or impact of those events [<a href=\"#pmen.0000749.ref021\" class=\"ref-tip\">21</a>].
        Climate anxiety, on the other hand, is object-specific and ecologically grounded
        and reflects an appraisal of systemic environmental threat rather than a pathological
        response to personal danger. Indeed, Clayton and Karazsia\u2019s [<a href=\"#pmen.0000749.ref009\"
        class=\"ref-tip\">9</a>] work has demonstrated empirically that climate anxiety
        is distinct from general psychological distress, establishing it as a separate
        construct warranting independent investigation. In a 5-year cohort survey
        of Texas and Florida residents who directly experienced category 3 or higher
        hurricanes, Garfin and Wong-Parodi found that having previous direct exposure
        to hurricanes, measured with items such as having a home destroyed, losing
        property or a pet, and knowing someone who was injured, was positively associated
        with climate anxiety [<a href=\"#pmen.0000749.ref008\" class=\"ref-tip\">8</a>].</p>\n<a
        id=\"article1.body1.sec2.sec1.p6\" name=\"article1.body1.sec2.sec1.p6\" class=\"link-target\"></a><p>Complementing
        the stress process model, the framework of environmental identity [<a href=\"#pmen.0000749.ref022\"
        class=\"ref-tip\">22</a>] and the concept of ecological grief [<a href=\"#pmen.0000749.ref023\"
        class=\"ref-tip\">23</a>] provide the psychological mechanism for why directly
        experiencing hurricane stressors activates this climate-specific form of anxiety
        rather than generalized distress. First, on a cognitive level, environmental
        identity (EID) represents a sense of connection to the non-human natural environment
        influencing how individuals perceive and act toward the environment [<a href=\"#pmen.0000749.ref022\"
        class=\"ref-tip\">22</a>,<a href=\"#pmen.0000749.ref024\" class=\"ref-tip\">24</a>].
        For people with strong EID, the natural environment plays an important role
        in their self-concept and who they are. Having a strong EID is positively
        linked with pro-environmental attitudes and behaviors [<a href=\"#pmen.0000749.ref022\"
        class=\"ref-tip\">22</a>], as well as climate change risk perception and climate
        anxiety [<a href=\"#pmen.0000749.ref025\" class=\"ref-tip\">25</a>]. While
        EID varies across individuals, the EID framework suggests that in processing
        the destruction resulting from a major hurricane, people may interpret such
        an event through an ecological framework. That is, through an ecological lens,
        hurricane-related stressors such as losses, damages, and adversities may not
        be perceived solely as personal misfortune. Rather, experiencing such stressors
        may serve as evidence of a larger, systemic environmental threat posed by
        climate change, thereby activating climate-specific anxiety rather than generalized
        anxiety. Furthermore, through an ecological lens, the losses and damages experienced
        because of an extreme weather event or natural disaster, such as a major hurricane,
        may manifest affectively as ecological grief, which refers to grief felt in
        response to experienced or anticipated ecological losses [<a href=\"#pmen.0000749.ref023\"
        class=\"ref-tip\">23</a>]. As grief itself has been known to associate with
        anxiety, researchers have found that ecological grief is associated with eco-related
        anxiety [<a href=\"#pmen.0000749.ref023\" class=\"ref-tip\">23</a>,<a href=\"#pmen.0000749.ref026\"
        class=\"ref-tip\">26</a>]. In sum, environmental identity and ecological grief
        provide the psychological mechanism explaining why hurricane stressor experience
        produces climate anxiety as a distinct outcome rather than undifferentiated
        psychological distress.</p>\n<a id=\"article1.body1.sec2.sec1.p7\" name=\"article1.body1.sec2.sec1.p7\"
        class=\"link-target\"></a><p>Based on the literature above, we propose the
        following hypothesis:</p>\n<a id=\"article1.body1.sec2.sec1.p8\" name=\"article1.body1.sec2.sec1.p8\"
        class=\"link-target\"></a><p><strong>H1:</strong> Hurricane stressors will
        be positively associated with climate anxiety.</p>\n</div>\n\n<div id=\"section2\"
        class=\"section toc-section\"><a id=\"sec004\" name=\"sec004\" class=\"link-target\"
        title=\"2.2 Social capital\"></a>\n<h3>2.2 Social capital</h3>\n<a id=\"article1.body1.sec2.sec2.p1\"
        name=\"article1.body1.sec2.sec2.p1\" class=\"link-target\"></a><p>Our study
        also examines the potential relationship between social capital and climate
        anxiety. Social capital refers to social ties and informal or formal connections
        that enable individuals to develop norms of trust, reciprocity, and honesty
        [<a href=\"#pmen.0000749.ref010\" class=\"ref-tip\">10</a>]. People with higher
        social capital tend to be more likely to engage in collective action, ranging
        from joining or volunteering for community organizations to watching over
        their neighbors\u2019 properties [<a href=\"#pmen.0000749.ref010\" class=\"ref-tip\">10</a>,<a
        href=\"#pmen.0000749.ref027\" class=\"ref-tip\">27</a>]. Scholars have identified
        three forms of social capital: bonding, bridging, and linking. Bonding, or
        homophilous social capital, refers to the strong ties one has with kin and
        close friends [<a href=\"#pmen.0000749.ref028\" class=\"ref-tip\">28</a>].
        Such ties offer emotional support and build shared identity, although they
        tend to form among those who already share similar values and goals. In contrast
        to bonding social capital, bridging and linking social capital are both considered
        heterophilous, as they involve ties among individuals of diverse groups [<a
        href=\"#pmen.0000749.ref028\" class=\"ref-tip\">28</a>]. Bridging and linking
        social capital are typically facilitated through participation in political,
        civic, religious, and work-related activities. Such activities lean toward
        being goal-oriented and offer networking opportunities and access to external
        resources via extra-community ties [<a href=\"#pmen.0000749.ref028\" class=\"ref-tip\">28</a>].
        However, bridging and linking social capital are conceptually distinct. Bridging
        social capital involves horizontal connections between people from different
        groups and social levels, while linking social capital represents vertical
        connections between people of varying levels of power (e.g., being connected
        to public officials).</p>\n<a id=\"article1.body1.sec2.sec2.p2\" name=\"article1.body1.sec2.sec2.p2\"
        class=\"link-target\"></a><p>Social capital may serve a protective role against
        distress experienced because of disasters. For instance, a study conducted
        in Japan during the recovery from the 2011 Fukushima nuclear power plant disaster
        showed that higher levels of social capital were associated with experiencing
        less anxiety [<a href=\"#pmen.0000749.ref011\" class=\"ref-tip\">11</a>].
        The central mechanism underlying social capital\u2019s protective role against
        distress is its capacity to facilitate the support that enables individuals
        to cope with a disaster. For example, Hawkins and Maurer [<a href=\"#pmen.0000749.ref029\"
        class=\"ref-tip\">29</a>] analyzed social capital during the recovery period
        following Hurricane Katrina. They found that bonding social capital effectively
        fostered immediate support after the hurricane. That is, during the period
        immediately after Hurricane Katrina, most individuals who experienced the
        storm first received or lent help to their families or others in their immediate
        networks. Moreover, bridging and linking social capital, which connect individuals
        from different backgrounds, could facilitate access to resources needed to
        recover from a natural disaster [<a href=\"#pmen.0000749.ref029\" class=\"ref-tip\">29</a>].
        Bridging and linking social capital could serve as sources for instrumental
        support, or tangible resources, after a disaster such as a hurricane [<a href=\"#pmen.0000749.ref029\"
        class=\"ref-tip\">29</a>]. Examples of instrumental support in the context
        of hurricane recovery include receiving water, food, shelter, or financial
        assistance. Linking social capital, in particular, which encompasses connections
        between people of varying levels of power or authority (e.g., knowing a government
        official), could open access to resources that one would not otherwise have
        available [<a href=\"#pmen.0000749.ref028\" class=\"ref-tip\">28</a>]. Having
        access to resources is important when navigating through or coping with stressful
        experiences. After a hurricane, those with connections to government officials
        or institutions may be the first to know where to look for governmental aid
        or how to apply for disaster relief. In this case, as Hawkins and Maurer\u2019s
        work suggests, bridging and linking social capital may be more important than
        bonding social capital for sustaining the long-term post-hurricane recovery
        and revitalization of a community [<a href=\"#pmen.0000749.ref029\" class=\"ref-tip\">29</a>].</p>\n<a
        id=\"article1.body1.sec2.sec2.p3\" name=\"article1.body1.sec2.sec2.p3\" class=\"link-target\"></a><p>However,
        it is important to acknowledge that a line of work informed by Portes indicates
        that social capital may have a \u201Cdark side\u201D [<a href=\"#pmen.0000749.ref030\"
        class=\"ref-tip\">30</a>]. That is, it may result in negative consequences
        in relation to disaster resilience and mental health [<a href=\"#pmen.0000749.ref031\"
        class=\"ref-tip\">31</a>\u2013<a href=\"#pmen.0000749.ref033\" class=\"ref-tip\">33</a>].
        For instance, disaster literature points to the \u201Ccontagion of stress\u201D
        effect of social capital among close-knit communities [<a href=\"#pmen.0000749.ref031\"
        class=\"ref-tip\">31</a>]. Specifically, in cohesive communities, the stress
        experienced by one individual can easily spread through a well-connected social
        network, creating a contagion that then amplifies the entire community\u2019s
        anxiety levels [<a href=\"#pmen.0000749.ref033\" class=\"ref-tip\">33</a>].
        Bonding social capital, which is based on strong ties shared among homogenous
        group members, may potentially heighten anxiety about climate change if such
        ties include individuals who already feel extremely anxious about the climate
        crisis. Thus, individuals within bonding social networks may also face similar
        challenges and experience similar levels of climate anxiety due to the homogeneity
        of such networks. Additionally, higher bridging and linking social capital
        increases the potential of being exposed to a wide range of information regarding
        climate change, particularly, those pertaining to climate threats. As previous
        research has found, exposure to information about the impacts of climate change
        is associated with heightened levels of climate anxiety [<a href=\"#pmen.0000749.ref016\"
        class=\"ref-tip\">16</a>].</p>\n<a id=\"article1.body1.sec2.sec2.p4\" name=\"article1.body1.sec2.sec2.p4\"
        class=\"link-target\"></a><p>In sum, the research to date indicates that social
        capital can serve a protective role against distress [<a href=\"#pmen.0000749.ref011\"
        class=\"ref-tip\">11</a>,<a href=\"#pmen.0000749.ref028\" class=\"ref-tip\">28</a>,<a
        href=\"#pmen.0000749.ref029\" class=\"ref-tip\">29</a>]. However, a specific
        line of research suggests social capital may function as a double-edged sword,
        exerting both positive and negative effects on disaster resilience [<a href=\"#pmen.0000749.ref032\"
        class=\"ref-tip\">32</a>] and health outcomes [<a href=\"#pmen.0000749.ref033\"
        class=\"ref-tip\">33</a>]. In acknowledging the positive and negative aspects
        of social capital, we propose the following:</p>\n<a id=\"article1.body1.sec2.sec2.p5\"
        name=\"article1.body1.sec2.sec2.p5\" class=\"link-target\"></a><p><strong>RQ1:</strong>
        How are (a) bonding, (b) bridging, and (c) linking social capital differentially
        associated with climate anxiety?</p>\n<a id=\"article1.body1.sec2.sec2.p6\"
        name=\"article1.body1.sec2.sec2.p6\" class=\"link-target\"></a><p>We also
        examine the possibility that social capital would moderate the proposed relationship
        between hurricane stressors and climate anxiety. As previously stated, the
        stress process model views resources as central in explaining how a stressor
        affects mental health outcomes [<a href=\"#pmen.0000749.ref014\" class=\"ref-tip\">14</a>].
        This model suggests that resources, such as those facilitated through social
        capital, would condition the effects that stressors have on mental health
        outcomes [<a href=\"#pmen.0000749.ref015\" class=\"ref-tip\">15</a>]. First,
        on the one hand, extant research supports a \u201Cbuffering\u201D potential
        of social capital. That is, it could help mitigate various forms of psychological
        distress and enhance mental health [<a href=\"#pmen.0000749.ref034\" class=\"ref-tip\">34</a>,<a
        href=\"#pmen.0000749.ref035\" class=\"ref-tip\">35</a>]. Such research specifically
        suggests that social capital markedly buffers the distress associated with
        experiencing a disaster [<a href=\"#pmen.0000749.ref011\" class=\"ref-tip\">11</a>,<a
        href=\"#pmen.0000749.ref036\" class=\"ref-tip\">36</a>]. An explanation for
        social capital\u2019s \u201Cbuffering\u201D potential is that it fosters the
        support and resources necessary to cope with a natural disaster.</p>\n<a id=\"article1.body1.sec2.sec2.p7\"
        name=\"article1.body1.sec2.sec2.p7\" class=\"link-target\"></a><p>On the other
        hand, we also noted the \u201Cdark side\u201D potential of social capital
        [<a href=\"#pmen.0000749.ref030\" class=\"ref-tip\">30</a>]. That is, it is
        possible that the stresses experienced because of a hurricane may be amplified
        by social capital, which would then result in heightened climate anxiety.
        Disaster literature points to the \u201Ccontagion of stress\u201D effect of
        social capital among close-knit communities [<a href=\"#pmen.0000749.ref031\"
        class=\"ref-tip\">31</a>]. For instance, in cohesive communities, the stress
        experienced by one individual can easily spread through a well-connected social
        network, creating a contagion that then amplifies the entire community\u2019s
        anxiety levels [<a href=\"#pmen.0000749.ref033\" class=\"ref-tip\">33</a>].</p>\n<a
        id=\"article1.body1.sec2.sec2.p8\" name=\"article1.body1.sec2.sec2.p8\" class=\"link-target\"></a><p>In
        sum, the above literature suggests that social capital can both buffer and
        amplify the relationship between hurricane stressors and climate anxiety.
        However, the empirical evidence on how different types of social capital\u2014bonding,
        bridging, or linking\u2014can differently shape climate anxiety or moderate
        the psychological impact of hurricane stressors on anxiety, remains significantly
        under-explored. Instead of hypothesizing a uniform buffering effect, we propose
        the following research question:</p>\n<a id=\"article1.body1.sec2.sec2.p9\"
        name=\"article1.body1.sec2.sec2.p9\" class=\"link-target\"></a><p><strong>RQ2:</strong>
        How will (a) bonding, (b) bridging, and (c) linking social capital moderate
        the proposed positive association between hurricane stressors and climate
        anxiety?</p>\n</div>\n</div>\n\n<div xmlns:plos=\"http://plos.org\" id=\"section3\"
        class=\"section toc-section\"><a id=\"sec005\" name=\"sec005\" data-toc=\"sec005\"
        class=\"link-target\" title=\"3. Materials and methods\"></a><h2>3. Materials
        and methods</h2>\n<div id=\"section1\" class=\"section toc-section\"><a id=\"sec006\"
        name=\"sec006\" class=\"link-target\" title=\"3.1 Ethics statement\"></a>\n<h3>3.1
        Ethics statement</h3>\n<a id=\"article1.body1.sec3.sec1.p1\" name=\"article1.body1.sec3.sec1.p1\"
        class=\"link-target\"></a><p>The survey and study were approved by the Institutional
        Review Board (IRB) for human subjects research based at the University of
        Florida, Gainesville, FL, USA [IRB Protocol # ET00043626, Approval date: October
        10, 2024] prior to data collection. Electronic informed consent, specifically,
        active consent via a click-through process, was ensured before participants
        were allowed to complete the survey. That is, prior to completing the online
        survey, participants read a cover page that informed them about the survey
        and study\u2019s purpose, the voluntary nature of the study, and that their
        responses would remain anonymous. The bottom of the informed consent page
        contained instructions stating that if participants agreed to participate,
        they could click on the \u201CI agree to participate\u201D button to continue;
        however, if they did not consent to participate, they could click on the \u201CI
        do not wish to participate\u201D button or just close the browser window.</p>\n</div>\n\n<div
        id=\"section2\" class=\"section toc-section\"><a id=\"sec007\" name=\"sec007\"
        class=\"link-target\" title=\"3.2 Procedure and participants\"></a>\n<h3>3.2
        Procedure and participants</h3>\n<a id=\"article1.body1.sec3.sec2.p1\" name=\"article1.body1.sec3.sec2.p1\"
        class=\"link-target\"></a><p>This cross-sectional study utilized online surveys
        targeting residents of counties with FEMA disaster declarations in Georgia,
        North Carolina, and South Carolina following Hurricane Helene and in Florida
        following both Helene and Milton. We contracted Qualtrics to collect the data
        and administer the survey. Quota sampling was used to ensure representation
        across demographic characteristics, including age and sex. In Georgia, North
        Carolina, and South Carolina, surveys were administered in late October 2024,
        roughly one month after Hurricane Helene made landfall, through the end of
        November 2024 (recruitment of participants commenced on October 30, 2024,
        and ended on November 28, 2024). In Florida, the survey was administered through
        November 2024, about a month after Hurricane Milton made landfall (recruitment
        of participants commenced on November 9, 2024, and ended on November 21, 2024).
        In total, there were 3,329 completion attempts. Participants who did not consent
        to taking the survey, sped through the survey, or indicated that they did
        not live in a county impacted by either of the hurricanes, were excluded.
        This left a final sample size of <em>N</em>\u2009=\u20091,342. The completion
        rate was 40%.</p>\n</div>\n\n<div id=\"section3\" class=\"section toc-section\"><a
        id=\"sec008\" name=\"sec008\" class=\"link-target\" title=\"3.3 Measures\"></a>\n<h3>3.3
        Measures</h3>\n\n<div id=\"section1\" class=\"section toc-section\"><a id=\"sec009\"
        name=\"sec009\" class=\"link-target\" title=\"3.3.1 Hurricane stressors.\"></a><h4>3.3.1
        Hurricane stressors.</h4><a id=\"article1.body1.sec3.sec3.sec1.p1\" name=\"article1.body1.sec3.sec3.sec1.p1\"
        class=\"link-target\"></a><p>We asked participants whether, in the past month,
        they had indirectly or directly experienced hurricane-related stressors from
        Hurricane Helene/Milton. We listed the following six stressors: (a) lack of
        any resource (food, water, shelter, electricity) for over a week, (b) loss
        of sentimental possessions or pets, (c) self or household member had health
        problems, (d) financial loss, (e) housing situation changed as a result of
        the hurricane, and (f) experienced any issues with mold, contamination, or
        structural damage in your home due to the hurricane. The first four items
        were adapted from Lowe et al. [<a href=\"#pmen.0000749.ref015\" class=\"ref-tip\">15</a>]
        and we created the two remaining items. Responses to all the items for hurricane-related
        stressors were scored with 1\u2009=\u2009yes, 0\u2009=\u2009no. We summed
        and combined the items to form a single measure (<em>M</em>\u2009=\u20092.32,
        <em>SD</em>\u2009=\u20091.91, \u03B1\u2009=\u2009.77).</p>\n</div>\n\n<div
        id=\"section2\" class=\"section toc-section\"><a id=\"sec010\" name=\"sec010\"
        class=\"link-target\" title=\"3.3.2 Climate change anxiety.\"></a><h4>3.3.2
        Climate change anxiety.</h4><a id=\"article1.body1.sec3.sec3.sec2.p1\" name=\"article1.body1.sec3.sec3.sec2.p1\"
        class=\"link-target\"></a><p>Three items from Clayton and Karazsia\u2019s
        climate anxiety scale were used [<a href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>]:
        (a) thinking about climate change makes it difficult for me to concentrate,
        (b) I have nightmares about climate change, and (c) my friends say I think
        about climate change too much [<a href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>].
        Responses were measured along a 5-point scale (1\u2009=\u2009strongly disagree,
        5\u2009=\u2009strongly agree), then we averaged and combined the items to
        form a single measure (<em>M</em>\u2009=\u20092.47, <em>SD</em>\u2009=\u20091.07,
        a\u2009=\u2009.85).</p>\n</div>\n\n<div id=\"section3\" class=\"section toc-section\"><a
        id=\"sec011\" name=\"sec011\" class=\"link-target\" title=\"3.3.3 Social capital.\"></a><h4>3.3.3
        Social capital.</h4><a id=\"article1.body1.sec3.sec3.sec3.p1\" name=\"article1.body1.sec3.sec3.sec3.p1\"
        class=\"link-target\"></a><p>Drawing on prior work on personal social capital,
        online/social-media-enabled social capital, bonding and bridging social capital,
        and linking social capital in disaster recovery, we adapted items to assess
        three forms of social capital relevant to post-disaster coping and resource
        access [<a href=\"#pmen.0000749.ref029\" class=\"ref-tip\">29</a>,<a href=\"#pmen.0000749.ref037\"
        class=\"ref-tip\">37</a>\u2013<a href=\"#pmen.0000749.ref039\" class=\"ref-tip\">39</a>].
        Bonding social capital captured access to close interpersonal support, bridging
        social capital captured access to resources and information beyond one\u2019s
        immediate family or close friends, and linking social capital captured perceived
        access to government-related contacts, information, and disaster-relief resources.</p>\n<a
        id=\"article1.body1.sec3.sec3.sec3.p2\" name=\"article1.body1.sec3.sec3.sec3.p2\"
        class=\"link-target\"></a><p><em>Bonding</em> social capital was measured
        with the following items: (a) I have people I can turn to and ask for help,
        (b) there is someone I can talk about my problems with, and (c) there is someone
        who can give me emotional support (1\u2009=\u2009strongly disagree, 5\u2009=\u2009strongly
        agree). The items were averaged and combined to form a single measure (<em>M</em>\u2009=\u20093.79,
        <em>SD</em>\u2009=\u2009.98, \u03B1\u2009=\u2009.88).</p>\n<a id=\"article1.body1.sec3.sec3.sec3.p3\"
        name=\"article1.body1.sec3.sec3.sec3.p3\" class=\"link-target\"></a><p><em>Bridging</em>
        social capital was measured with three items: (a) I know someone with resources
        that my family or friends do not have, (b) there are people I can turn to
        for new job opportunities, and (c) I know someone who can help me learn about
        things that happen outside my community (1\u2009=\u2009strongly disagree,
        5\u2009=\u2009strongly agree). We averaged and combined these items to form
        a single measure (<em>M</em>\u2009=\u20093.29, <em>SD</em>\u2009=\u2009.94,
        \u03B1 =\u2009.74).</p>\n<a id=\"article1.body1.sec3.sec3.sec3.p4\" name=\"article1.body1.sec3.sec3.sec3.p4\"
        class=\"link-target\"></a><p><em>Linking</em> social capital was measured
        with the following three items: (a) I know someone who works in the government,
        (b) I know how to apply for disaster relief from the government, and (c) I
        know where to look for governmental aid during disasters (1\u2009=\u2009strongly
        disagree, 5\u2009=\u2009strongly agree). We averaged and combined the items
        to form a single measure (<em>M</em>\u2009=\u20093.08, <em>SD</em>\u2009=\u2009.95,
        \u03B1\u2009=\u2009.66).</p>\n</div>\n\n<div id=\"section4\" class=\"section
        toc-section\"><a id=\"sec012\" name=\"sec012\" class=\"link-target\" title=\"3.3.4
        Covariates.\"></a><h4>3.3.4 Covariates.</h4><a id=\"article1.body1.sec3.sec3.sec4.p1\"
        name=\"article1.body1.sec3.sec3.sec4.p1\" class=\"link-target\"></a><p>We
        measured and controlled for age, biological sex, state (Florida, Georgia,
        North Carolina, South Carolina), educational attainment (continuous), income
        (continuous), race and ethnicity, and political orientation (1\u2009=\u2009very
        conservative, 5\u2009=\u2009very liberal). For state, Florida was treated
        as the reference group in all the regression models as discussed in our analytical
        strategy below. We thus included only Georgia, North Carolina, and South Carolina
        as covariates in the regression models. For race, White was treated as the
        reference group, and only Non-White Hispanic or Latino, Black, Asian and other
        ethnicities as covariates in our regression models. We also included a measure
        for generalized anxiety as a covariate [<a href=\"#pmen.0000749.ref040\" class=\"ref-tip\">40</a>],
        which included the following four items adapted from the GAD-7 that asked
        respondents whether in the last 2 weeks, how often they had experienced the
        following: (a) been bothered by feeling nervous, anxious, or on edge, (b)
        been bothered by not being able to stop or control worrying, (c) been bothered
        by worrying too much about different things, and (d) been bothered by having
        trouble relaxing. Responses were averaged and combined to form a single measure
        (<em>M</em>\u2009=\u20092.17, <em>SD</em>\u2009=\u2009.96; \u03B1\u2009=\u2009.93).
        Finally, the bonding, bridging, and linking social capital were included as
        covariates when they were not respectively entered as moderators.</p>\n</div>\n</div>\n\n<div
        id=\"section4\" class=\"section toc-section\"><a id=\"sec013\" name=\"sec013\"
        class=\"link-target\" title=\"3.4 Data analysis strategy\"></a>\n<h3>3.4 Data
        analysis strategy</h3>\n<a id=\"article1.body1.sec3.sec4.p1\" name=\"article1.body1.sec3.sec4.p1\"
        class=\"link-target\"></a><p>All analyses were performed using SPSS version
        30 and the regression analyses were performed using the PROCESS macro [<a
        href=\"#pmen.0000749.ref041\" class=\"ref-tip\">41</a>]. Listwise deletion
        was used to deal with missing data, and as such, all analyses were performed
        on complete data (<em>n</em>\u2009=\u20091,327). To test H1 and investigate
        RQ, we used PROCESS Model 1 to estimate three separate moderation analyses,
        each respectively examining one form of social capital (bonding, bridging,
        and linking social capital) as a moderator of the hurricane stressor-climate
        anxiety relationship. This approach allowed us to isolate the unique moderating
        effect of each social capital type while controlling for the others. Ninety-five
        percent bootstrap confidence intervals (CIs) with 5,000 resamples were generated
        for inference tests. The hypothesized moderation effects were assessed at
        the analytical mean and one standard deviation below and above the mean of
        each social capital variable. All predictors (hurricane stressors and the
        three social capital variables) were mean-centered prior to analysis for the
        purpose of interpreting the correlation when the interaction term was added
        in the model. The covariates previously identified were included in all regression
        analyses. We note that prior to analyzing the data, we also inspected the
        zero-order correlation between the measure of generalized anxiety and climate
        change anxiety, which was <em>r</em>\u2009=\u2009.24 (<em>p</em>\u2009&lt;\u2009.05).
        This level of correlation does not raise concerns about multicollinearity.
        Lastly, all regression coefficients reported below are unstandardized (<em>b</em>).</p>\n</div>\n</div>\n\n<div
        xmlns:plos=\"http://plos.org\" id=\"section4\" class=\"section toc-section\"><a
        id=\"sec014\" name=\"sec014\" data-toc=\"sec014\" class=\"link-target\" title=\"4.
        Results\"></a><h2>4. Results</h2>\n<div id=\"section1\" class=\"section toc-section\"><a
        id=\"sec015\" name=\"sec015\" class=\"link-target\" title=\"4.1 Sample characteristics\"></a>\n<h3>4.1
        Sample characteristics</h3>\n<a id=\"article1.body1.sec4.sec1.p1\" name=\"article1.body1.sec4.sec1.p1\"
        class=\"link-target\"></a><p>Participant characteristics are reported in <a
        href=\"#pmen-0000749-t001\">Table 1</a>. The mean age of participants was
        46.03 years (<em>SD</em>\u2009=\u200917.33). There were also slightly more
        males (55.1%) than females (44.9%), a majority of the sample resided in Florida
        (53.5%), and most identified as White (63%) and politically moderate (39.3%).
        Finally, the median education level reported was \u201Cone or more years of
        college,\u201D and the median annual income reported was between \u201C$40,000-$59,999.\u201D</p>\n<a
        class=\"link-target\" id=\"pmen-0000749-t001\" name=\"pmen-0000749-t001\"></a><div
        class=\"figure\" data-doi=\"10.1371/journal.pmen.0000749.t001\"><div class=\"img-box\"><a
        title=\"Click for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.t001\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.t001\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.t001\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.t001\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.t001\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Table 1. </span>
        Means, standard deviations, and descriptive statistics of key variables among
        participants (<em>N</em>\u2009=\u20091,342).</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pmen.0000749.t001\">\n
        \             https://doi.org/10.1371/journal.pmen.0000749.t001</a></p></div></div>\n\n<div
        id=\"section2\" class=\"section toc-section\"><a id=\"sec016\" name=\"sec016\"
        class=\"link-target\" title=\"4.2 Hypothesis and research questions\"></a>\n<h3>4.2
        Hypothesis and research questions</h3>\n<a id=\"article1.body1.sec4.sec2.p1\"
        name=\"article1.body1.sec4.sec2.p1\" class=\"link-target\"></a><p>H1 expected
        that experiencing hurricane stressors would be positively associated with
        climate anxiety. This hypothesis was supported. Our results indicate that
        with all other variables simultaneously taken into account, hurricane stressors
        were positively associated with climate anxiety in all three regression models
        reported in <a href=\"#pmen-0000749-t001\">Table 1</a> (<em>b</em>\u2009=\u2009.073,
        <em>se</em>\u2009=\u2009.031, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.065,
        <em>se</em>\u2009=\u2009.016, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.065,
        <em>se</em>\u2009=\u2009.016, <em>p</em>\u2009&lt;\u2009.001).</p>\n<a id=\"article1.body1.sec4.sec2.p2\"
        name=\"article1.body1.sec4.sec2.p2\" class=\"link-target\"></a><p>RQ1 investigated
        how the three forms of social capital\u2014bonding, bridging, and linking\u2014are
        associated with climate anxiety. As shown in <a href=\"#pmen-0000749-t002\">Table
        2</a>, there was a negative association between bonding social capital and
        climate anxiety across all three regression models (<em>b</em>\u2009=\u2009-.178,
        <em>se</em>\u2009=\u2009.032, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009-.179,
        <em>se</em>\u2009=\u2009.032, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009-.180,
        <em>se</em>\u2009=\u2009.032, <em>p</em>\u2009&lt;\u2009.01). However, in
        all three regression models, bridging (<em>b</em>\u2009=\u2009.220, <em>se</em>\u2009=\u2009.036,
        <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.217, <em>se</em>\u2009=\u2009.036,
        <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.212, <em>se</em>\u2009=\u2009.036,
        <em>p</em>\u2009&lt;\u2009.01) and linking social capital (<em>b</em>\u2009=\u2009.229,
        <em>se</em>\u2009=\u2009.031, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.230,
        <em>se</em>\u2009=\u2009.032, <em>p</em>\u2009&lt;\u2009.001; <em>b</em>\u2009=\u2009.237,
        <em>se</em>\u2009=\u2009.031, <em>p</em>\u2009&lt;\u2009.01) were found to
        be both positively associated with climate anxiety.</p>\n<a class=\"link-target\"
        id=\"pmen-0000749-t002\" name=\"pmen-0000749-t002\"></a><div class=\"figure\"
        data-doi=\"10.1371/journal.pmen.0000749.t002\"><div class=\"img-box\"><a title=\"Click
        for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.t002\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.t002\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.t002\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.t002\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.t002\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Table 2. </span>
        Associations between hurricane stressors and social capital (bonding, bridging,
        and linking) with climate anxiety.</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pmen.0000749.t002\">\n
        \             https://doi.org/10.1371/journal.pmen.0000749.t002</a></p></div><a
        id=\"article1.body1.sec4.sec2.p3\" name=\"article1.body1.sec4.sec2.p3\" class=\"link-target\"></a><p>RQ2
        investigated whether the association between experiencing hurricane stressors
        and climate anxiety was moderated by the three forms of social capital. First,
        as shown in <a href=\"#pmen-0000749-t002\">Table 2</a>, an interaction term
        between hurricane stressors and bonding social capital was significant (<em>b</em>\u2009=\u2009.047,
        <em>se</em>\u2009=\u2009.013, <em>p</em>\u2009&lt;\u2009.001), indicating
        that the association between hurricane stressors and climate anxiety varied
        at different levels of bonding social capital. As shown in <a href=\"#pmen-0000749-t003\">Table
        3</a>, the relationship between hurricane stressors and climate anxiety was
        significant when bonding social capital was at its mean (<em>b</em>\u2009=\u2009.073,
        <em>se</em>\u2009=\u2009.016, <em>p</em>\u2009&lt;\u2009.001) and 1SD above
        the mean (<em>b</em>\u2009=\u2009.119, <em>se</em>\u2009=\u2009.021, <em>p</em>\u2009&lt;\u2009.001),
        but not at 1SD below the mean (<em>b</em>\u2009=\u2009.027, <em>se</em>\u2009=\u2009.020,
        <em>p</em>\u2009=\u2009.176). <a href=\"#pmen-0000749-g001\">Fig 1</a> shows
        the plot of this interaction effect. At low levels of hurricane stressors,
        participants with high bonding social capital reported a relatively low level
        of climate anxiety. However, as hurricane stressors increased, the slope for
        those with high bonding social capital became much steeper than those with
        lower bonding social capital.</p>\n<a class=\"link-target\" id=\"pmen-0000749-t003\"
        name=\"pmen-0000749-t003\"></a><div class=\"figure\" data-doi=\"10.1371/journal.pmen.0000749.t003\"><div
        class=\"img-box\"><a title=\"Click for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.t003\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.t003\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.t003\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.t003\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.t003\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Table 3. </span>
        A moderation model of bonding, bridging, and linking social capital on climate
        change anxiety.</div><p class=\"caption_target\"></p><p class=\"caption_object\"><a
        href=\"https://doi.org/10.1371/journal.pmen.0000749.t003\">\n              https://doi.org/10.1371/journal.pmen.0000749.t003</a></p></div><a
        class=\"link-target\" id=\"pmen-0000749-g001\" name=\"pmen-0000749-g001\"></a><div
        class=\"figure\" data-doi=\"10.1371/journal.pmen.0000749.g001\"><div class=\"img-box\"><a
        title=\"Click for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.g001\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.g001\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.g001\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.g001\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.g001\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Fig 1. </span>
        Bonding social capital as a moderator of the relationship between hurricane
        stressors and climate change anxiety.</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pmen.0000749.g001\">\n
        \             https://doi.org/10.1371/journal.pmen.0000749.g001</a></p></div><a
        id=\"article1.body1.sec4.sec2.p4\" name=\"article1.body1.sec4.sec2.p4\" class=\"link-target\"></a><p>Second,
        as <a href=\"#pmen-0000749-t002\">Table 2</a> shows, the interaction between
        hurricane stressors and bridging social capital was significant (<em>b</em>\u2009=\u2009.053,
        se\u2009=\u2009.013, <em>p</em>\u2009&lt;\u2009.001). Similar to what was
        found for bonding social capital, the relationship between hurricane stressors
        and climate anxiety was not significant when bridging social capital was at
        1SD below the mean (<em>b</em>\u2009=\u2009.015, <em>se</em>\u2009=\u2009.021,
        <em>p</em>\u2009=\u2009.464). Yet, as <a href=\"#pmen-0000749-t003\">Table
        3</a> indicates, this relationship became progressively stronger as levels
        of bridging social capital increased from its mean (<em>b</em>\u2009=\u2009.065,
        <em>se</em>\u2009=\u2009.016, <em>p</em>\u2009&lt;\u2009.001) to 1SD above
        the mean (<em>b</em>\u2009=\u2009.114, <em>se</em>\u2009=\u2009.020, <em>p</em>\u2009&lt;\u2009.001).
        The plot for this interaction is illustrated in <a href=\"#pmen-0000749-g002\">Fig
        2</a>. In contrast to the results for bonding social capital, <a href=\"#pmen-0000749-g002\">Fig
        2</a> indicates that at lower levels of hurricane stressors, climate anxiety
        was slightly higher for participants with higher bridging social capital.
        As hurricane stressors increased, the slope of the stress-anxiety relationship
        became steeper for participants with higher levels of bridging social capital.
        In contrast, the slope was relatively flat for those with low bridging social
        capital.</p>\n<a class=\"link-target\" id=\"pmen-0000749-g002\" name=\"pmen-0000749-g002\"></a><div
        class=\"figure\" data-doi=\"10.1371/journal.pmen.0000749.g002\"><div class=\"img-box\"><a
        title=\"Click for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.g002\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.g002\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.g002\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.g002\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.g002\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Fig 2. </span>
        Bridging social capital as a moderator of the relationship between hurricane
        stressors and climate change anxiety.</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pmen.0000749.g002\">\n
        \             https://doi.org/10.1371/journal.pmen.0000749.g002</a></p></div><a
        id=\"article1.body1.sec4.sec2.p5\" name=\"article1.body1.sec4.sec2.p5\" class=\"link-target\"></a><p>Third,
        the interaction between hurricane stressors and linking social capital was
        also significant (<em>b</em>\u2009=\u2009.062, <em>se</em>\u2009=\u2009.014,
        <em>p</em>\u2009&lt;\u2009.001), and similar to the pattern found for both
        bonding and bridging social capital, the relationship between hurricane stressors
        and climate anxiety was not significant when linking social capital was at
        1SD below the mean (<em>b</em>\u2009=\u2009.007, <em>se</em>\u2009=\u2009.021,
        <em>p</em>\u2009=\u2009.752). Yet, the relationship became stronger as levels
        of linking social capital increased from its mean (<em>b</em>\u2009=\u2009.065,
        <em>se</em>\u2009=\u2009.016, <em>p</em>\u2009&lt;\u2009.001) to 1SD above
        the mean (<em>b</em>\u2009=\u2009.123, <em>se</em>\u2009=\u2009.020, <em>p</em>\u2009&lt;\u2009.001)
        (see <a href=\"#pmen-0000749-t003\">Table 3</a> and <a href=\"#pmen-0000749-g003\">Fig
        3</a>). As shown in <a href=\"#pmen-0000749-g003\">Fig 3</a>, the pattern
        of the plot for linking social capital is similar to that for bridging social
        capital. That is, at lower levels of hurricane stressors, climate anxiety
        was slightly higher for participants with higher linking social capital, and
        the slope for the relationship between hurricane stressors and climate anxiety
        was steeper for participants with higher linking social capital.</p>\n<a class=\"link-target\"
        id=\"pmen-0000749-g003\" name=\"pmen-0000749-g003\"></a><div class=\"figure\"
        data-doi=\"10.1371/journal.pmen.0000749.g003\"><div class=\"img-box\"><a title=\"Click
        for larger image\" href=\"article/figure/image?size=medium&amp;id=10.1371/journal.pmen.0000749.g003\"
        data-doi=\"10.1371/journal.pmen.0000749\" data-uri=\"10.1371/journal.pmen.0000749.g003\"><img
        src=\"article/figure/image?size=inline&amp;id=10.1371/journal.pmen.0000749.g003\"
        alt=\"thumbnail\" class=\"thumbnail\" loading=\"lazy\"></a><div class=\"expand\"></div></div><div
        class=\"figure-inline-download\">\n          Download:\n          <ul><li><a
        href=\"article/figure/image?download&amp;size=large&amp;id=10.1371/journal.pmen.0000749.g003\"><div
        class=\"definition-label\">PNG</div><div class=\"definition-description\">larger
        image</div></a></li><li><a href=\"article/figure/image?download&amp;size=original&amp;id=10.1371/journal.pmen.0000749.g003\"><div
        class=\"definition-label\">TIFF</div><div class=\"definition-description\">original
        image</div></a></li></ul></div><div class=\"figcaption\"><span>Fig 3. </span>
        Linking social capital as a moderator of the relationship between hurricane
        stressors and climate change anxiety.</div><p class=\"caption_target\"></p><p
        class=\"caption_object\"><a href=\"https://doi.org/10.1371/journal.pmen.0000749.g003\">\n
        \             https://doi.org/10.1371/journal.pmen.0000749.g003</a></p></div></div>\n\n<div
        id=\"section3\" class=\"section toc-section\"><a id=\"sec017\" name=\"sec017\"
        class=\"link-target\" title=\"4.3 Ancillary analyses: Association of covariates
        with climate anxiety\"></a>\n<h3>4.3 Ancillary analyses: Association of covariates
        with climate anxiety</h3>\n<a id=\"article1.body1.sec4.sec3.p1\" name=\"article1.body1.sec4.sec3.p1\"
        class=\"link-target\"></a><p>As <a href=\"#pmen-0000749-t002\">Table 2</a>
        shows, income (b = between\u2009.054 to.056) and black race/ethnicity (b =
        between\u2009.221 to\u2009.222) were both positively associated with climate
        anxiety, and South Carolina residence (relative to the Florida reference group)
        was negatively associated (b = between -.251 to\u2009.228). Also, generalized
        anxiety as a covariate was positively associated with climate change anxiety
        (b = between -.182 to -.178).</p>\n</div>\n</div>\n\n<div xmlns:plos=\"http://plos.org\"
        id=\"section5\" class=\"section toc-section\"><a id=\"sec018\" name=\"sec018\"
        data-toc=\"sec018\" class=\"link-target\" title=\"5. Discussion\"></a><h2>5.
        Discussion</h2><a id=\"article1.body1.sec5.p1\" name=\"article1.body1.sec5.p1\"
        class=\"link-target\"></a><p>Hurricanes Helene and Milton caused widespread
        devastation across several Southeastern states in the U.S. [<a href=\"#pmen.0000749.ref001\"
        class=\"ref-tip\">1</a>,<a href=\"#pmen.0000749.ref002\" class=\"ref-tip\">2</a>].
        The first purpose of the present study was to test whether stressful experiences
        or stressors associated with Hurricanes Helene and Milton would be positively
        related with climate anxiety. We analyzed data from surveys conducted in the
        counties of four U.S. states impacted by the two hurricanes. Our finding confirms
        that hurricane stressors were positively associated with climate anxiety,
        supporting previous research conducted by Garfin and Wong-Parodi [<a href=\"#pmen.0000749.ref008\"
        class=\"ref-tip\">8</a>] and more broadly expanding past research linking
        personal experiences with hurricanes to psychological distress. This finding
        is also consistent with the stress process model [<a href=\"#pmen.0000749.ref014\"
        class=\"ref-tip\">14</a>], which explains why stressors such as hurricane-related
        losses and damages are associated with adverse psychological outcomes. Moreover,
        the positive association between hurricane stressors and climate anxiety aligns
        with the psychological mechanisms proffered by the environmental identity
        [<a href=\"#pmen.0000749.ref022\" class=\"ref-tip\">22</a>] framework and
        the concept of ecological grief [<a href=\"#pmen.0000749.ref023\" class=\"ref-tip\">23</a>],
        which both suggest that experiences with hurricane stressors could be interpreted
        through an ecological lens connecting immediate loss to the broader systemic
        threat of climate change. However, we note that our surveys did not include
        measures for environmental identity and ecological grief. Thus, future studies
        could examine these variables as potential mechanisms that may explain the
        association between hurricane stressors and climate anxiety. In addition,
        climate change risk perceptions or climate change attributions are also constructs
        that reflect cognitive appraisals of climate change as a threatening phenomenon
        [<a href=\"#pmen.0000749.ref042\" class=\"ref-tip\">42</a>], and as such are
        conceptually similar to climate anxiety. As our study did not assess these
        constructs, future research could investigate how hurricane stressors may
        be linked to such variables.</p>\n<a id=\"article1.body1.sec5.p2\" name=\"article1.body1.sec5.p2\"
        class=\"link-target\"></a><p>The second purpose of our study was to explore
        the relationship between social capital and climate anxiety. We examined three
        forms of social capital: bonding, bridging, and linking. Our findings, on
        the one hand, indicated that bonding social capital was inversely associated
        with climate anxiety. This finding could be reflective of the \u201Cbuffering\u201D
        or protective potential of bonding social capital and may align with the findings
        of a previous study by Hawkins and Maurer [<a href=\"#pmen.0000749.ref029\"
        class=\"ref-tip\">29</a>], which suggested that bonding social capital, compared
        with bridging and linking social capital, may more effectively foster immediate
        support after a hurricane. As such, in our study, bonding social capital was
        negatively associated with anxieties about climate change for our participants
        who were recovering from Hurricane Helene/Milton. On the other hand, we found
        that both bridging and linking social capital were associated with heightened
        climate anxiety. We proffer one possible explanation for these results. Specifically,
        it could be that participants\u2019 heterogenous social ties, facilitated
        by bridging and linking social capital, may have comprised a large proportion
        of people expressing worries about the climate crisis. As such, this may have
        increased the likelihood of developing similar climate concerns. However,
        our surveys did not contain measures assessing the proportions of people expressing
        worries about the climate crisis within one\u2019s heterogenous networks.
        We thus recommend future studies be conducted to measure this variable and
        examine its potential role in explaining how bridging and linking social capital
        could be both positively associated with climate anxiety.</p>\n<a id=\"article1.body1.sec5.p3\"
        name=\"article1.body1.sec5.p3\" class=\"link-target\"></a><p>The third purpose
        of our study was to explore the possibility that social capital would moderate
        the positive relationship between hurricane stressors and climate anxiety.
        To this end, our findings indicated that social capital did moderate the relationship
        between hurricane stressors and climate anxiety. However, the specific moderation
        pattern differed across bonding versus bridging and linking social capital.
        Specifically, our results suggested that bonding social capital\u2019s protective
        role is conditional and reverses under high stress, rather than following
        a classic buffering pattern [<a href=\"#pmen.0000749.ref043\" class=\"ref-tip\">43</a>].
        As <a href=\"#pmen-0000749-g001\">Fig 1</a> shows, participants with high
        bonding social capital reported lower climate anxiety at low stressor levels.
        A classic buffering pattern would reveal a flattening hurricane stressor-anxiety
        slope for the high-bonding social capital group and steeper slopes for the
        low and moderate groups. Yet, our data showed the opposite. The slope was
        steeper for the high bonding social capital group. That is, bonding social
        capital weakens the relationship between hurricane stressors and climate anxiety
        only when hurricane stressors were low. As stressors accumulated, bonding
        social capital strengthens the association between stressors and climate anxiety,
        possibly because stress was transmitted within dense social networks [<a href=\"#pmen.0000749.ref031\"
        class=\"ref-tip\">31</a>]. Resources that are typically protective become
        less effective under high stress conditions [<a href=\"#pmen.0000749.ref043\"
        class=\"ref-tip\">43</a>]. In the context of hurricane coping and recovery,
        close-knit networks of family and friends often provide critical support in
        the early stages of a disaster [<a href=\"#pmen.0000749.ref023\" class=\"ref-tip\">23</a>].
        However, when stressors accumulate, such as when hurricanes bring prolonged,
        repeated disruptions, the same networks may shift from being a source of support
        to a source of strain. For example, anxiety and worry may spread more easily
        within tightly knit groups, creating collective stress as shared resources
        become depleted. In addition, individuals embedded in strong bonding networks
        may feel the pressure to reciprocate by caring for others, which can amplify
        their own feelings of anxiety and emotional fatigue.</p>\n<a id=\"article1.body1.sec5.p4\"
        name=\"article1.body1.sec5.p4\" class=\"link-target\"></a><p>Yet our pattern
        of findings for bridging and linking social capital suggested that they amplified
        the positive association between hurricanes stressors and climate anxiety.
        This finding is in contrast with previous research that indicated social capital
        to serve as a buffer or play a protective role against anxiety following disasters
        [<a href=\"#pmen.0000749.ref011\" class=\"ref-tip\">11</a>]. It is possible
        that higher bridging and linking social capital increases the potential of
        being exposed to a wider span of information regarding climate change, namely,
        those pertaining to climate threats. As we noted, past research has found
        that exposure to information about the impacts of climate change is positively
        associated with climate anxiety [<a href=\"#pmen.0000749.ref016\" class=\"ref-tip\">16</a>].
        One practical implication of these findings is that risk communication delivered
        through bridging and linking networks is better designed to pair disaster
        information with concrete efficacy and coping resources, so that heightened
        awareness does not only translate into distress. As the association between
        hurricane stressors and climate anxiety was strongest among individuals with
        high linking social capital, governmental and institutional risk communicators,
        in particular, may wish to attend to the social or emotional\u2014not only
        the informational\u2014consequences of their messages following disaster events.</p>\n<a
        id=\"article1.body1.sec5.p5\" name=\"article1.body1.sec5.p5\" class=\"link-target\"></a><p>Nevertheless,
        these findings collectively contribute to the literature by suggesting that
        the relationship between social capital and climate anxiety is more nuanced
        and there may be different theoretical mechanisms at play when assessing the
        role of social capital in one\u2019s disaster experience. It further underscores
        the complexity of social capital\u2019s role in different disaster scenarios.
        Furthermore, the just mentioned findings regarding social capital may also
        be reflective of the cognitive and structural dimensions of social capital.
        Its cognitive aspect focuses on trust and support perceptions, and they have
        been consistently linked to lowered anxiety and improved mental health state.
        However, studies have found that the structural dimension of social capital,
        indicated by one\u2019s participation or connection to social networks, are
        related to mental health outcomes in more ambiguous ways. For example, Wind
        and colleagues [<a href=\"#pmen.0000749.ref044\" class=\"ref-tip\">44</a>]
        found that cognitive social capital was negatively related to mental health
        issues following a disaster, whereas structural social capital exacerbated
        feelings of anxiety. As the current operationalizations of social capital
        did not distinguish the cognitive and structural dimensions, the observed
        moderation relationship may be explained by the mixed effects of cognitive
        versus structural aspects of social capital.</p>\n<a id=\"article1.body1.sec5.p6\"
        name=\"article1.body1.sec5.p6\" class=\"link-target\"></a><p>Finally, although
        they were included as covariates in our models, we again note the following
        findings. First, the measure for generalized anxiety had a stronger association
        with climate anxiety than hurricane stressors did. The simple explanation
        for this is that generalized anxiety and climate anxiety are both anxiety
        constructs and likely share underlying features, even though they remain both
        conceptually distinct in their specific focus or content. On the other hand,
        hurricane stressors are an external, event-based exposure variable, and as
        such, are less proximate to an internalizing symptom measure like climate
        anxiety. Second, income and black race/ethnicity (b around.22) were both positively
        associated with climate anxiety. These findings respectively imply that individuals
        with higher household incomes and those who identify as black may experience
        greater climate anxiety. We speculate that higher-income individuals may be
        disproportionately exposed to climate-related information, which may heighten
        their climate anxiety. Additionally, the well-documented vulnerability of
        black communities to the adverse effects of climate-related disasters such
        as hurricanes [<a href=\"#pmen.0000749.ref045\" class=\"ref-tip\">45</a>]
        may similarly heighten their awareness of and anxiety about climate change.
        This warrants further investigation about potential racial and ethnic differences
        in climate anxiety. Finally, living in South Carolina was negatively associated
        with climate anxiety. One plausible explanation for this finding is the differential
        impact of Hurricanes Helene and Milton across states. While South Carolina
        was affected by Hurricane Helene, the storm\u2019s most severe impacts were
        concentrated elsewhere. Thus, it could be that the South Carolina residents
        sampled in our study may have experienced comparatively less devastation,
        which may in turn have produced lower levels of climate anxiety. Future research
        could examine this explanation by including state-level measures that account
        for differential hurricane impacts.</p>\n\n<div id=\"section1\" class=\"section
        toc-section\"><a id=\"sec019\" name=\"sec019\" class=\"link-target\" title=\"5.1
        Limitations and future directions\"></a>\n<h3>5.1 Limitations and future directions</h3>\n<a
        id=\"article1.body1.sec5.sec1.p1\" name=\"article1.body1.sec5.sec1.p1\" class=\"link-target\"></a><p>Although
        our study provides interesting results regarding experiencing an environmental
        disaster on people\u2019s information behavior strategies, it has weaknesses
        that must be acknowledged. First, our study utilizes cross-sectional data.
        As a result, the cross-sectional design limits causal inference about whether
        social capital patterns preceded or resulted from hurricane exposure. Thus,
        we recommend future research, such as experimental studies be conducted to
        test whether in fact hurricane stressors are positively predictive of climate
        anxiety.</p>\n<a id=\"article1.body1.sec5.sec1.p2\" name=\"article1.body1.sec5.sec1.p2\"
        class=\"link-target\"></a><p>Second, potential discrepancies in our measures
        may have influenced our findings. Specifically, while our primary independent
        variable focuses on hurricane-related stressors, the corresponding measure
        of anxiety focuses on the issue of climate change more broadly. The issue
        here is that people may not directly associate hurricane experiences with
        climate change-specific anxiety. To address this issue, future studies should
        examine general anxiety tied to the specific event, to ensure a more precise
        match between the disaster experienced and the anxiety measured.</p>\n<a id=\"article1.body1.sec5.sec1.p3\"
        name=\"article1.body1.sec5.sec1.p3\" class=\"link-target\"></a><p>Third, regarding
        the measure used for climate change anxiety, we acknowledge that two of the
        three items drawn from Clayton and Karazsia\u2019s climate anxiety scale [<a
        href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>] were taken from the
        scale\u2019s functional impairment subscale, while one was drawn from the
        cognitive-emotional subscale. It could be argued, therefore, that these items
        more precisely captured climate change-related preoccupation or functional
        impairment, constructs that are related to but distinct from core climate
        symptomology. We note, however, that this limitation does not invalidate our
        findings, but rather contextualizes the interpretation of our outcome variable.
        Specifically, the climate change anxiety measure used in our study should
        be understood as reflecting climate change-related cognitive preoccupation
        and functional impairment rather than climate anxiety in its fullest sense.
        Ultimately, we recommend that future research use the full measure of climate
        change anxiety, which can adequately capture both dimensions of climate anxiety
        conceptualized by Clayton and Karazsia (i.e., functional impairment and cognitive-emotional
        dimensions) [<a href=\"#pmen.0000749.ref009\" class=\"ref-tip\">9</a>].</p>\n<a
        id=\"article1.body1.sec5.sec1.p4\" name=\"article1.body1.sec5.sec1.p4\" class=\"link-target\"></a><p>Fourth,
        while the Cronbach\u2019s alpha for linking social capital in our study (\u03B1\u2009=\u2009.66)
        fell slightly below the conventional.70 threshold, this likely reflects the
        inherent multi-dimensionality of linking social capital as a construct rather
        than poor reliability per se. Cronbach\u2019s alpha assumes unidimensionality
        [<a href=\"#pmen.0000749.ref046\" class=\"ref-tip\">46</a>]. This is a condition
        that works against linking social capital, which captures structurally distinct
        ties between individuals and institutional actors [<a href=\"#pmen.0000749.ref022\"
        class=\"ref-tip\">22</a>]. Yet we should note that the mean inter-item correlation
        for the linking social items in our present study was.41. This falls within
        the acceptable range recommended for multidimensional constructs [<a href=\"#pmen.0000749.ref047\"
        class=\"ref-tip\">47</a>], thus providing supplementary evidence of adequate
        reliability.</p>\n<a id=\"article1.body1.sec5.sec1.p5\" name=\"article1.body1.sec5.sec1.p5\"
        class=\"link-target\"></a><p>Finally, the data analyzed for this study were
        not representative of the population of interest. Nevertheless, we believe
        the use of a non-probability sample is appropriate given the context. Identifying
        a representative sample of individuals affected by hurricanes poses significant
        challenges, particularly when many potential participants are engaged in recovery
        efforts or may lack the time or resources to participate in the current research.
        Thus, even though these are not representative data, we believe it would be
        difficult to obtain this type of sample given the situation after the hurricanes.</p>\n</div>\n\n<div
        id=\"section2\" class=\"section toc-section\"><a id=\"sec020\" name=\"sec020\"
        class=\"link-target\" title=\"5.2 Conclusion\"></a>\n<h3>5.2 Conclusion</h3>\n<a
        id=\"article1.body1.sec5.sec2.p1\" name=\"article1.body1.sec5.sec2.p1\" class=\"link-target\"></a><p>Our
        findings help extend the stress process model and social capital research
        by showing the more nuanced role of social capital. Specifically, we extended
        understanding of the link between hurricane-related stressors among those
        who have experienced major hurricanes and their levels of climate change anxiety,
        and the role of social capital in conditioning this link. We also found some
        evidence suggesting that bonding social capital\u2019s protective role is
        conditional and reverses under high stress. That is, bonding social capital
        may serve a protective role only when hurricane stressors are low, but not
        when they are high. Furthermore, rather than acting as a protective buffer,
        our study suggested higher levels of bridging and linking social capital were
        associated with more climate anxiety. While these findings for social capital
        may be viewed as more reflective of its \u201Cdark side\u201D potential [<a
        href=\"#pmen.0000749.ref016\" class=\"ref-tip\">16</a>], it is worth noting
        that research suggests climate anxiety is also associated with adaptive coping
        strategies, such as increased engagement in pro-environmental behaviors and
        other actions to address or mitigate climate change [<a href=\"#pmen.0000749.ref048\"
        class=\"ref-tip\">48</a>,<a href=\"#pmen.0000749.ref049\" class=\"ref-tip\">49</a>].
        As such, in cases where social capital strengthens the relationship between
        hurricane stressors and climate anxiety, higher levels of climate anxiety
        may result in adaptive climate-related actions, including greater engagement
        in pro-environmental and climate advocacy behaviors. Since our study did not
        assess climate anxiety\u2019s impact on behaviors, it is important for research
        to further analyze this possibility. Practically, we should consider strengthening
        close social support and basic coping skills before disasters occur and stress
        escalates. Post-disaster efforts should manage information flows with clear
        updates, specific resources, and tips to help those in need, and counter misinformation
        to limit unnecessary anxiety.</p>\n</div>\n</div>\n\n\n\n<div xmlns:plos=\"http://plos.org\"
