        id=\"t002fn001\"><p><italic>N</italic>\u2009=\u20091327. * <italic>p</italic>\u2009&lt;\u2009.05,
        ** <italic>p</italic>\u2009&lt;\u2009.01, *** <italic>p</italic>\u2009&lt;\u2009.001.
        Outcome is climate anxiety. Entries are unstandardized regression coefficients
        with standard errors in parentheses. The squared semipartial correlation (sr\xB2)
        for each predictor is also reported, expressed as a percentage, and reflects
        the unique variance accounted for by each predictor.</p></fn>\n</table-wrap-foot>\n</table-wrap>\n<p>RQ2
        investigated whether the association between experiencing hurricane stressors
        and climate anxiety was moderated by the three forms of social capital. First,
        as shown in <xref ref-type=\"table\" rid=\"pmen.0000749.t002\">Table 2</xref>,
        an interaction term between hurricane stressors and bonding social capital
        was significant (<italic>b</italic>\u2009=\u2009.047, <italic>se</italic>\u2009=\u2009.013,
        <italic>p</italic>\u2009&lt;\u2009.001), indicating that the association between
        hurricane stressors and climate anxiety varied at different levels of bonding
        social capital. As shown in <xref ref-type=\"table\" rid=\"pmen.0000749.t003\">Table
        3</xref>, the relationship between hurricane stressors and climate anxiety
        was significant when bonding social capital was at its mean (<italic>b</italic>\u2009=\u2009.073,
        <italic>se</italic>\u2009=\u2009.016, <italic>p</italic>\u2009&lt;\u2009.001)
        and 1SD above the mean (<italic>b</italic>\u2009=\u2009.119, <italic>se</italic>\u2009=\u2009.021,
        <italic>p</italic>\u2009&lt;\u2009.001), but not at 1SD below the mean (<italic>b</italic>\u2009=\u2009.027,
        <italic>se</italic>\u2009=\u2009.020, <italic>p</italic>\u2009=\u2009.176).
        <xref ref-type=\"fig\" rid=\"pmen.0000749.g001\">Fig 1</xref> shows the plot
        of this interaction effect. At low levels of hurricane stressors, participants
        with high bonding social capital reported a relatively low level of climate
        anxiety. However, as hurricane stressors increased, the slope for those with
        high bonding social capital became much steeper than those with lower bonding
        social capital.</p>\n<table-wrap id=\"pmen.0000749.t003\" position=\"float\"><object-id
