        id=\"sec016\">\n<title>4.2 Hypothesis and research questions</title>\n<p>H1
        expected that experiencing hurricane stressors would be positively associated
        with climate anxiety. This hypothesis was supported. Our results indicate
        that with all other variables simultaneously taken into account, hurricane
        stressors were positively associated with climate anxiety in all three regression
        models reported in <xref ref-type=\"table\" rid=\"pmen.0000749.t001\">Table
        1</xref> (<italic>b</italic>\u2009=\u2009.073, <italic>se</italic>\u2009=\u2009.031,
        <italic>p</italic>\u2009&lt;\u2009.001; <italic>b</italic>\u2009=\u2009.065,
        <italic>se</italic>\u2009=\u2009.016, <italic>p</italic>\u2009&lt;\u2009.001;
        <italic>b</italic>\u2009=\u2009.065, <italic>se</italic>\u2009=\u2009.016,
        <italic>p</italic>\u2009&lt;\u2009.001).</p>\n<p>RQ1 investigated how the
        three forms of social capital\u2014bonding, bridging, and linking\u2014are
        associated with climate anxiety. As shown in <xref ref-type=\"table\" rid=\"pmen.0000749.t002\">Table
        2</xref>, there was a negative association between bonding social capital
        and climate anxiety across all three regression models (<italic>b</italic>\u2009=\u2009-.178,
        <italic>se</italic>\u2009=\u2009.032, <italic>p</italic>\u2009&lt;\u2009.001;
        <italic>b</italic>\u2009=\u2009-.179, <italic>se</italic>\u2009=\u2009.032,
        <italic>p</italic>\u2009&lt;\u2009.001; <italic>b</italic>\u2009=\u2009-.180,
        <italic>se</italic>\u2009=\u2009.032, <italic>p</italic>\u2009&lt;\u2009.01).
        However, in all three regression models, bridging (<italic>b</italic>\u2009=\u2009.220,
        <italic>se</italic>\u2009=\u2009.036, <italic>p</italic>\u2009&lt;\u2009.001;
        <italic>b</italic>\u2009=\u2009.217, <italic>se</italic>\u2009=\u2009.036,
        <italic>p</italic>\u2009&lt;\u2009.001; <italic>b</italic>\u2009=\u2009.212,
        <italic>se</italic>\u2009=\u2009.036, <italic>p</italic>\u2009&lt;\u2009.01)
        and linking social capital (<italic>b</italic>\u2009=\u2009.229, <italic>se</italic>\u2009=\u2009.031,
        <italic>p</italic>\u2009&lt;\u2009.001; <italic>b</italic>\u2009=\u2009.230,
        <italic>se</italic>\u2009=\u2009.032, <italic>p</italic>\u2009&lt;\u2009.001;
        <italic>b</italic>\u2009=\u2009.237, <italic>se</italic>\u2009=\u2009.031,
        <italic>p</italic>\u2009&lt;\u2009.01) were found to be both positively associated
        with climate anxiety.</p>\n<table-wrap id=\"pmen.0000749.t002\" position=\"float\"><object-id
        pub-id-type=\"doi\">10.1371/journal.pmen.0000749.t002</object-id><label>Table
