        date-type=\"accepted\">\n<day>4</day>\n<month>3</month>\n<year>2024</year>\n</date>\n</history>\n<permissions>\n<copyright-year>2024</copyright-year>\n<copyright-holder>Siamak
        K. Sorooshyari</copyright-holder>\n<license xlink:href=\"http://creativecommons.org/licenses/by/4.0/\"
        xlink:type=\"simple\">\n<license-p>This is an open access article distributed
        under the terms of the <ext-link ext-link-type=\"uri\" xlink:href=\"http://creativecommons.org/licenses/by/4.0/\"
        xlink:type=\"simple\">Creative Commons Attribution License</ext-link>, which
        permits unrestricted use, distribution, and reproduction in any medium, provided
        the original author and source are credited.</license-p>\n</license>\n</permissions>\n<self-uri
        content-type=\"pdf\" xlink:href=\"info:doi/10.1371/journal.pone.0300720\"/>\n<abstract>\n<p>Alterations
        in the brain\u2019s connectivity or the interactions among brain regions have
        been studied with the aid of resting state (rs)fMRI data attained from large
        numbers of healthy subjects of various demographics. This has been instrumental
        in providing insight into how a phenotype as fundamental as age affects the
        brain. Although machine learning (ML) techniques have already been deployed
        in such studies, novel questions are investigated in this work. We study whether
        young brains develop properties that progressively resemble those of aged
        brains, and if the aging dynamics of older brains provide information about
        the aging trajectory in young subjects. The degree of a prospective monotonic
        relationship will be quantified, and hypotheses of brain aging trajectories
        will be tested via ML. Furthermore, the degree of functional connectivity
        across the age spectrum of three datasets will be compared at a population
        level and across sexes. The findings scrutinize similarities and differences
        among the male and female subjects at greater detail than previously performed.</p>\n</abstract>\n<funding-group>\n<funding-statement>The
        author(s) received no specific funding for this work.</funding-statement>\n</funding-group>\n<counts>\n<fig-count
        count=\"10\"/>\n<table-count count=\"3\"/>\n<page-count count=\"29\"/>\n</counts>\n<custom-meta-group>\n<custom-meta
        id=\"data-availability\">\n<meta-name>Data Availability</meta-name>\n<meta-value>The
        data underlying the results presented in the study are available from 1000FCP
        (<ext-link ext-link-type=\"uri\" xlink:href=\"http://fcon_1000.projects.nitrc.org\"
        xlink:type=\"simple\">http://fcon_1000.projects.nitrc.org</ext-link>), camCAN
        (<ext-link ext-link-type=\"uri\" xlink:href=\"https://www.cam-can.org/index.php?content=dataset\"
        xlink:type=\"simple\">https://www.cam-can.org/index.php?content=dataset</ext-link>),
        and SRPBS (<ext-link ext-link-type=\"uri\" xlink:href=\"https://bicr-resource.atr.jp/srpbsopen\"
        xlink:type=\"simple\">https://bicr-resource.atr.jp/srpbsopen</ext-link>).
        The 1000FCP and camCAN datasets were further processed to arrive at the correlations
        that were used as features in the analysis. The processing is outlined in
        the Materials and Methods of the manuscript, and the processed correlations.
        The code for the data processing and ML analysis, as well as the processed
        data are available from the Github repository (<ext-link ext-link-type=\"uri\"
        xlink:href=\"https://github.com/sorooshyari/PLOS_ONE_2004\" xlink:type=\"simple\">https://github.com/sorooshyari/PLOS_ONE_2004</ext-link>).</meta-value>\n</custom-meta>\n</custom-meta-group>\n</article-meta>\n</front>\n<body>\n<sec
        id=\"sec001\" sec-type=\"intro\">\n<title>Introduction</title>\n<p>An understanding
        of the changes that occur to a brain is fundamental to human neuroscience.
        While variability in person-to-person brain aging is expected due to genetics,
        environment, and life events, there are also changes that are more salient.
        Resting-state fMRI can be collected relatively quickly and easily from subjects
        of different ages, demographics, and possible pathologies. Atypical brain
        aging is often reflective of or a precursor to developmental disorders. Furthermore,
        abnormal trajectories in brain age have been implicated in Parkinson\u2019s
        disease (PD) [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref001\">1</xref>],
        Alzheimer\u2019s disease (AD) [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref002\">2</xref>],
        as well as several other neural pathologies [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref003\">3</xref>]
        and even mortality [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref004\">4</xref>].
        Utilizing fMRI data to investigate brain aging dynamics entails examining
        alterations in measures of functional connectivity (FC). Typically, patterns
        of correlated activity between regions of interest (ROIs) are compared between
        conditions to assess whether there are changes. In the case of aging, differences
        between connectivity maps are quantified and used to predict age with the
        purpose of identifying if and how brain signals change over time. Due to its
        importance, age prediction from brain activity has been undertaken across
        sizable datasets.</p>\n<p>Subsequent to correlational studies and graph-theoretic
        approaches, machine learning (ML) has been used to discover structure by performing
        either regression or classification. There exists a growing number of works
        that use ML to answer questions pertaining to brain aging. In [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref005\">5</xref>] support vector regression (SVR) was
        used to estimate brain age. Three groups of subjects were considered with
        the ages of a subject lying in between 6 and 35 years. The considered age
        range was limited in comparison to more recent works as well as the data considered
        in this work. The work considered 12,720 FC features per subject and pare
        to 200 for the analysis. LASSO regression was used in [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref006\">6</xref>] to predict brain age by considering
        over 14,000 healthy participants from the UK Biobank. Interestingly, that
        work found that resting and task-based fMRI are relatively uninformative in
        comparison to several variants of MRI, i.e. T1-weighted MRI, T2-FLAIR,T2*,
        and diffusion-MRI, at chronological age prediction. A review on the use of
        ML techniques for rsfMRI analysis is provided in [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref007\">7</xref>]. We shall highlight several of the more
        recent and particularly relevant works below.</p>\n<p>The deviation of a person\u2019s
        brain age from biological age may also be affected by sex as there is no reason
        to assume that the prospective changes are uniform among males and females.
        Works are increasingly incorporating sex as either a predictor or a response
        variable when evaluating brain age. A recent study [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref008\">8</xref>] considered over 4,000 subjects across
        a wide age spectrum from five different sites. Ridge regression was used,
        and brain age prediction performance was quantified via the mean absolute
        error (MAE) and correlation between the predicted and actual ages. The work
        quantified the effects of a multiscale study by considering various numbers
        of functional networks in the predictive analysis. In [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref009\">9</xref>] the authors consider over 9,000 different
        pipelines consisting of hyperparameter values across a large (over 14,000)
        number of subjects from the Human Connectome Project (HCP) and UK Biobank.
        Correlation-based measures of functional connectivity were computed and used
        as inputs for several classifiers including variants of deep learning (DL).
        It was noted that the regularized regression method elastic net performs comparably
        with DL schemes for age prediction.</p>\n<p>We use an ML pipeline to study
        whether brain aging is a progressive phenomenon that can be characterized
        by a monotonic relationship. Recordings of different age groups will be used
        in a training procedure with the resulting machine asked to classify subjects
        from age groups that the machine has not previously encountered. The findings
        will reveal a prospective similarity or difference among the connectivity
        of brains from a test set to those that are younger or older. Several hypotheses
        will be presented and tested. Namely, what degree of monotonicity exists in
        the changes experienced by brains during aging? How consistent are the findings
        across datasets? Does the aging trajectory of young brains provide insight
        into the aging trajectory of older brains? Conversely, are alterations in
        older subjects informative of brain activity earlier in life? To the best
        of our knowledge, such analysis has not been previously undertaken in imaging
        studies that assess FC.</p>\n<p>The dedifferentiation theory of aging was
        presented to reflect evidence of brain activity that is localized to specific
        regions in young adults becoming less localized with aging [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref010\">10</xref>]. While there exist advancements to
        and affirmations of the dedifferentiation theory of aging [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref011\">11</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref012\">12</xref>],
        we scrutinize the variability in the FC that appears at the various age groups
        by computing the number of significant connections across the brains of subjects
        to evaluate how they are altered by aging. The study shall be undertaken separately
        for male and female subjects as well to assess sex differences. The analysis
        constitutes novel findings and quantifies the modularity with the inclusion
        of anticorrelations. The majority of FC fMRI works restrict attention to positive
        connections and do not differentiate by sex.</p>\n</sec>\n<sec id=\"sec002\"
        sec-type=\"materials|methods\">\n<title>Materials and methods</title>\n<sec
        id=\"sec003\">\n<title>Subjects, imaging acquisition, and ROI definition</title>\n<p>Three
        different datasets were considered. <xref ref-type=\"table\" rid=\"pone.0300720.t001\">Table
        1</xref> contains a comparative listing of the number of subjects per age
        group in each dataset. The age groups have been selected on (approximately)
        a decade basis. A subject division by sex is also provided and will be necessary
        for the assessment of FC differences among males and females during aging.
        The first dataset consists of participants from the International Neuroimaging
        Data-sharing Initiative (INDI), 1000 Functional Connectomes\u2019 Project
        (1000FCP) [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref013\">13</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref014\">14</xref>]. The cohort
        contains N = 887 individuals from 17 centers with the requirement that a center
        provide a minimum of 10 participants with full brain anatomical and functional
        coverage. The ages of the subjects spanned 21\u201385 years, and 514 were
        female. All subjects were at rest and not performing any task during recording.
        Some subjects had their eyes open while some had their eyes closed, and each
        recording consisted of signals collected for 42 ROIs. Our analysis is based
        upon preprocessed data of ROIs obtained from a previous study. We provide
        an overview of the most relevant section from the methods of [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref011\">11</xref>]. Seed-based analysis was performed
        as previously described [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref015\">15</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref016\">16</xref>] to identify
        seven networks. The following seed regions were used to delineate the networks:
        left posterior cingulate cortex, right frontoinsula, right intraparietal sulcus,
        right superior parietal cortex, left auditory cortex, right visual cortex,
        and left motor cortex. Each seed was defined as a 6 mm radius sphere centered
        on previously published foci. Correlation maps were produced by extracting
        the time course from each of the above seeds. Then, the Pearson correlation
        coefficient (PCC) between the time course and the time course of each voxel
        across the whole brain was computed to create the voxel-wise connectivity
        maps. The maps from a young age group (N = 458, 21\u201330 years) were used
        to identify peak coordinates of additional ROIs representing each network.
        All regions were defined as 6 mm radius spheres around the peak coordinate.
        Information regarding the participants, number of time points collected for
        each recording, and the rsfMRI acquisition and epidemiological parameters
        of the different centers are detailed in <xref ref-type=\"table\" rid=\"pone.0300720.t002\">Table
        2</xref> as well as Tables <xref ref-type=\"table\" rid=\"pone.0300720.t001\">1</xref>
        and <xref ref-type=\"table\" rid=\"pone.0300720.t002\">2</xref> of [<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>].</p>\n<table-wrap
        id=\"pone.0300720.t001\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0300720.t001</object-id>\n<label>Table
