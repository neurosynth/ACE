        xlink:type=\"simple\">Creative Commons Attribution License</ext-link>, which
        permits unrestricted use, distribution, and reproduction in any medium, provided
        the original author and source are credited.</license-p>\n</license>\n</permissions>\n<self-uri
        content-type=\"pdf\" xlink:href=\"info:doi/10.1371/journal.pone.0303969\"/>\n<abstract>\n<sec
        id=\"sec001\">\n<title>Background</title>\n<p>The left ventricular (LV) changes
        which occur in Friedreich ataxia (FRDA) are incompletely understood.</p>\n</sec>\n<sec
        id=\"sec002\">\n<title>Methods</title>\n<p>Cardiac magnetic resonance (CMR)
        imaging was performed using a 1.5T scanner in subjects with FRDA who are homozygous
        for an expansion of an intron 1 GAA repeat in the <italic>FXN</italic> gene.
        Standard measurements were performed of LV mass (LVM), LV end-diastolic volume
        (LVEDV) and LV ejection fraction (LVEF). Native T1 relaxation time and the
        extracellular volume fraction (ECV) were utilised as markers of left ventricular
        (LV) diffuse myocardial fibrosis and late gadolinium enhancement (LGE) was
        utilised as a marker of LV replacement fibrosis. FRDA genetic severity was
        assessed using the shorter <italic>FXN</italic> GAA repeat length (GAA1).</p>\n</sec>\n<sec
        id=\"sec003\">\n<title>Results</title>\n<p>There were 93 subjects with FRDA
        (63 adults, 30 children, 54% males), 9 of whom had a reduced LVEF (&lt;55%).
        A LVEDV below the normal range was present in 39%, a LVM above the normal
        range in 22%, and an increased LVM/LVEDV ratio in 89% subjects. In adults
        with a normal LVEF, there was an independent positive correlation of LVM with
        GAA1, and a negative correlation with age, but no similar relationships were
        seen in children. GAA1 was positively correlated with native T1 time in both
        adults and children, and with ECV in adults, all these associations independent
        of LVM and LVEDV. LGE was present in 21% of subjects, including both adults
        and children, and subjects with and without a reduced LVEF. None of GAA1,
        LVM or LVEDV were predictors of LGE.</p>\n</sec>\n<sec id=\"sec004\">\n<title>Conclusion</title>\n<p>An
        association between diffuse interstitial LV myocardial fibrosis and genetic
        severity in FRDA was present independently of FRDA-related LV structural changes.
        Localised replacement fibrosis was found in a minority of subjects with FRDA
        and was not associated with LV structural change or FRDA genetic severity
        in subjects with a normal LVEF.</p>\n</sec>\n</abstract>\n<funding-group>\n<award-group
        id=\"award001\">\n<funding-source>\n<institution-wrap>\n<institution-id institution-id-type=\"funder-id\">http://dx.doi.org/10.13039/100002108</institution-id>\n<institution>Friedreich's
        Ataxia Research Alliance</institution>\n</institution-wrap>\n</funding-source>\n<award-id>Bronya
        J Keats International Research Collaboration Award</award-id>\n<principal-award-recipient>\n<name
        name-style=\"western\">\n<surname>Delatycki</surname>\n<given-names>Martin
        B.</given-names>\n</name>\n</principal-award-recipient>\n</award-group>\n<funding-statement>This
        study was funded by the Friedreich Ataxia Research Alliance (FARA) Bronya
        J Keats International Research Collaboration Award (curefa.org). The funders
        had an advisory role in study design and data collection, but no role in data
        analysis, decision to publish or preparation of the manuscript.</funding-statement>\n</funding-group>\n<counts>\n<fig-count
        count=\"2\"/>\n<table-count count=\"10\"/>\n<page-count count=\"19\"/>\n</counts>\n<custom-meta-group>\n<custom-meta
        id=\"data-availability\">\n<meta-name>Data Availability</meta-name>\n<meta-value>All
        relevant data are within the manuscript and its <xref ref-type=\"sec\" rid=\"sec021\">Supporting
        information</xref> files.</meta-value>\n</custom-meta>\n</custom-meta-group>\n</article-meta>\n</front>\n<body>\n<sec
        id=\"sec005\" sec-type=\"intro\">\n<title>Introduction</title>\n<p>Friedreich
        ataxia (FRDA) is an autosomal recessive neurodegenerative disease caused by
        pathogenic variants in the <italic>FXN</italic> gene which encodes for the
        mitochondrial protein frataxin [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref001\">1</xref>].
        Cardiac disease is a frequent accompaniment of FRDA, can lead to arrhythmias
        and cardiac failure, and is the most common cause of death [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref002\">2</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref004\">4</xref>].
        A proportion of subjects with FRDA develop a reduced LV ejection fraction
        (LVEF) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref005\">5</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref007\">7</xref>], and post mortem histology
        of the heart in FRDA has shown extensive interstitial fibrosis, focal degeneration
        of muscle fibres and active muscle necrosis [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref008\">8</xref>].
        An increase in LV wall thickness and a reduction in LV chamber size are more
        common than, and likely precede and predispose to, a subsequent reduction
        of LVEF in FRDA [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref005\">5</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref007\">7</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref009\">9</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>].
        However, there is little information about the histological changes in the
        LV myocardium during the early stages of the disease process.</p>\n<p>A better
        understanding of the changes which occur in the myocardium in FRDA prior to
        a reduction in LVEF is important for future attempts to modify or prevent
        cardiac disease progression. Cardiac magnetic resonance (CMR) not only provides
        a gold standard assessment for LV volumes and LV mass (LVM), but with the
        use of intravenous gadolinium and late imaging to detect late gadolinium enhancement
        (LGE), it also provides a non-invasive technique for the visualisation of
        localised replacement myocardial fibrosis [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref016\">16</xref>].
        Furthermore, sensitive quantitative information about more generalised changes
        in the LV myocardium can be obtained using T1 mapping techniques [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref017\">17</xref>]. Both native T1 relaxation time and
        calculated myocardial extracellular volume fraction (ECV) have been shown
        to increase in the presence of diffuse myocardial fibrosis [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref017\">17</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref021\">21</xref>].
        However, there has only been limited investigation in FRDA into the presence
        of LGE [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref006\">6</xref>, <xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref022\">22</xref>\u2013<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref024\">24</xref>] or diffuse myocardial fibrosis [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref024\">24</xref>].</p>\n<p>Approximately
        96% of FRDA is due to homozygosity for a GAA expansion in intron 1 of <italic>FXN</italic>,
        with the other 4% being compound heterozygous for a GAA expansion and a different
        <italic>FXN</italic> pathogenic variant. In the homozygous group, the number
        of GAA repeats in the shorter allele of the <italic>FXN</italic> gene (GAA1)
        is inversely related to cellular levels of frataxin [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref025\">25</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref026\">26</xref>],
        and there has therefore been interest in the ability of GAA1 to explain cardiac
        disease severity in FRDA. GAA1 has been reported to be a predictor of cardiac
        death [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref003\">3</xref>, <xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref004\">4</xref>], of progression to
        a reduced LVEF [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref007\">7</xref>],
        and has also been associated with increased LV wall thickness [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref004\">4</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref009\">9</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref010\">10</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref012\">12</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref027\">27</xref>], relative wall
        thickness (RWT) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref022\">22</xref>],
        LV mass (LVM) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref010\">10</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref028\">28</xref>] and LVM index (LVMI) [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref009\">9</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref029\">29</xref>]
        and a smaller LV end-diastolic diameter (LVEDD) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref004\">4</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>] and LV end-diastolic
        volume (LVEDV) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref014\">14</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>]. The aims of
        the present study using CMR with gadolinium injection in adults and children
        with FRDA homozygous for GAA repeat expansions, were to quantify LV volumes,
        LVM, native T1 time and ECV, to determine the presence and extent of LGE,
        and to investigate the relationship of these LV variables with GAA1, age at
        onset of symptoms (AOS), symptom duration (SDur), age and the age group (i.e.
        children versus adults).</p>\n</sec>\n<sec id=\"sec006\" sec-type=\"materials|methods\">\n<title>Materials
        and methods</title>\n<sec id=\"sec007\">\n<title>Subjects</title>\n<p>Children
        and adults homozygous for a GAA expansion in intron 1 of <italic>FXN</italic>
        and aged between 10 and 50 years were recruited through clinical research
        programs (including the Collaborative Clinical Research Network in FA (CCRN-FA)
        and from the Friedreich Ataxia clinics at Monash Health, Melbourne, Victoria,
        Australia and the Children\u2019s Hospital of Philadelphia, PA, USA. Prior
        to undergoing CMR all individuals had their renal function evaluated and estimated
        glomerular filtration rate (eGFR) calculated to confirm the absence of renal
        dysfunction and thus the safety of gadolinium administration. Individuals
        with known ischemic heart disease, hypertension, more than mild valvular disease,
        a persistent atrial arrhythmia or contraindications to CMR or gadolinium injection
        were excluded from the study. Approval for this study was provided by the
        Human Research Ethics Committee of the Royal Children\u2019s Hospital, Melbourne,
        Victoria, Australia and the Institutional Review Board of the Children\u2019s
        Hospital of Philadelphia, PA, USA. All participants in the study, or their
        parents/guardians if the participant was aged under 18 years, provided written
        informed consent as per the Declaration of Helsinki.</p>\n<p>Height and weight
        were measured, and body surface area (BSA) and body mass index were calculated,
        using standard formulae. AOS was defined as the time when an individual or
        their parents first noted neurological or non-neurological symptoms of FRDA,
        and SDur was defined as the time between AOS and the time of CMR testing.
        GAA repeat size in the smaller (GAA1) and larger (GAA2) alleles of the <italic>FXN</italic>
        gene were determined using a single in-house method at the Melbourne site
        and from different commercial laboratories at the Philadelphia site. Clinical
        severity of neurological disease was evaluated to provide a neurological profile
        of the cohort by performance of the neurological component of the Friedreich
        Ataxia Rating Scale (nFARS) within one month of the CMR study (available in
        81 subjects, score out of 125). A blood sample was drawn on the same day as
        the CMR study for measurement of haematocrit (Hct).</p>\n</sec>\n<sec id=\"sec008\">\n<title>Cardiac
        magnetic resonance protocol</title>\n<p>CMR studies were performed using similar
        protocols on 1.5T magnetic resonance imaging units (Magnetom Avanto in Philadelphia
        and Magnetom Aera in Melbourne; Siemens Medical Solutions, Erlangen, Germany).
        Breath-held images were acquired in expiration, and a 4-lead vector-electrocardiogram
        was recorded for gating purposes. Following standard localising images, true
        fast imaging with steady-state precession (TrueFISP) cine images were acquired
        in the 4-chamber, 2-chamber, and 3-chamber views and used to plan short axis
        imaging. End-expiration basal, mid-cavity, and apical short axis native T1
        images were collected using the optimised parameter set of a Modified Look-Locker
        Inversion recovery (MOLLI) research sequence provided by Siemens with an acquisition
        rest/schema of 5(3)3 designed for long T1 values in native scans.</p>\n<p>An
        IV injection of gadobutrol (Gadovist 1.0, Bayer AG, Berlin, Germany) at a
        dose of 0.2 mmol/kg body weight was administered to all subjects and immediately
        following contrast injection, TrueFISP cine functional imaging was obtained
        in contiguous 7.0 mm slices in the short axis. At 10 minutes post contrast
        administration a TI scout sequence was used to determine optimal inversion
        time (average TI = 300 ms) for the late gadolinium enhanced (LGE) images,
        8 mm single slice mid ventricle, TR/TE: 23.67/1.1 ms, flip angle 30\xB0, 340
        mm FOV, and generated using 20 ms increments from 80 to 500 ms. LGE images
        were collected using a free breathing phase sensitive inversion recovery (PSIR)
        technique, as well as single slice, breath held, PSIR with whole ventricular
        coverage in the short axis. Factors for the two sequences were adjusted to
        allow direct comparison, typically TR 700 ms, FOV 340 x 280 mm, flip angle
        45\xB0, matrix = 256 x 192, TI = 300 ms, voxel size 1.3 x 1.3 x 8.0 mm.</p>\n<p>Post
        contrast T1 mapping sequences were acquired at approximately 15 minutes post
        contrast injection using an optimised parameter set for MOLLI using the same
        slice thickness and positions as the native T1 images. TR/TE = 360/112 ms,
        flip angle = 35\xB0, TI = 260 ms, FOV = 360 x 306 mm, matrix = 256 x 168,
        interpolated voxel size = 1.4 x 1.4 x 8.0 mm, GRAPPA = 2 with 36 reference
        lines. An acquisition/rest schema of 4(1)3(1)2 was employed to account for
        short TI values post contrast.</p>\n<p>Standard measurements of CMR volumes,
        LVM and LVEF, and analysis of T1 maps, were performed at each site using cvi42
        v5.3.2 (Circle Cardiovascular Imaging Inc, Calgary, AB, Canada). Papillary
        muscles were included in the myocardial mass and excluded from LV volumes.
        The presence of abnormalities of LV end-diastolic volume (LVEDV) and LVM were
        determined using sex and BSA based criteria specific for children or adults
        as appropriate, with papillary muscles excluded from LVEDV and included in
        LVM, and 2 standard deviations (SD) from the mean representing the upper and
        lower limits of the normal range [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref030\">30</xref>].
        Left ventricular hypertrophy (LVH) was defined as a LVM &gt; 2 SD above the
        mean. A LVEF of &lt;55% was defined as reduced. The LVM volume ratio (LVMVR)
        was calculated as the ratio of LVM/LVEDV and used as a marker of concentric
        LV geometry, with an upper limit of the normal range of 0.9 in males and 0.8
        in females [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref030\">30</xref>].
        For myocardial T1 analysis, manual epicardial and endocardial contours were
        drawn on the MOLLI mid ventricular short axis slice and segmented according
        to the American Heart Association (AHA) 16 segment model.</p>\n<p>Reported
        T1 based measurements were an average of results from all the basal and mid
        LV segments as has been previously described [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref031\">31</xref>].
        Extracellular volume fraction (ECV) was calculated using the mean segmental
        pixel value from the MOLLI ECV maps using the formula: ECV = (\u0394[1/T1<sub>myo</sub>]/\u0394[1/T1<sub>blood</sub>])*[1-Hct]).
        A \"synthetic ECV\" was also calculated using a calculated haematocrit utilising
        the equation: synthetic haematocrit = 831.6 * (1 / T1<sub>blood</sub>)\u20140.151
        [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref032\">32</xref>]. Native T1
        times and ECV in individual FRDA subjects could not be classed into normal
        or abnormal in this study because of the lack of an adequate comparison group.
        This is because native T1 times and ECV are not only recognised to be machine
        and protocol dependent, but also because they are sex- and probably also age-dependent
        in adults [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref033\">33</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref036\">36</xref>]. Normal T1 values
        therefore require large numbers of subjects of different ages and of both
        sexes, but these were not available for either adults or children for this
        study. To determine inter-rater reliability of T1 times in CMR studies, 19
        randomly chosen scans had T1 measurements repeated at the alternative site,
        with the study images sent to the alternative site, and the second measurer
        blinded to the previous measurements.</p>\n</sec>\n<sec id=\"sec009\">\n<title>Statistical
        analysis</title>\n<p>Results are expressed as mean \xB1 standard deviation
        or median [range] if not normally distributed. Statistical analysis has been
        performed using Systat V13 (Systat Software, Chicago, IL, USA). Some of the
        analyses have been confined to subjects with a normal LVEF because the number
        of subjects with a reduced LVEF was small, and also because the main focus
        of this study was on the early myocardial changes which occur in FRDA. Children
        and adults were compared but also analysed separately because of previous
        evidence that there may be differences in the relationship of GAA1 with LV
        structural features based on age group [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>].
        Univariate linear regression analysis was performed to assess the relationships
        of CMR variables with selected demographic and FRDA-specific variables of
        interest based on previous findings about the cardiac effects of FRDA. In
        particular, BSA, sex, age, age group (child v adult), AOS, SDur and GAA1 were
        considered in analyses of LV volumes and LVM, and sex [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref033\">33</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref038\">38</xref>],
        age [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref033\">33</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref036\">36</xref>], age group, heart
        rate [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref034\">34</xref>, <xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref038\">38</xref>], AOS, SDur and GAA1
        were considered in analyses of T1 mapping variables. The relationship of GAA2
        with the above independent variables was also investigated but it was not
        a predictor of any of the variables and has not been reported in any of the
        analyses. Categoric variables were included in multivariate models as dummy
        variables for sex (male = 1, female = 0), age group (adults = 1, children
        = 0) and study site (Philadelphia = 1, Melbourne = 0). SDur was not normally
        distributed and was log transformed prior to inclusion in linear regression
        models. Log SDur was positively correlated with age (r = 0.48, p&lt;0.001)
        and GAA1 was negatively correlated with AOS (r = -0.58, p&lt;0.001), and therefore
        these relationships were considered when constructing multivariate models.
        Independent variables were removed during the multivariate modelling process
        if the p value was &gt;0.10, but the final models only show independent variables
        with a p&lt;0.05. Scatter plots and residuals were reviewed to determine if
        there were outliers, and if identified, the possibility of exclusion of the
        outlier from the analysis was considered.</p>\n</sec>\n</sec>\n<sec id=\"sec010\"
        sec-type=\"results\">\n<title>Results</title>\n<p>There were 96 subjects with
        FRDA who underwent CMR imaging, but of these, satisfactory LV volume and mass
        measurements were not possible in 3 subjects, 2 because of an irregular heart
        rate during image acquisition, and one because they were found to have been
        dehydrated at the time of the study. The demographics of the remaining 93
        subjects, comprising 63 adults and 30 children, are shown in <xref ref-type=\"table\"
        rid=\"pone.0303969.t001\">Table 1</xref>. There were three subjects with diabetes,
        all of whom were adults. The numbers for Melbourne and Philadelphia are shown
        separately and demonstrate some variations in subject demography between the
        two sites.</p>\n<table-wrap id=\"pone.0303969.t001\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0303969.t001</object-id>\n<label>Table
