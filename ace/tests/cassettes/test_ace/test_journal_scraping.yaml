        align=\"center\">-0.448</td>\n<td align=\"center\">H3</td>\n</tr>\n<tr>\n<td
        align=\"center\">3</td>\n<td align=\"center\">NKI-RS</td>\n<td align=\"center\">64</td>\n<td
        align=\"center\">230</td>\n<td align=\"center\">45.12</td>\n<td align=\"center\">-0.176</td>\n<td
        align=\"center\">-0.161</td>\n<td align=\"center\">H3</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n</table-wrap>\n<p>While
        quantitative ML analysis of how brain connectivity dynamics are modulated
        by aging is important, it is also necessary to be cognizant of the features
        that are input to the predictive algorithm. The Pearson CC has been used as
        a measure of the degree and direction of the relationship\u2013i.e. connectivity\u2013among
        pairs of ROIs. This measure and its transformations are prevalent in rsfMRI
        works that investigate the effects of aging on CPs. Drawing upon several recent
        studies, in [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref027\">27</xref>]
        task-evoked and rsfMRI were collected from subjects spanning 20 to 93 years.
        The connectivity comparisons concluded that large-scale brain organization
        was maintained during aging, but parcellation differences existed among age
        groups and increased with larger differences in age. Conversely, the resting
        and task fMRI data analyzed in [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref028\">28</xref>]
        led the authors to conclude that FC was lower in older adults. Correlational
        analysis in [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref029\">29</xref>]
        also noted that aging led to a decrease in strong FC across the brain. The
        decrease in modularity was quantified by more uniform activity patterns among
        the ROIs of the older subjects. The more diffuse and fewer strongly correlated
        functional connections with older age has been referred to as functional dedifferentiation
        [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref030\">30</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref032\">32</xref>]. We also note a definitive
        change in FC with increasing age that is more significant in the latter decades
        of the subjects. Two of the datasets show the strength of the connections
        to decrease (supporting functional dedifferentiation) while contrary results
        were noted with the SRPBS cohort. The general decrease in the mean number
        of significant CC values with increasing age is consistent with several prior
        reports of the modularity in functional networks decreasing with aging [<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref029\">29</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref033\">33</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref034\">34</xref>]. A recent work
        found mostly weakened connectivity with aging among subjects, but an increase
        in several cases [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref008\">8</xref>].
        The authors attribute the increases to the within network FC of several prominent
        systems such as the visual and somatomotor. In [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref035\">35</xref>]
        a four-year longitudinal analysis of N = 16 elderly subjects (69+ y.o. at
        the start of the study) was undertaken. The results revealed a decrease in
        FC in two of the three considered brain networks. Such findings are interesting
        in accommodating the non-unanimous results noted here when considering three
        distinct datasets.</p>\n<p>The BOLD fMRI signal has been processed to quantify
        FC in assessing a large scale of phenotypes studied in resting and task-based
        studies. Surprisingly, much less attention has been given to its inter-subject
        variability. In this work the variability in FC was studied by computing the
        s.d. at various decades. An inverted U-shape was noted in quantifying the
        variability in two of the three datasets where the middle-aged-to-elder subjects\u2014i.e.
        51\u201360 y.o.\u2014showed the highest variability. The findings point toward
        brain aging being a complex process where alterations in cohorts do not simply
        increase, decrease, or remain constant across the decades of life. The peak
        in variability during middle age presents intriguing possibilities as far
        as peoples\u2019 lifestyle, occupation, and perhaps their personality being
        the most different during that juncture. Interestingly, the peak occurred
        at different junctures within the middle-to-elder range for male and female
        subjects.</p>\n<p>Another largely neglected facet of connectivity-based fMRI
        analysis is the consideration of anticorrelations. While we note that the
        relative change of significant anticorrelations during aging generally follow
        what was seen for the positive correlations, there were discrepancies. Perhaps
        more importantly, including the negative correlations in a tally of the connectivity
        changes does lead to altered or new findings. With the 1000FCP subjects, if
        one was to restrict attention to the canonical positive connections, then
        a significant decrease in connectivity would be seen between the two earliest
        decades of the considered ages. However, incorporating the anticorrelations
        into the total indicates that the change is not significant. Additionally,
        for the 1000FCP data, the loss of FC in the male subjects for the 81+ y.o.
        group was not deemed significant when accounting for only the positive correlations
        (or the anticorrelations)\u2013yet, the aggregate account shows statistical
        significance. A similar result occurred for the oldest group of male SRPBS
        subjects. Namely, counting the standard (positive) correlations showed no
        significant alteration in the number of functional connections, whereas the
        inclusion of anticorrelations indicated that the FC of 71+ y.o. males is modulated
        in comparison to the reference young group. This reveals that when assessing
        FC, an aggregate connectivity measure should be considered rather than solely
        positive correlations.</p>\n<p>Human and animal studies are increasingly becoming
        cognizant of the differences between the sexes and performing separate analyses.
        Thus, the attainment of trajectories of healthy brain aging in males and females
        is important. Repeating the per-decade FC analysis for male and female subjects
        provided several findings. First, the changes in connectivity with aging were
        similar between males and females in the three datasets. Second, the modulation
        in the dynamics were more pronounced (i.e. statistically significant) for
        males. Such a result would be important to take into account when assessing
        deviations from a baseline in a male versus a female. Perhaps most importantly,
        the results reveal that the modulation in FC with age is not as prominent
        when male and female subjects are considered separately rather than together.
        This accentuates the prudence of separate sex analyses in age-related studies
        across a population. The inter-subject variability in FC among the sexes also
        yielded interesting results. Although the peak variabilities occurred at different
        junctures in the age spectrum between males and females, they occurred in
        the middle-to-elder range. This result, however, did not hold in one dataset
        where the youngest group of males exhibited the largest variance. Such discrepancy
        highlights the general difficulty in attaining consensus across datasets in
        light of the brain being a nonlinear stochastic system while aging is a complex
        process. It also warrants the requirement of further scrutiny via additional
        datasets, methodologies, and computation.</p>\n<p>The datasets considered
        in this work share similarities as well as differences. The 1000FCP subjects
        spanned 17 centers necessitating an investigation of site effects. The monotonicity
        and change in FC analyses were repeated on subjects from the NKI-RS center
        to investigate if the trends noted with all subjects coincide with those seen
        for the largest constituent center. Interval 1 results on the presence and
        degree of monotonicity coincided with those attained for 1000FCP. The interval
        2 findings also agreed on the absence of a monotonic relationship. Contrarily,
        the interval 3 conclusions were different because the NKI-RS analysis did
        not reflect a monotonic relationship. Aside from possible site effects, such
        deviation may be due to the single-site dataset providing a fewer number of
        subjects in the ML training set as well as in the test set. The change in
        FC analysis conducted on the NKI-RS subjects provided results that were very
        similar to the aggregate results. In the constituent and the 1000FCP, there
        was an increase in variability among middle age to elder subjects, and a reduction
        in FC variability for the two oldest decades. The trends noted for the positive
        and negative correlations also coincided. Furthermore, the sex differences
        in FC that were observed in the NKI-RS subjects agreed with those of the collective
        dataset. In summary, the results are suggestive of site effects not being
        prominent in the results presented for the 1000FCP recordings. Nevertheless,
        the use of harmonization techniques [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref036\">36</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref037\">37</xref>] is a future
        avenue for further assessing to what degree the presented results may be affected.</p>\n<p>The
        SRPBS and camCAN studies maintained a constant protocol with respect to all
        subjects having their eyes open and closed, respectively, during the recordings.
        This was not the case with the 1000FCP dataset (<xref ref-type=\"supplementary-material\"
        rid=\"pone.0300720.s005\">S1 Table</xref>). It is not unusual for rsfMRI investigations
        to consider a mixture of subjects of different arousal states [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref011\">11</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref038\">38</xref>].
        Nevertheless, we consider the monotonicity and quantification of FC separately
        for the 1000FCP recordings where subjects had their eyes open. The conclusions
        of the monotonicity analysis when subjects had their eyes open (N = 543) generally
        agreed with those attained with the aggregated subjects (<xref ref-type=\"supplementary-material\"
        rid=\"pone.0300720.s002\">S2 Fig</xref>). The hypotheses derived from interval
        1 and interval 2 agree between the two studies. However, the interval 3 results
        indicate the absence of a monotonic relationship between the chronological
        age and the percentage of subjects classified as aged when considering only
        subjects with eyes open during recordings (<xref ref-type=\"supplementary-material\"
        rid=\"pone.0300720.s002\">S2C Fig</xref>). The findings pertaining to the
        change in FC across decades were consistent when considering all 1000FCP subjects
        and separately studying the subjects with eyes open (<xref ref-type=\"supplementary-material\"
        rid=\"pone.0300720.s002\">S2D Fig</xref>).</p>\n<p>The study of FC alterations
        with aging was repeated with thresholds of |\u03C1 = 0.45| and |\u03C1 = 0.7|
        for declaring connections (<xref ref-type=\"supplementary-material\" rid=\"pone.0300720.s003\">S3</xref>
        and <xref ref-type=\"supplementary-material\" rid=\"pone.0300720.s004\">S4</xref>
        Figs). Scrutiny with lower and higher thresholds aims to expurgate spurious
        relationships that would arise with noise-dominated signals (i.e. low SNR
        recordings). With the decreased value of |\u03C1 = 0.45|, the per-dataset
        trends in the mean and variability of the number of FCs across the age spectrum
        matched what was reported in <xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig
        6</xref>. There were naturally a larger number of FCs per age group with the
        lower threshold. Similarly, although a higher threshold lowered the number
        of FCs in every age group, the trends in the mean and variability were consistent
        to those observed in <xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig
        6</xref>. The results are reassuring by reproducing the findings despite less
        stringent as well as more conservative threshold values from what we initially
        considered. Nevertheless, more detailed analysis of the FC dependency during
        aging on the SNR and threshold values is an avenue of future research. There
        is an additional caveat of the number of ROIs not being constant among the
        considered datasets. However, it is not uncommon in fMRI studies that examine
        multiple datasets to assess BOLD differences with different ROI numbers and
        selection schemes [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref039\">39</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref041\">41</xref>]. For instance, the
        authors of [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref042\">42</xref>]
        compared age prediction results with 419 ROIs from HCP subjects and 55 ROIs
        from UK Biobank subjects. Despite the ML pipeline ensuring that the same number
        of young and aged subjects are used to train an SVM, there is an unequal number
        of subjects considered across the age groups in the datasets. This is a consequence
        of the subject imbalance between ages that exists in neuroimaging studies
        where age is a predictive variable and spans a broad range. Rather than being
        a hinderance, this is standard among related works [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref008\">8</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref043\">43</xref>].
        The number of data points across the subjects at different recording centers
        was also not constant. This is consistent with related works such as [<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref044\">44</xref>]. A recent work evaluated brain age
        prediction accuracy for varying number of time points and observed improvements
        with the number of time points [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref045\">45</xref>].
        However, the increases were reported as being relatively small. Lastly, it
        should be noted that more sophisticated and computationally demanding algorithmic
        techniques such as DL may provide more accurate prediction results and reveal
        FC properties in any one of the considered datasets. However, the techniques
        may also overfit a different dataset to provide marginal predictive capability
        and obscure FC characteristics by not generalizing. An SVM classifier was
        considered in this work due to its simplicity, general robustness, and interpretability.
        A comparative study with more advanced methods is a future avenue of investigation.</p>\n</sec>\n<sec
        id=\"sec016\" sec-type=\"supplementary-material\">\n<title>Supporting information</title>\n<supplementary-material
        id=\"pone.0300720.s001\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.s001\"
        xlink:type=\"simple\">\n<label>S1 Fig</label>\n<caption>\n<title>Brain age
        monotonicity without application of a sliding window.</title>\n<p>The results
        of the brain age monotonicity study for intervals 1, 2, and 3 without application
        of a 5-year sliding window. To test for a trend, a linear regression was fit
        to the data with the intercept \u03B2<sub>0</sub> and slope \u03B2<sub>1</sub>.
        A) For 1000FCP subjects, in interval 1 we have \u03B2<sub>0</sub> = 31.49,
        \u03B2<sub>1</sub> = 0.971. The Spearman correlation of 0.549 computed among
        the percentages of subjects classified as aged and the ages indicates a moderate
        degree of monotonicity between the two quantities. In interval 2 we attain
        \u03B2<sub>0</sub> = 70.94, \u03B2<sub>1</sub> = -0.108 indicating little
        change in the classification of increasingly older brains as aged. The Spearman
        correlation of -0.053 reflects a non-monotonic relationship among the ages
        and the percentage of subjects classified as aged. For interval 3, the values
        \u03B2<sub>0</sub> = 24.33, \u03B2<sub>1</sub> = 0.568, and the Spearman correlation
        of 0.404 signifies a gradual increase and small degree of monotonicity. B)
        When considering the SRPBS subjects, in interval 1 we have \u03B2<sub>0</sub>
        = 6.647, \u03B2<sub>1</sub> = 2.749. The Spearman correlation of 0.818 computed
        among the percentages of subjects classified as aged and the ages demonstrates
        monotonicity between the two quantities. In interval 2 we attain \u03B2<sub>0</sub>
        = 82.49, \u03B2<sub>1</sub> = 0.054 indicating little change in the classification
        of increasingly older brains as aged. The Spearman correlation of 0.108 reflects
        a non-monotonic relationship among the subjects\u2019 ages and the percentage
        labeled as aged. For interval 3, the values \u03B2<sub>0</sub> = 3.48, \u03B2<sub>1</sub>
        = 0.748, and the Spearman correlation of 0.544 indicates an increase and moderate
        degree of monotonicity. C) For the camCAN dataset, in interval 1 we have \u03B2<sub>0</sub>
        = 0, \u03B2<sub>1</sub> = 2.254. The Spearman correlation of 0.9027 computed
        among the percentages of subjects classified as aged and the subject ages
        signifies a high degree of monotonicity between the two quantities. In interval
        2 we attain \u03B2<sub>0</sub> = 76.42, \u03B2<sub>1</sub> = 0.3706 demonstrating
        little change in the classification of increasingly older brains as aged.
        The Spearman correlation of 0.386 reflects a non-monotonic relationship. For
        interval 3, the values \u03B2<sub>0</sub> = 32.301, \u03B2<sub>1</sub> = -0.1968,
        and the Spearman correlation of -0.118 indicate a gradual decrease and non-monotonicity
        in the number of subjects classified as aged with increasing biological age.
        D) With the NKI-RS subjects, in interval 1 we have \u03B2<sub>0</sub> = 39.71,
        \u03B2<sub>1</sub> = 0.858. The Spearman correlation of 0.396 demonstrates
        small to no monotonicity between the percentages of subjects classified as
        aged and the ages. In interval 2 we attain \u03B2<sub>0</sub> = 64.78, \u03B2<sub>1</sub>
        = 0.496 which indicates a gradual increase in the classification of increasingly
        older brains as aged. The Spearman correlation of 0.371 reflects an absence
        of monotonicity among the subjects\u2019 ages and the percentage labeled as
        aged. For interval 3, the values \u03B2<sub>0</sub> = 45.75, \u03B2<sub>1</sub>
        = -0.206, and the Spearman correlation of -0.112 indicates a non-monotonic
        but decreasing relationship.</p>\n<p>(TIFF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pone.0300720.s002\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.s002\"
        xlink:type=\"simple\">\n<label>S2 Fig</label>\n<caption>\n<title>Findings
        for subjects with eyes open during the rsfMRI recordings.</title>\n<p>The
        results of the brain age monotonicity and change in FC studies for subjects
        in the 1000FCP dataset that had eyes open during rsfMRI recording. For the
        monotonicity study, the histograms show the number of subjects classified
        as young and aged at every considered age. A 5-year sliding window was applied
        and a linear regression fit to the results with the intercept \u03B2<sub>0</sub>
        and slope \u03B2<sub>1</sub>. A) The analysis consists of a machine trained
        on the youngest and oldest groups and presented with test data of intermediate-aged
        subjects. In interval 1 we have \u03B2<sub>0</sub> = 22.71, \u03B2<sub>1</sub>
        = 1.34. The Spearman correlation of 0.661 computed among the percentages of
        subjects classified as aged and the ages indicates a moderate degree of monotonicity.
        B) A machine was trained on the two youngest groups of subjects and then provided
        with recordings from subjects 41+ y.o. (interval 2). The values \u03B2<sub>0</sub>
        = 54.2, \u03B2<sub>1</sub> = 0.76, and a Spearman correlation of 0.325 indicate
        an absence of monotonicity. C) A machine was trained on subjects from the
        two oldest age groups prior to being presented with the task of classifying
        younger subjects (21\u201360 y.o.) in interval 3. The linear fit values \u03B2<sub>0</sub>
        = 34.32, \u03B2<sub>1</sub> = 0.25, and Spearman correlation of 0.047 signify
        a non-monotonic relationship between chronological age and the percentage
        of subjects classified as aged. D) The change in FC analysis consisted of
        the mean FC computed by averaging across subjects the number of times that
        the Pearson CCs from the connectivity matrix exceeded |<italic>\u03C1</italic>|
        = 0.6. The s.d. of the number of functional connections is shown to study
        the inter-subject variability across the age spectrum.</p>\n<p>(TIFF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pone.0300720.s003\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.s003\"
        xlink:type=\"simple\">\n<label>S3 Fig</label>\n<caption>\n<title>Analysis
        of FC changes with threshold |<italic>\u03C1</italic>| = 0.45.</title>\n<p>A
        study of the change in FC for subjects across decades from the A) 1000FCP,
        B) SRPBS, and C) camCAN datasets. A threshold |<italic>\u03C1</italic>| =
        0.45 was used to determine if the Pearson CCs from the connectivity matrix
        constituted a FC. The mean FC was computed by averaging the FC values across
        the subjects in each age group. A bifurcation of the FC to positive and negative
        (i.e. anticorrelations) directions is also shown. Two-sample t-tests were
        used to assess the significance of the change in FC with the youngest age
        group taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons of positive, negative, and total
        FC values. The s.d. of the number of functional connections is illustrated
        to study the inter-subject variability across the age spectrum.</p>\n<p>(TIFF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pone.0300720.s004\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.s004\"
        xlink:type=\"simple\">\n<label>S4 Fig</label>\n<caption>\n<title>Analysis
        of FC changes with threshold |<italic>\u03C1</italic>| = 0.7.</title>\n<p>A
        study of the change in FC for subjects across decades from the A) 1000FCP,
        B) SRPBS, and C) camCAN datasets. A threshold |<italic>\u03C1</italic>| =
        0.7 was used to determine if the Pearson CCs from the connectivity matrix
        constituted a FC. The mean FC was computed by averaging the FC values across
        the subjects in each age group. A bifurcation of the FC to positive and negative
        (i.e. anticorrelations) directions is also shown. Two-sample t-tests were
        used to assess the significance of the change in FC with the youngest age
        group taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons of positive, negative, and total
        FC values. The s.d. of the number of functional connections is illustrated
        to study the inter-subject variability across the age spectrum.</p>\n<p>(TIFF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pone.0300720.s005\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.s005\"
        xlink:type=\"simple\">\n<label>S1 Table</label>\n<caption>\n<title>1000FCP
        subjects with eyes open or closed.</title>\n<p>A listing of the subjects from
        the 1000FCP with eyes open (N = 543) or closed (N = 197) during the rsfMRI
        recording.</p>\n<p>(TIFF)</p>\n</caption>\n</supplementary-material>\n</sec>\n</body>\n<back>\n<ack>\n<p>The
