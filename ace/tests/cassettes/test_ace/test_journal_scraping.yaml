        id=\"t005fn001\"><p>BSA\u2014body surface area; AOS\u2014age at the onset
        of symptoms</p></fn>\n</table-wrap-foot>\n</table-wrap>\n</sec>\n<sec id=\"sec014\">\n<title>T1
        relaxation times</title>\n<p>T1 relaxation times pre and post gadolinium contrast,
        the partition coefficient, and the ECV calculated using both the measured
        Hct and the calculated Hct, in the total group, and subjects with normal and
        reduced LVEF, are shown in <xref ref-type=\"table\" rid=\"pone.0303969.t006\">Table
        6</xref>. Post contrast T1 imaging was not performed, and thus ECV was also
        not available, in one of the subjects with a reduced LVEF. In the 87 subjects
        in whom both methods for ECV calculation could be performed, the synthetic
        ECV using the calculated Hct gave a slightly higher result (0.286\xB10.050
        v 0.277\xB10.051, p&lt;0.001), but there was a close correlation between the
        two methods (r = 0.97, p&lt;0.001). Because it was available in all subjects
        the synthetic ECV results have been used in all the modelling of ECV. Univariate
        p values for comparison of normal LVEF with the reduced LVEF group are not
        provided in <xref ref-type=\"table\" rid=\"pone.0303969.t006\">Table 6</xref>
        because there were a number of potential confounding factors including sex
        and study site (see below).</p>\n<table-wrap id=\"pone.0303969.t006\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0303969.t006</object-id>\n<label>Table
        6</label> <caption><title>T1 relaxation times.</title></caption>\n<alternatives>\n<graphic
        id=\"pone.0303969.t006g\" mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t006\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th align=\"left\"/>\n<th
        align=\"center\">Total group</th>\n<th align=\"center\">LVEF\u226555%</th>\n<th
        align=\"center\">LVEF&lt;55%</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td align=\"left\">Native
        T1 relaxation time (ms) (n = 93)</td>\n<td align=\"center\">1012\xB142</td>\n<td
        align=\"center\">1010\xB144 (n = 84)</td>\n<td align=\"center\">1019\xB146
        (n = 9)</td>\n</tr>\n<tr>\n<td align=\"left\">Native blood T1 time (ms) (n
        = 93)</td>\n<td align=\"center\">1569\xB191</td>\n<td align=\"center\">1564\xB191
        (n = 84)</td>\n<td align=\"center\">1606\xB193 (n = 9)</td>\n</tr>\n<tr>\n<td
        align=\"left\">Post contrast T1 time (ms) (n = 92)</td>\n<td align=\"center\">476\xB164</td>\n<td
        align=\"center\">445\xB164 (n = 84)</td>\n<td align=\"center\">415\xB160 (n
        = 8)</td>\n</tr>\n<tr>\n<td align=\"left\">Post contrast blood T1 time (ms)
        (n = 92)</td>\n<td align=\"center\">314\xB177</td>\n<td align=\"center\">316\xB180
        (n = 84)</td>\n<td align=\"center\">300\xB156 (n = 8)</td>\n</tr>\n<tr>\n<td
        align=\"left\">Partition coefficient (n = 92)</td>\n<td align=\"center\">0.47\xB10.09</td>\n<td
        align=\"center\">0.47\xB10.07 (n = 84)</td>\n<td align=\"center\">0.53\xB10.13
        (n = 8)</td>\n</tr>\n<tr>\n<td align=\"left\">Synthetic ECV (n = 92)</td>\n<td
        align=\"center\">0.288\xB10.051</td>\n<td align=\"center\">0.284\xB10.045
        (n = 84)</td>\n<td align=\"center\">0.328\xB10.085 (n = 8)</td>\n</tr>\n<tr>\n<td
        align=\"left\">ECV (n = 87)</td>\n<td align=\"center\">0.277\xB10.051</td>\n<td
        align=\"center\">0.274\xB10.046 (n = 80)</td>\n<td align=\"center\">0.314\xB10.084
        (n = 7)</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n<table-wrap-foot>\n<fn
        id=\"t006fn001\"><p>ECV\u2014extracellular volume fraction; Hct\u2014haematocrit</p></fn>\n</table-wrap-foot>\n</table-wrap>\n<p>In
        univariate analyses of the whole group, native T1 time was not different between
        the study sites (p = 0.70), but it was higher in women than men (p&lt;0.001)
        and positively correlated with heart rate (r = 0.30, p = 0.003). After adjusting
        for sex and heart rate, there was no difference in native T1 time between
        subjects with a reduced versus a normal LVEF (p = 0.17). Post contrast T1
        time and ECV were both higher at the Philadelphia than the Melbourne site
        (p&lt;0.002 for both). After adjusting for study site, post contrast T1 time
        was higher in men (p = 0.047), but not correlated with heart rate (p = 0.30)
        and not different between those with a normal versus reduced LVEF (p = 0.47).
        After adjusting for study site, ECV was not correlated with heart rate (p
        = 0.15), there was a trend for it to be higher in females (p = 0.094), and
        it was higher in subjects with a reduced LVEF (p = 0.001).</p>\n</sec>\n<sec
        id=\"sec015\">\n<title>Predictors of native T1 relaxation time in subjects
        with a normal LVEF</title>\n<p>In subjects with a normal LVEF (n = 84), after
        adjusting for sex, heart rate was a positive correlate of native T1 time (\u03B2
        = 0.21, p = 0.029) and children had a higher native T1 time than adults (p
        = 0.02), but when included together in a model of native T1 time, neither
        heart rate (p = 0.09) nor age group (p = 0.061) remained significant predictors.
        In adults with a normal LVEF (n = 57), after adjusting for sex, GAA1 was an
        independent positive correlate of native T1 time (\u03B2 = 0.21, p = 0.013),
        whereas there were no contributions from any of heart rate (p = 0.30), AOS
        (p = 0.57), log SDur (p = 0.35), age (p = 0.37), LVMI (p = 0.063) or LVEDVI
        (p = 0.34). The multivariate model of native T1 time including sex and GAA1
        is shown in <xref ref-type=\"table\" rid=\"pone.0303969.t007\">Table 7</xref>.
        GAA1 accounted for 7% of the variance in native T1 time. There was one outlier
        with a native T1 time of 861 ms (&gt;3 SD below the group mean), but there
        was no significant change in the findings when this outlier was excluded from
        the regression analyses. GAA1 remained a predictor of native T1 time after
        exclusion of diabetic subjects from the analysis (p = 0.025).</p>\n<table-wrap
        id=\"pone.0303969.t007\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.t007</object-id>\n<label>Table
        7</label> <caption><title>Multivariate model of native T1 time in adult subjects
        with a normal LVEF.</title></caption>\n<alternatives>\n<graphic id=\"pone.0303969.t007g\"
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t007\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th
        align=\"left\">Independent variable</th>\n<th align=\"center\">r value in
        univariate analysis</th>\n<th align=\"center\"><italic>\u03B2</italic> in
        multivariate model</th>\n<th align=\"center\">p value in multivariate model</th>\n<th
        align=\"center\">Cumulative adjusted r<sup>2</sup></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td
        align=\"left\">Male sex = 1</td>\n<td align=\"char\" char=\".\">-0.55</td>\n<td
        align=\"char\" char=\".\">-0.42</td>\n<td align=\"char\" char=\".\">0.001</td>\n<td
        align=\"char\" char=\".\">0.29</td>\n</tr>\n<tr>\n<td align=\"left\">GAA1</td>\n<td
        align=\"char\" char=\".\">0.48</td>\n<td align=\"char\" char=\".\">0.30</td>\n<td
        align=\"char\" char=\".\">0.013</td>\n<td align=\"char\" char=\".\">0.36</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n<table-wrap-foot>\n<fn
        id=\"t007fn001\"><p>GAA1\u2014number of GAA repeats in the smaller allele
        of the <italic>FXN</italic> gene</p></fn>\n</table-wrap-foot>\n</table-wrap>\n<p>In
        children with a normal LVEF, native T1 time was not higher in females (p =
        0.10), GAA1 was a positive correlate of native T1 time (r = 0.45, p = 0.02),
        but there were no correlations of native T1 time with any of heart rate (p
        = 0.77), AOS (p = 0.75), log SDur (p = 0.79), age (p = 0.10), LVMI (p = 0.89)
        or LVEDVI (p = 0.88). GAA1 accounted for 17% of the variance in native T1
        time in children.</p>\n</sec>\n<sec id=\"sec016\">\n<title>Predictors of post
        contrast T1 relaxation time in subjects with a normal LVEF</title>\n<p>In
        subjects with a normal LVEF (n = 84), after adjusting for study site, male
        sex was a borderline predictor (p = 0.085) of a higher post contrast T1 time,
        but there was no difference in post contrast T1 time between children and
        adults (p = 0.19). When only adult subjects were analysed, however, both study
        site and sex were independent predictors of post contrast T1 time (<xref ref-type=\"table\"
        rid=\"pone.0303969.t008\">Table 8</xref>). After adjusting for study site
        and sex, in adults there were no independent contributions to the prediction
        of post contrast T1 time from GAA1 (p = 0.16), AOS (p = 0.59), log SDur (p
        = 0.70), heart rate (p = 0.18), age (p = 0.21), LVMI (p = 0.067) or LVEDVI
        (p = 0.056). There were no significant predictors of post contrast T1 time
        in children (p&gt;0.10 for all).</p>\n<table-wrap id=\"pone.0303969.t008\"
        position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.t008</object-id>\n<label>Table
        8</label> <caption><title>Multivariate model of post contrast T1 time in adult
        subjects with a normal LVEF.</title></caption>\n<alternatives>\n<graphic id=\"pone.0303969.t008g\"
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t008\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th
        align=\"left\">Independent variable</th>\n<th align=\"center\">r value in
        univariate analysis</th>\n<th align=\"center\"><italic>\u03B2</italic> in
        multivariate model</th>\n<th align=\"center\">p value in multivariate model</th>\n<th
        align=\"center\">Cumulative adjusted r<sup>2</sup></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td
        align=\"left\">Study site</td>\n<td align=\"char\" char=\".\">0.49</td>\n<td
        align=\"char\" char=\".\">-0.50</td>\n<td align=\"char\" char=\".\">&lt;0.001</td>\n<td
        align=\"char\" char=\".\">0.22</td>\n</tr>\n<tr>\n<td align=\"left\">Male
        sex = 1</td>\n<td align=\"char\" char=\".\">0.33</td>\n<td align=\"char\"
        char=\".\">0.34</td>\n<td align=\"char\" char=\".\">0.003</td>\n<td align=\"char\"
        char=\".\">0.33</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n</table-wrap>\n</sec>\n<sec
        id=\"sec017\">\n<title>Predictors of extracellular volume fraction in subjects
        with a normal LVEF</title>\n<p>In subjects with a normal LVEF (n = 84), ECV
        was higher at the Philadelphia site (p = 0.002), and after adjustment for
        study site, it was higher in children than adults (p = 0.013), but not different
        between males and females (p = 0.11). In contrast, in separate analysis of
        adults with a normal LVEF (n = 57) after adjustment for study site, female
        sex was associated with a higher ECV (p = 0.006). In adults after adjustment
        for study site and sex, ECV was positively correlated with GAA1 (\u03B2 =
        0.30, p = 0.022), there was a positive correlation with log SDur (\u03B2 =
        0.365, p = 0.009), but only a borderline significant contribution from AOS
        (p = 0.069), and no contributions from heart rate (p = 0.25), age (p = 0.21),
        LVMI (p = 0.53) or LVEDVI (p = 0.89). A multivariate model of ECV in which
        there were independent contributions from study site, sex, GAA1 and log SDur
        is shown in <xref ref-type=\"table\" rid=\"pone.0303969.t009\">Table 9</xref>.
        GAA1 accounted for 7% of the variance of ECV and log SDur accounted for an
        additional 7% of the variance in ECV. When diabetics were excluded from the
        analysis, log SDur remained a significant predictor of ECV (p = 0.038), but
        GAA1 was no longer significant (p = 0.066). In children there were no significant
        predictors of ECV from study site, GAA1, AOS, log SDur, age, LVMI and LVEDVI
        (p&gt;0.10 for all).</p>\n<table-wrap id=\"pone.0303969.t009\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0303969.t009</object-id>\n<label>Table
        9</label> <caption><title>Multivariate model of ECV in adult subjects with
        a normal LVEF.</title></caption>\n<alternatives>\n<graphic id=\"pone.0303969.t009g\"
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t009\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th
        align=\"left\">Independent variables</th>\n<th align=\"center\">r value in
        univariate analysis</th>\n<th align=\"center\"><italic>\u03B2</italic> in
        multivariate model</th>\n<th align=\"center\">p value in multivariate model</th>\n<th
        align=\"center\">Cumulative adjusted r<sup>2</sup></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td
        align=\"left\">Study site</td>\n<td align=\"char\" char=\".\">0.47</td>\n<td
        align=\"char\" char=\".\">0. 47</td>\n<td align=\"char\" char=\".\">0.001</td>\n<td
        align=\"char\" char=\".\">0.10</td>\n</tr>\n<tr>\n<td align=\"left\">Male
        sex = 1</td>\n<td align=\"char\" char=\".\">-0.35</td>\n<td align=\"char\"
        char=\".\">-0.24</td>\n<td align=\"char\" char=\".\">0.050</td>\n<td align=\"char\"
        char=\".\">0.20</td>\n</tr>\n<tr>\n<td align=\"left\">GAA1</td>\n<td align=\"char\"
        char=\".\">0.44</td>\n<td align=\"char\" char=\".\">0.27</td>\n<td align=\"char\"
        char=\".\">0.032</td>\n<td align=\"char\" char=\".\">0.27</td>\n</tr>\n<tr>\n<td
        align=\"left\">Log SDur</td>\n<td align=\"char\" char=\".\">0.07</td>\n<td
        align=\"char\" char=\".\">0.34</td>\n<td align=\"char\" char=\".\">0.013</td>\n<td
        align=\"char\" char=\".\">0.34</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n<table-wrap-foot>\n<fn
        id=\"t009fn001\"><p>GAA1\u2014number of GAA repeats in the smaller allele
        of the <italic>FXN</italic> gene; SDur\u2014symptom duration</p></fn>\n</table-wrap-foot>\n</table-wrap>\n</sec>\n<sec
        id=\"sec018\">\n<title>Reproducibility of T1 measurements</title>\n<p>There
        were 19 randomly selected CMR studies (8 from Melbourne and 11 from Philadelphia,
        with gadolinium administered in 18), for which T1 measurements were performed
        independently by the investigators at both sites. The results of the two measurements
        are shown in <xref ref-type=\"table\" rid=\"pone.0303969.t010\">Table 10</xref>.
        There were close correlations of T1 relaxation times for native myocardium
        and blood (r = 0.96\u20130.97, n = 19) and for post contrast myocardium and
        blood (r = 0.96\u20130.97, n = 18). There were no significant differences
        in the repeated measurements for any of these variables.</p>\n<table-wrap
        id=\"pone.0303969.t010\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.t010</object-id>\n<label>Table
        10</label> <caption><title>Blinded remeasurements of T1 relaxation times.</title></caption>\n<alternatives>\n<graphic
        id=\"pone.0303969.t010g\" mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t010\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th
        align=\"left\"/>\n<th align=\"center\">Native T1 time (ms)</th>\n<th align=\"center\">Native
        blood time (ms)</th>\n<th align=\"center\">Post contrast T1 time (ms)</th>\n<th
        align=\"center\">Post contrast blood time (ms)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td
        align=\"left\">N</td>\n<td align=\"center\">19</td>\n<td align=\"center\">19</td>\n<td
        align=\"center\">18</td>\n<td align=\"center\">18</td>\n</tr>\n<tr>\n<td align=\"left\">Melbourne</td>\n<td
        align=\"center\">1017.3\xB139.4</td>\n<td align=\"center\">1583.3\xB1119.8</td>\n<td
        align=\"center\">439.7\xB181.3</td>\n<td align=\"center\">291.3\xB194.0</td>\n</tr>\n<tr>\n<td
        align=\"left\">Philadelphia</td>\n<td align=\"center\">1014.5\xB147.4</td>\n<td
        align=\"center\">1574.0\xB1124.3</td>\n<td align=\"center\">440.4\xB174.3</td>\n<td
        align=\"center\">294.8\xB189.6</td>\n</tr>\n<tr>\n<td align=\"left\">p value
        for comparisons of measurements</td>\n<td align=\"center\">0.88</td>\n<td
        align=\"center\">0.50</td>\n<td align=\"center\">0.90</td>\n<td align=\"center\">0.59</td>\n</tr>\n<tr>\n<td
        align=\"left\">r for correlations between measurements</td>\n<td align=\"center\">0.95</td>\n<td
        align=\"center\">0.97</td>\n<td align=\"center\">0.96</td>\n<td align=\"center\">0.96</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n</table-wrap>\n</sec>\n<sec
        id=\"sec019\">\n<title>Late gadolinium enhancement</title>\n<p>LGE was present
        in 19 of the 92 (21%) subjects who had a contrast injection. One of these
        19 only had LGE at an insertion point. The number of segments involved in
        the other 18 subjects ranged from 2\u201314 (median of 3). Examples of LGE
        in two of these subjects are shown in Figs <xref ref-type=\"fig\" rid=\"pone.0303969.g001\">1</xref>
        and <xref ref-type=\"fig\" rid=\"pone.0303969.g002\">2</xref>. The most common
        site for LGE was mid myocardium, but there were also segments with a subepicardial
        LGE location. There was only one subject in whom there was evidence of transmural
        LGE, this being a subject with a reduced LVEF and LGE in 14 segments. The
        walls most frequently involved in the 18 subjects were the anterolateral and
        inferolateral walls. Only two subjects had LGE in the septum. LGE was present
        in 20% of children and 21% of adults. In subjects with a LVEF \u226555%, there
        were 14/83 (17%) with LGE and in subjects with a LVEF&lt;55% there were 5/9
        (56%) with LGE. If more than 4 segments had LGE there was always a reduced
        LVEF. In logistic regression analysis of all subjects, a reduced LVEF was
        a predictor of LGE presence (p = 0.014), and there were no additional contributions
        to the prediction of LGE by sex, age group, GAA1, AOS, log SDur, age, LVEDVI
        or LVMI (p&gt;0.10 for all). Similarly, in subjects with a normal LVEF, none
        of sex, age group, GAA1, AOS, log SDur, age, LVEDVI or LVMI were predictors
        of the presence of LGE (p&gt;0.10 for all).</p>\n<fig id=\"pone.0303969.g001\"
        position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.g001</object-id>\n<label>Fig
        1</label>\n<caption>\n<title>A cardiac magnetic resonance image showing a
        short-axis section of the left ventricle, with the red arrows showing mid
        myocardial late gadolinium enhancement in the basal segment of the inferolateral
        wall.</title>\n</caption>\n<graphic mimetype=\"image\" position=\"float\"
        xlink:href=\"info:doi/10.1371/journal.pone.0303969.g001\" xlink:type=\"simple\"/>\n</fig>\n<fig
        id=\"pone.0303969.g002\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.g002</object-id>\n<label>Fig
        2</label>\n<caption>\n<title>A cardiac magnetic resonance image showing a
        short-axis section of the left ventricle, with the red arrows on the left
        showing mid myocardial late gadolinium enhancement in the septal wall and
        the red arrows to the right of and underneath the ventricle showing epicardial
        late gadolinium enhancement in the anterolateral and inferolateral walls.</title>\n</caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.g002\"
        xlink:type=\"simple\"/>\n</fig>\n<p>The 74 subjects without LGE were also
        investigated for an association of reduced LVEF with native T1 time and ECV.
        A reduced LVEF was not a predictor of native T1 time after adjustment for
        sex, heart rate and age group (p&gt;0.50). However, a reduced LVEF remained
        a predictor of an increased ECV after adjustment for study site, age, sex
        and age group p = 0.04). In adult subjects with a preserved LVEF (n = 48)
        and without LGE, after adjustment for sex, GAA1 was still an independent predictor
        of native T1 time (\u03B2 = 0.33, p = 0.014) and after adjustment for study
        site and log SDur, GAA1 was still an independent predictor of ECV (\u03B2
        = 0.35, p = 0.009).</p>\n</sec>\n</sec>\n<sec id=\"sec020\" sec-type=\"conclusions\">\n<title>Discussion</title>\n<p>Standard
        CMR measurements of LVM and LVEDV, in conjunction with T1 mapping techniques
        and LGE, were utilised in this study to quantify LV structure and ultrastructure
        in subjects with FRDA who were homozygous for GAA expansions in the <italic>FXN</italic>
        gene. The relationships of FRDA genetic severity (GAA1) with macroscopic LV
        structure (LVM and LVEDV) and LV ultrastructure (native T1 time, ECV and LGE)
        were also investigated. Positive correlations of GAA1 with native T1 relaxation
        time and ECV in FRDA subjects with a normal LVEF suggest an association between
        the degree of frataxin deficiency and the percentage of diffuse interstitial
        LV myocardial fibrous tissue. That these positive correlations were independent
        of changes in LVM and LVEDV suggests that T1 mapping techniques provide information
        about the LV myocardium which is at least partly independent of the recognised
        LV macroscopic structural changes of FRDA. The marker of myocardial replacement
        fibrosis, LGE, was found in only 21% of subjects with FRDA and there was substantial
        individual variation in the number of LV segments involved. LGE was more frequent
        in subjects with a reduced LVEF, but in subjects with a normal LVEF LGE was
        not associated with GAA1, LVEDVI or LVMI. The absence of predictors of LGE
        suggests that there is a different, and possibly idiosyncratic, mechanism
        underlying the development of replacement fibrosis compared to diffuse fibrosis
        in the early stages of cardiac disease in FRDA.</p>\n<p>In multivariate models
        of LVEDV and LVM, BSA was the most important predictor of both variables,
        and male sex was an independent predictor of a larger LVM in adults. The contribution
        of male sex independently of BSA to a higher LVM is consistent with what is
        found in healthy subjects and also with previous CMR and echocardiographic
        findings in subjects with FRDA and a normal LVEF [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref011\">11</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>].
        The findings of the current study again highlight the importance of taking
        both body size and sex into account when categorising LV mass in FRDA, something
        which has not been performed in some previous studies [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref004\">4</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref006\">6</xref>].
        The finding of an inverse relationship of LVM with age in the present cross-sectional
        study is consistent with a previous echocardiographic study [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref015\">15</xref>] and two CMR studies in FRDA [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref011\">11</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref024\">24</xref>]. This observation is at present unexplained
        and could represent a genuine reduction in LVM during disease progression
        [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref029\">29</xref>], survivor
        bias, or a combination of both processes. In the present study, in the absence
        of age in the model of LVM, log SDur was not a predictor of LVM, this finding
        not supporting the hypothesis of a decrease in LVM during disease progression
        in FRDA.</p>\n<p>In the present study LVM was increased above the normal sex,
        age-group and BSA adjusted ranges in 34% of children and 16% of adults. Meyer
        et al performed CMR in 41 adults with FRDA, 3 of whom had a LVEF &lt;50%,
        and reported an increase in LVMI in 29% of subjects [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref011\">11</xref>]. While this frequency seems substantially
        higher in comparison to the adults in the present study, the threshold for
        increased LVMI used by Meyer et al was lower, sex differences were not taken
        into consideration, and the LVM method used was different to the present study
        as it included papillary muscles in the LV volume rather than in the LVM.
        Rajagopalan et al also reported an increase in LVMI in FRDA compared to control
        subjects in a CMR study which included adults and children with a normal LVEF.
        However, the percentage of subjects with a LVMI above the normal range was
        not reported in this study, nor was there differentiation made between the
        LVMI in males and females [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref028\">28</xref>].
        An increase in LVMI based on echocardiography in subjects with a LVEF &gt;50%,
        this study including some subjects from the current study at an earlier time
        point, also found higher percentages of age group and sex-adjusted LVMI compared
        to the present study (47% of children and 24% of adults) [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref015\">15</xref>]. However, differences in the categorization
        of LVMI by CMR and echocardiographic studies is likely to reflect, at least
        in part, differences in both accuracy and reproducibility of the two techniques
        [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref039\">39</xref>].</p>\n<p>More
        common than an increase in LVM in the present study was the presence of an
        age-group, sex and BSA adjusted LVEDV less than the lower limit of the normal
        range, this being found in 39% of subjects (42% of adults and 30% of children).
        Thus, a low LVEDV was more common in adults than children, whereas a high
        LVM was more common in children than adults. Rajogapalan et al also reported
        a lower LVEDV using CMR in FRDA compared to control subjects, but did not
        adjust for age group, sex or BSA in their study [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref028\">28</xref>].
        Our finding is consistent with echocardiographic studies which have reported
        that the left ventricle is smaller in adults with FRDA and a normal LVEF when
        compared to age and sex-matched control subjects [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref013\">13</xref>, <xref ref-type=\"bibr\" rid=\"pone.0303969.ref014\">14</xref>].
        The current study therefore provides additional evidence that the increases
        in wall thickness and LVM in FRDA are associated with a negative LV cavity
        remodelling process, as has also been reported in the sarcomeric hypertrophic
        cardiomyopathies [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref040\">40</xref>].
        With the combination of an increased LVMI and reduced LVEDVI in our cohort,
        an increase in LVMVR was inevitable, and in subjects with a LVEF \u226555%,
        the LVMVR was higher than the normal range in 89% of subjects in this study.
        Not predictable given the different patterns of increased LVMI and decreased
        LVEDVI in adults and children, was that the LVMVR in FRDA was higher in children
        than adults.</p>\n<p>To the best of our knowledge this is the largest study
        of LGE in FRDA, it may be the only study to assess the incidence in LGE in
        a group including both adults and children, and it is also the only study
        to investigate the predictors of the presence of LGE in FRDA. LGE was only
        present in 21% of the subjects in the current study (age range 10\u201349
        years, SDur range up to 36 years), and in contrast to the LVEDVI and LVMI
        differences between adults and children, this percentage was similar in adults
        and children. LGE was more common in subjects with a reduced LVEF, but it
        was not present in all subjects with a reduced LVEF. LGE location was mostly
        in the mid myocardium but there was also subepicardial involvement, whereas
        transmural LGE involvement was rare. The percentage of subjects with LGE in
        previous studies in FRDA has been variable, and both higher and lower percentages
        than those of the current study have been reported. Raman et al reported LGE
        in 58% of 26 adult subjects with a normal LVEF (age range 18\u201357 years,
        SDur not reported) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref022\">22</xref>].
        Weidemann et al reported LGE in 66% of 32 subjects (age 33\xB113 years, number
        of children and SDur not reported), 25% of whom had a LVEF &lt;55% [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref006\">6</xref>]. All those with a
        reduced LVEF were positive for LGE, whereas 13/25 (52%) with a normal LVEF
        had LGE. That children with FRDA can develop LGE was also previously reported
        in 3 children with a normal LVEF by Mavrogeni et al [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref023\">23</xref>]. Takazaki et al reported only 15% LGE
        positivity in 27 subjects with a normal LVEF (age 28\xB110 years, number of
        children not reported, SDur = 13\xB18 years) [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref024\">24</xref>].
        We can provide no explanation for the substantial variation in LGE positivity
        in the different studies, particularly given the absence of important details
        about the age groups of the subjects and the SDur for some of the cohorts.
        On the other hand, our finding that the mid myocardium was the most common
        site for LGE is consistent with the findings of both Raman et al [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref022\">22</xref>] and Weidemann et al [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref006\">6</xref>].</p>\n<p>GAA1 is known to be inversely
        associated with frataxin levels [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref025\">25</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref026\">26</xref>] and with the
        AOS [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>], and to
        be positively associated with the severity of FRDA cardiac involvement [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref004\">4</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref041\">41</xref>]. In the present study, a larger GAA1
        was associated with a larger LVM in adults independently of both sex and body
        size. Positive correlations of GAA1 with LVMI have been reported in some [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref009\">9</xref>], but not other [<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref012\">12</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref015\">15</xref>], echocardiographic studies, and have
        not been reported in previous CMR studies [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref011\">11</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0303969.ref028\">28</xref>]. The discrepancies
        between studies regarding the relationship of GAA1 with LVM could be because
        the correlation of GAA1 with LVM is relatively weak, that the studies have
        been small, and/or that LVMI is less accurately calculated with echocardiography
        compared to CMR [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref042\">42</xref>].
        Although LVEDV was smaller than the normal range in 39% of subjects in the
        current study, GAA1 was not a predictor of a lower LVEDV. A weak negative
        correlation of GAA1 with LVEDV has been reported previously in one echocardiographic
        study [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref015\">15</xref>].</p>\n<p>We
        also examined the relationship of AOS with LV variables in this study, although
        issues related to collinearity needed to be considered given the expected
        and observed inverse correlation of GAA1 with AOS (r = -0.60). In adults,
        LVM was positively correlated with GAA1 and negatively correlated with AOS,
        but these associations were not independent. In contrast, in adults, LVEDV
        was positively correlated with AOS despite not being correlated with GAA1,
        suggesting that the small contribution of AOS to the prediction of LVEDV was
        independent of GAA1. The role of SDur was also investigated in this study,
        but a longer SDur was only found to be an independent predictor of a smaller
        LVEDV in children and a larger ECV in adults.</p>\n<p>After adjustment for
        study site, the ECV was higher in subjects with a reduced LVEF compared to
        those with a normal LVEF, and in the group of subjects with a normal LVEF,
        it was higher in children than adults. A recent study reported on ECV in FRDA
        subjects using a 3.0T machine [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref025\">25</xref>],
        finding it to be 0.36\xB10.05 in 27 subjects with FRDA and a normal LVEF who
        were of age 28\xB110 years, this being substantially higher than the value
        of 0.25\xB10.02 in the 10 control subjects in that study. In contrast, in
        the current study using a 1.5T machine the ECV in subjects with a normal LVEF
        was only 0.271\xB10.045 at the Philadelphia site and 0.242\xB10.030 at the
        Melbourne site. One possible explanation for the much higher average ECV in
        the Takazaki et al study compared to the present study is that it has been
        reported that the native T1 time is longer when assessed by a 3T compared
        to a 1.5T machine [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref038\">38</xref>].
        Moreover, the type of acquisition sequence has been shown to affect both native
        T1 time and ECV [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref037\">37</xref>].
        In addition, the comparison with control subjects in the study of Takazaki
        et al was confounded by the small size of the control group (n = 10), with
        the imaging performed at a separate site and on a different machine, and the
        adequacy of age and sex matching uncertain.</p>\n<p>The independent positive
        associations of GAA1 with both native T1 time and ECV in the present study
        provide evidence supporting a causal relationship between the severity of
        frataxin deficiency and an increased ratio of interstitial fibrous/cardiomyocyte
        volume in FRDA. However, there were no control subjects in the present study
        and there is only limited data in the literature about normal sex and age
        values for native T1 and post contrast T1 times and ECV based on the methodology
        used in the present study. Our study can therefore provide no definitive evidence
        that native T1 time and ECV are increased in FRDA, or how common abnormalities
        in native T1 time and ECV might be in FRDA. That sex and age based normal
        values are essential for this purpose is supported by studies in healthy subjects
        in which males have a lower native T1 time and ECV than females [<xref ref-type=\"bibr\"
        rid=\"pone.0303969.ref033\">33</xref>\u2013<xref ref-type=\"bibr\" rid=\"pone.0303969.ref038\">38</xref>]
        and where there is at least a trend, possibly modified by sex, to a lower
        native T1 time with older age [<xref ref-type=\"bibr\" rid=\"pone.0303969.ref033\">33</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pone.0303969.ref036\">36</xref>]. In the present study
        the native T1 time was lower in males, and the ECV was lower in adult males
        with a normal LVEF, suggesting that similar to healthy subjects, in FRDA there
        are not only sex effects on LVMI but also sex effects on the myocardium at
        the ultrastructural level.</p>\n<p>There is the potential for clinical and
        ongoing research roles for T1 mapping in FRDA given that both the native T1
        time and ECV can provide information about the LV myocardium prior to a reduction
        of LVEF, and that this information is at least partly independent of the FRDA-associated
        LV structural changes. However, the nature, timing and speed of the progression
        of changes in T1 mapping variables in FRDA are unknown, and reproducibility
        and robustness of T1 mapping techniques for serial testing are uncertain.
        In the present study there were differences in post contrast T1 time and ECV
        based on the study site even though the machines, protocols and analysis software
        were similar at the two sites, and the explanation for this difference remains
        uncertain. On the other hand, native T1 time did not appear to be influenced
        by the study site, and this simpler technique provides the additional advantages
        for the subject in that it does not require gadolinium injection and there
        is also less scanning time required.</p>\n<p>There are a number of limitations
        of this study. The number of children in the study was fewer than the number
        of adults and this resulted in lower statistical power to detect effects of
        FRDA on CMR variables in children. All studies in FRDA are at least partly
        confounded by recruitment being limited to subjects who have presented with
        symptoms and also by the absence of those subjects who have had disease progression
        and died as a result of the disease. For a CMR study in FRDA there is the
        additional limitation that some subjects were ineligible because of the presence
        of spinal rods inserted for the treatment of FRDA-associated scoliosis. An
        appropriate control group for T1 mapping would have enabled determination
        of the frequency of T1 mapping variable abnormalities in FRDA. However, this
        was not feasible as it would have required substantial numbers at both sites
        to adequately match the age range and sex mix of the FRDA subjects. Moreover,
        it would be difficult to justify the use of intravenous gadolinium injection
        in normal children, or indeed to even be able to recruit healthy children
        for such a study. A further limitation was that the methods for GAA estimation
        differed and there is therefore a possibility of systematic differences in
        GAA repeat lengths between the different assays. However, this possibility
        is more likely to lead to false negative than false positive findings. Moreover,
        adjustment for potential differences in techniques between the 2 institutions
        has been addressed in part in the regression analyses in which GAA repeat
        length was tested an independent variable by the inclusion of the institution
        as a dummy variable. Although there were differences in the prediction of
        ECV and post GAD T1 time based on institution there were no differences based
        on institution in the prediction of native T1 time. This suggests that the
        institutional differences could have been related to the post GAD data but
        does not support an independent contribution from differences in GAA estimation.
        Lastly, there is uncertainty regarding the mechanistic significance of some
        of the regression analysis findings due to collinearity between GAA1 and AOS
        and also between age and SDur. That there were independent effects of age
        from SDur and vice versa was suggested by the evidence that age, but not SDur,
        was an independent predictor for LVM in adult subjects with a normal LVEF
        and that SDur, but not age, was an independent predictor of ECV in adult subjects
        with a normal LVEF.</p>\n<p>In conclusion, there is an association between
        diffuse interstitial LV myocardial fibrosis and genetic severity in FRDA,
        with this effect being independent of the FRDA-associated LV changes in LVEDVI
        and LVMI. Localised replacement fibrosis was found in a minority of subjects
        with FRDA, this minority including both children and adults, and subjects
        with and without a reduction of LVEF. In contrast to T1 mapping variables,
        LGE in subjects with a normal LVEF was not associated with genetic severity,
        and was also not associated with LVM or LVEDV, consistent with the development
        of LGE in FRDA having an idiosyncratic element. There is the potential for
        roles of both T1 mapping and LGE in the assessment and monitoring of the cardiomyopathy
        of FRDA, but information will be required about their prognostic significance,
        and more data will also be required regarding the reproducibility of T1 mapping
        variables.</p>\n</sec>\n<sec id=\"sec021\" sec-type=\"supplementary-material\">\n<title>Supporting
        information</title>\n<supplementary-material id=\"pone.0303969.s001\" mimetype=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.s001\"
        xlink:type=\"simple\">\n<label>S1 File</label>\n<caption>\n<title>Anthropomorphic
        and cardiac magnetic resonance data in subjects with Friedreich ataxia.</title>\n<p>(XLSX)</p>\n</caption>\n</supplementary-material>\n</sec>\n</body>\n<back>\n<ack>\n<p>We
        would like to thank all subjects who generously volunteered their time to
        participate in this study. In addition, we would like to thank Ms Genevieve
        Tai from the Murdoch Children\u2019s Research Institute who provided laboratory
        and research support and Michael Kean and the staff of the Royal Children\u2019s
        Hospital MRI department for their expertise and support of this study.</p>\n</ack>\n<glossary>\n<title>Abbreviations</title>\n<def-list>\n<def-item><term>AOS</term>\n<def><p>age
