        id=\"t002fn001\"><p>LVEDVI\u2014left ventricular end-diastolic volume index;
        LVESVI\u2014left ventricular end-systolic volume index; LVMI\u2014left ventricular
        mass index; LVMVR\u2014left ventricular mass volume ratio; LVEF\u2014left
        ventricular ejection fraction</p></fn>\n<fn id=\"t002fn002\"><p>*p&lt;0.02
        and</p></fn>\n<fn id=\"t002fn003\"><p>**p&lt;0.01 for comparison of adult
        males and females</p></fn>\n</table-wrap-foot>\n</table-wrap>\n</sec>\n<sec
        id=\"sec012\">\n<title>Predictors of LVEDV in subjects with a normal LVEF</title>\n<p>In
        subjects with a LVEF \u226555% (n = 84), LVEDV was positively correlated with
        BSA (r = 0.76, p&lt;0.001) and was higher in males (p&lt;0.001), but male
        sex was only a borderline significant predictor of LVEDV after adjusting for
        BSA (p = 0.053). After adjustment for BSA and sex, LVEDV was not different
        between children and adults (p = 0.70). In adults (n = 57) after adjusting
        for BSA and sex, AOS was a borderline positive correlate of LVEDV (p = 0.056),
        but there were no contributions to the model of LVDEV from GAA1 (p = 0.39),
        log SDur (p = 0.66) or age (p = 0.80). In a multivariate model of LVEDV, BSA
        and AOS, but not sex, were independent predictors of LVEDV, with an earlier
        AOS associated with a smaller LVEDV (<xref ref-type=\"table\" rid=\"pone.0303969.t003\">Table
        3</xref>). In children (n = 27) BSA was a positive correlate of LVEDV (r =
        0.73, p&lt;0.001), and after adjusting for BSA there was no independent contribution
        from sex to the model (p = 0.80). After including BSA in multivariate models
        of LVEDV in children there were no contributions from AOS (p = 0.17), GAA1
        (p = 0.12) or age (p = 0.15), but there was a borderline significant contribution
        from log SDur (p = 0.05), with longer disease duration associated with a smaller
        LVEDV.</p>\n<table-wrap id=\"pone.0303969.t003\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0303969.t003</object-id>\n<label>Table
        3</label> <caption><title>Multivariate model of LVEDV in adult subjects with
        a normal LVEF.</title></caption>\n<alternatives>\n<graphic id=\"pone.0303969.t003g\"
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0303969.t003\"
        xlink:type=\"simple\"/>\n<table>\n<colgroup>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n<col
        align=\"left\" valign=\"middle\"/>\n<col align=\"left\" valign=\"middle\"/>\n</colgroup>\n<thead>\n<tr>\n<th
        align=\"left\">Independent variable</th>\n<th align=\"center\">r value in
        univariate analysis</th>\n<th align=\"center\"><italic>\u03B2</italic> in
        multivariate model</th>\n<th align=\"center\">p value in multivariate model</th>\n<th
        align=\"center\">Cumulative adjusted r<sup>2</sup></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td
        align=\"left\">BSA</td>\n<td align=\"char\" char=\".\">0.67</td>\n<td align=\"char\"
        char=\".\">0.58</td>\n<td align=\"center\">&lt;0.001</td>\n<td align=\"char\"
        char=\".\">0.44</td>\n</tr>\n<tr>\n<td align=\"left\">Male sex</td>\n<td align=\"char\"
        char=\".\">0.47</td>\n<td align=\"center\"/>\n<td align=\"center\">NS</td>\n<td
        align=\"char\" char=\".\">0.47</td>\n</tr>\n<tr>\n<td align=\"left\">AOS</td>\n<td
        align=\"char\" char=\".\">0.46</td>\n<td align=\"char\" char=\".\">0.25</td>\n<td
        align=\"center\">0.019</td>\n<td align=\"char\" char=\".\">0.49</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n<table-wrap-foot>\n<fn
        id=\"t003fn001\"><p>BSA\u2014body surface area; AOS\u2014age at the onset
        of symptoms</p></fn>\n</table-wrap-foot>\n</table-wrap>\n</sec>\n<sec id=\"sec013\">\n<title>Predictors
        of LVM in subjects with a normal LVEF</title>\n<p>In subjects with a LVEF
        \u226555% (n = 84), LVM was positively correlated with BSA (p&lt;0.001), larger
        in males (p&lt;0.001), and both BSA and sex were independent predictors of
        LVM (p&lt;0.001 for both). After adjustment for BSA and sex, LVM was not different
        between children and adults (p = 0.11). In adults (n = 57) after including
        BSA and sex in the model, there were additional contributions from GAA1 (\u03B2
        = 0.36), AOS (\u03B2 = -0.35) and age (\u03B2 = -0.39), but not from log SDur
        (p = 0.57). The model which included GAA1 (<xref ref-type=\"table\" rid=\"pone.0303969.t004\">Table
        4</xref>) explained a similar amount of the variance of LVM to the model which
        contained AOS (<xref ref-type=\"table\" rid=\"pone.0303969.t005\">Table 5</xref>).
        Neither GAA1 nor AOS remained significant predictors in the model of LVM when
        both independent variables were included together (p = 0.056 &amp; p = 0.062,
        respectively). Older age was an independent predictor of a lower LVM in a
        model which included BSA, sex and GAA1 (<xref ref-type=\"table\" rid=\"pone.0303969.t004\">Table
        4</xref>), whereas neither AOS nor age remained significant when age was added
        to the combination of BSA, sex and AOS (p = 0.067 &amp; p = 0.054, respectively).
        GAA1 accounted for 10% and age accounted for an additional 5% of the variance
        in LVM in adults. All the predictors of LVM in <xref ref-type=\"table\" rid=\"pone.0303969.t004\">Table
        4</xref> remained significant after excluding diabetic subjects from the analysis.
        In children (n = 27) LVM was positively correlated with BSA (r = 0.54), and
        male sex was a borderline significant predictor of a larger LVM (p = 0.066)
        after adjusting for BSA. There were no significant contributions to the model
        of LVM in children which included BSA and sex from any of GAA1 (p = 0.86),
        AOS (p = 0.97), log SDur (p = 0.79) or age (p = 0.20).</p>\n<table-wrap id=\"pone.0303969.t004\"
        position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0303969.t004</object-id>\n<label>Table
