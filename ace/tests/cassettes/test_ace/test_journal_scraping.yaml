        id=\"t001fn001\"><p>AOS\u2014age at onset of symptoms; SDur\u2014symptom duration;
        nFARS\u2014neurological Friedreich ataxia rating scale score; GAA1 \u2013number
        of GAA repeats in the smaller allele of the <italic>FXN</italic> gene; GAA2\u2014number
        of GAA repeats in the larger allele of the <italic>FXN</italic> gene</p></fn>\n</table-wrap-foot>\n</table-wrap>\n<sec
        id=\"sec011\">\n<title>Left ventricular mass and volumes</title>\n<p>Of the
        93 subjects there were 20 (22%) with LVH, this comprising 10/30 (33%) of the
        children and 10/63 (16%) of the adults. There were 36 subjects (39%) with
        a small LVEDV, and this comprised 30% of the children and 42% of the adults.
        There were only 3 subjects who met the criteria for a LVEDV above the normal
        range, all of whom were adults. There were 9 subjects with a LVEF &lt;55%
        (6 adults, 3 children), of whom 2 also had LV dilatation and 3 also had an
        increased LVM. The results of indexed LV volumes, LVMI, LVMVR and LVEF in
        subjects with a LVEF \u226555% (n = 84) are shown in <xref ref-type=\"table\"
        rid=\"pone.0303969.t002\">Table 2</xref>, with male and female subjects shown
        separately. In a comparison of adult subjects with a normal LVEF, LVMI, LVEDVI
        and LVESVI were all higher in males than females, whereas LVEF was higher
        in females. LVMVR was greater than the upper limit of the sex-specific normal
        range in 75/84 (89%) subjects, was higher in children than adults (1.47\xB10.33
        v 1.24\xB10.38 g/mL, p&lt;0.01), but was similar in adult males and females
        (p = 0.79).</p>\n<table-wrap id=\"pone.0303969.t002\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0303969.t002</object-id>\n<label>Table
