        align=\"center\">22\u201346</td>\n<td align=\"center\">3T, 2</td>\n<td align=\"center\">245</td>\n<td
        align=\"center\">NA</td>\n</tr>\n<tr>\n<td align=\"center\">Munich</td>\n<td
        align=\"center\">14 (9, 5)</td>\n<td align=\"center\">63\u201373</td>\n<td
        align=\"center\">1.5T, 3</td>\n<td align=\"center\">72</td>\n<td align=\"center\">Closed</td>\n</tr>\n<tr>\n<td
        align=\"center\">Leiden 1</td>\n<td align=\"center\">10 (10, 0)</td>\n<td
        align=\"center\">21\u201327</td>\n<td align=\"center\">3T, 2.18</td>\n<td
        align=\"center\">215</td>\n<td align=\"center\">Closed</td>\n</tr>\n<tr>\n<td
        align=\"center\">Leiden 2</td>\n<td align=\"center\">11 (5, 6)</td>\n<td align=\"center\">21\u201328</td>\n<td
        align=\"center\">3T, 2.2</td>\n<td align=\"center\">215</td>\n<td align=\"center\">Closed</td>\n</tr>\n<tr>\n<td
        align=\"center\">Recording center</td>\n<td align=\"center\">Subjects (male,
        female)</td>\n<td align=\"center\">Age (years)</td>\n<td align=\"center\">Scanner,
        TR (s)</td>\n<td align=\"center\">Time points</td>\n<td align=\"center\">Eyes</td>\n</tr>\n<tr>\n<td
        align=\"center\">Kyoto</td>\n<td align=\"center\">234 (141, 93)</td>\n<td
        align=\"center\">18\u201378</td>\n<td align=\"center\">3T, 2.5</td>\n<td align=\"center\">240</td>\n<td
        align=\"center\">Open</td>\n</tr>\n<tr>\n<td align=\"center\">ATR</td>\n<td
        align=\"center\">108 (88, 20)</td>\n<td align=\"center\">20\u201330</td>\n<td
        align=\"center\">3T, 2.5</td>\n<td align=\"center\">240</td>\n<td align=\"center\">Open</td>\n</tr>\n<tr>\n<td
        align=\"center\">Osaka</td>\n<td align=\"center\">29 (21, 8)</td>\n<td align=\"center\">29\u201373</td>\n<td
        align=\"center\">3T, 2.5</td>\n<td align=\"center\">240</td>\n<td align=\"center\">Open</td>\n</tr>\n<tr>\n<td
        align=\"center\">SWA</td>\n<td align=\"center\">101 (86, 15)</td>\n<td align=\"center\">19\u201355</td>\n<td
        align=\"center\">3T, 2.5</td>\n<td align=\"center\">244</td>\n<td align=\"center\">Open</td>\n</tr>\n<tr>\n<td
        align=\"center\">Hiroshima</td>\n<td align=\"center\">237 (87, 150)</td>\n<td
        align=\"center\">20\u201379</td>\n<td align=\"center\">3T, 2</td>\n<td align=\"center\">143</td>\n<td
        align=\"center\">Open</td>\n</tr>\n<tr>\n<td align=\"center\">Recording center</td>\n<td
        align=\"center\">Subjects (male, female)</td>\n<td align=\"center\">Age (years)</td>\n<td
        align=\"center\">Scanner, TR (s)</td>\n<td align=\"center\">Time points</td>\n<td
        align=\"center\">Eyes</td>\n</tr>\n<tr>\n<td align=\"center\">camCAN</td>\n<td
        align=\"center\">652 (322, 330)</td>\n<td align=\"center\">18\u201388</td>\n<td
        align=\"center\">3T, 1.97</td>\n<td align=\"center\">261</td>\n<td align=\"center\">Closed</td>\n</tr>\n</tbody>\n</table>\n</alternatives>\n</table-wrap>\n<p>The
        rsfMRI data from N = 709 subjects (286 female) spanning ages 18\u201379 years
        in the Japanese Strategic Research Program for the Promotion of Brain Science
        (SRPBS) project [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref017\">17</xref>]
        was also used. Healthy control (HC) data was taken from five sites in Japan:
        Osaka, Showa, Kyoto, and Hiroshima Universities as well as the Advanced Telecommunications
        Research Institute (ATR). Each recording consisted of signals collected at
        140 ROIs of a HC. The voxel sizes were generally not the same across the five
        sites, however, the values were similar by being between 3 mm x 3 mm x 3 mm
        and 4 mm x 4 mm x 4 mm (please see Table 5 of [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref017\">17</xref>]).
        A scanning time of 10 minutes was used, and the subjects had their eyes open
        and fixated on a point during the recording. The 9730 unique PCC values were
        provided as part of the dataset, thus no additional processing was required
        to attain the features. The acquisition and imaging parameters for SRPBS are
        shown in <xref ref-type=\"table\" rid=\"pone.0300720.t002\">Table 2</xref>
        and in more detail via Table 5 and 9 of [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref017\">17</xref>].</p>\n<p>Lastly,
        we used rsfMRI data that was collected at one recording center as part of
        the Cambridge Centre for Aging and Neuroscience (CamCAN) study [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref018\">18</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref019\">19</xref>].
        A single testing center provided N = 652 subjects (330 female) spanning ages
        18\u201388 years. The subjects had their eyes closed during the recordings
        and followed the instruction to not think of any one thing in particular.
        A voxel size of 3 mm x 3 mm x 4.44 mm was used with an acquisition time of
        8 minutes and 40 seconds. The acquisition and imaging parameters are further
        detailed in <xref ref-type=\"table\" rid=\"pone.0300720.t002\">Table 2</xref>
        of [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref019\">19</xref>]. To compute
        the FC from ROI recordings, the Craddock unsmooth parcellation was used to
        attain 840 ROIs. The mean intensity across voxels was used. Although the parcellation
        provided 840 ROIs, we considered 808 across each subject as 32 had missing
        values for some of the subjects. The PCC values were computed by correlating
        the time courses of the ROIs.</p>\n</sec>\n<sec id=\"sec004\">\n<title>Preprocessing
        and head motion correction</title>\n<p>With the 1000FCP dataset, the functional
        images were preprocessed in [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>]
        using the FSL software (FMRIB Software Library v. 5.0.1, Oxford, UK) and SPM
        software (Statistical Parametric Mapping software package, Wellcome Department
        of Imaging Neuroscience, London, UK) following conventional methods originally
        described in [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref016\">16</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref020\">20</xref>]. The following
        steps were preformed: 1) slice-timing correction; 2) rigid-body motion correction;
        3) registration to the MNI152 space; 4) regression of nuisance variables including
        ventricles, white matter (WM), and global average signal 5) temporal bandpass
        filtering (0.01\u20130.08 Hz). The preprocessing included rigid body correction
        for motion within and across runs, normalization to the standard echo-planar
        imaging (EPI) template of the Montreal Neurological Institute (MNI), and compensation
        for slice-dependent time shifts. Several key acquisition parameters are shown
        in <xref ref-type=\"table\" rid=\"pone.0300720.t002\">Table 2</xref> with
        additional information such as the number of slices, voxel size, and subject
        handedness available in <xref ref-type=\"table\" rid=\"pone.0300720.t001\">Table
        1</xref> of [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>].
        The preprocessed functional data (in atlas space) were temporally filtered
        to remove constant offsets and linear trends over each run while retaining
        frequencies below 0.08 Hz. Data were spatially smoothed using a 4 mm full-width
        half-maximum (FWHM) Gaussian blur. Sources of spurious or regionally non-specific
        variance were removed by regression of nuisance variables. This included six
        parameters obtained by rigid body head motion correction, the signal averaged
        over the whole brain (global signal), the signal averaged over the lateral
        ventricles, and the signal averaged over a region centered in the deep cerebral
        WM. Temporally shifted versions of these waveforms were removed by inclusion
        of the first temporal derivatives (computed by backward differences) in the
        linear model. The analysis used via [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref011\">11</xref>]
        to account for head motion is summarized as follows. The parameters were calculated
        for each participant as proposed by [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref022\">22</xref>].
        Framewise displacement (FD), which represents head displacement from volume
        to volume, was computed as the sum of the first derivative of the six rigid-body
        motion parameters estimated during standard volume realignment. Delta variation
        signal (DVARS), which represents the change in BOLD signal intensity from
        one frame to the next, was computed as the root mean square average of the
        first derivative of fMRI signals across the entire brain. A standardized version
        of DVARS was applied according to [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref021\">21</xref>].
        Volumes with FD value over 0.5\u2009mm or DVARS value over 1.5 IQRs above
        the 75th percentile were removed with one prior and two subsequent volumes.
        Sixteen individuals from several centers were excluded due to excessive head
        motion during rsfMRI acquisition according to the described movement parameters
        criteria [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref022\">22</xref>].</p>\n<p>The
        preprocessing of the SRPBS rsfMRI data are detailed in [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref017\">17</xref>]. This was primarily done using SPM8
        implemented in MATLAB (R2016b; Mathworks, Natick, MA). The first 10 seconds
        of data were discarded to allow for T1 equilibration. Preprocessing steps
        included slice-timing correction, realignment, co-registration, segmentation
        of T1-weighted structural images, normalization to MNI space, and spatial
        smoothing with an isotropic Gaussian kernel of 6 mm FWHM. The ROIs were delineated
        according to 140 regions defined by the Brainvisa Sulci Atlas and three subregions
        of the cerebellum (the left and right cerebellum, and the vermis). The BOLD
        signal time courses were extracted from the ROIs, and a bandpass filter (0.008\u20130.1
        Hz) was applied to the time courses before a regression procedure. Filtered
        time courses were linearly regressed on temporal fluctuations of the WM, the
        cerebrospinal fluid (CSF), and the entire brain, as well as six head motion
        parameters. Fluctuation in each tissue class was determined from the average
        time course of the voxels within a mask created by segmentation of the T1
        image. Extracted time courses were then bandpass filtered (0.008\u20130.1
        Hz) before linear regression, as was done for regional time courses. Then,
        for each individual, a matrix of 9,730 connections between the 140 ROIs was
        calculated by evaluating PCCs of BOLD signal time courses. The flagged frames
        in the previous procedure were discarded. After calculating the FD, volumes
        with FD &gt; 0.5 mm were removed. Further details and information about the
        procedure to calculate the matrix are outlined in [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref017\">17</xref>, <xref ref-type=\"bibr\" rid=\"pone.0300720.ref021\">21</xref>].</p>\n<p>The
        camCAN preprocessing of the rsfMRI data was performed and is detailed in [<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref019\">19</xref>]. The procedure is
        summarized as follows. Co-registered T1 and T2 images were used in a multi-channel
        segmentation (SPM12 Segment, based on \u201CNew Segment\u201D in SPM8 [<xref
        ref-type=\"bibr\" rid=\"pone.0300720.ref023\">23</xref>]) routine in order
        to extract probabilistic maps of six tissue classes: gray matter (GM), WM,
        CSF, bone, soft tissue, and residual noise. Images from each subject were
        coregistered to the subject\u2019s T1-weighted image using a rigid-body (6-df)
        linear transformation. Normalization parameters from the diffeomorphic anatomical
        registration through exponentiated lie algebra (DARTEL) procedure [<xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref024\">24</xref>] were applied. The native-space GM and
        WM images for all participants who passed quality-control checks were submitted
        to diffeomorphic registration to create group template images. The group template
        was then normalized to the MNI template via an affine transformation. Then
        combined normalization parameters were applied to each individual participant\u2019s
        GM and WM images. Individual normalized GM and WM images were smoothed (8
        mm FWHM Gaussian kernel). Data from each recording was unwarped to compensate
        for magnetic field inhomogeneities, then realigned to correct for motion,
        and slice-time corrected. The EPI data were co-registered to the T1 image,
        and the normalization parameters were applied to warp functional images into
        MNI space. The mean regional time-courses were then extracted using the template
        method.</p>\n</sec>\n<sec id=\"sec005\">\n<title>Computed features and description
        of ML pipeline</title>\n<p>To measure FC, PCC values were evaluated between
        the time courses for all pairs of ROIs of a participant. Each recording consisted
        of signals collected for 42, 140, and 808 ROIs for subjects in the 1000FCP,
        SRPBS, and camCAN datasets, respectively. A simple calculation shows that
        we have 861, 9730, and 326,028 unique PCC values to be used as features. The
        features from each participant were used either as training or test data in
        the ML analysis. We form two sets A and B, consisting of a younger age group
        and an older age group for the scenarios considered in <xref ref-type=\"fig\"
        rid=\"pone.0300720.g001\">Fig 1</xref>. Let N<sub>1</sub> denote the number
        of subjects in the young group and N<sub>2</sub> the number in the aged group.
        The following steps are taken.</p>\n<p><underline>Step 1)</underline> Let
        m = min{<italic>N</italic><sub>1</sub>, <italic>N</italic><sub>2</sub>}.</p>\n<p><underline>Step
        2)</underline> Train a machine on the m data points from the smaller set,
        and m randomly selected points from the larger set. This is done to ensure
        balance of data for an age range. The feature vectors will consist of the
        PCC values for a subject. The labels correspond to whether the subject is
        from the aged or young group.</p>\n<p><underline>Step 3)</underline> Use the
        <italic>k</italic> = max{<italic>N</italic><sub>1</sub>, <italic>N</italic><sub>2</sub>}\u2212m
        left-out recordings from the larger set as validation data. The trained machine
        is to predict whether the k residual recordings are young or aged and an accuracy
        rate (AR) will be attained.</p>\n<p><underline>Step 4)</underline> Test on
        the subjects not included in sets A and B, but rather in interval i: i = 1,
        2, or 3 for the <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1</xref>
        scenario that is being considered.</p>\n<fig id=\"pone.0300720.g001\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g001</object-id>\n<label>Fig
        1</label>\n<caption>\n<title>Three scenarios for assessing whether brain aging
        is a progressive phenomenon.</title>\n<p>In each case a machine is trained
        on a young and aged cohort and asked to classify CPs of subjects with ages
        that it has not previously encountered. For each scenario an illustration
        contains possible hypotheses (H) for the trajectory of the predicted brain
        ages in the respective interval. A) In interval 1 it is expected that the
        percentage of brains classified as aged follow a monotonically increasing
        trajectory among the chronological age range with the y-intercept being less
        than 50%. B) The study of interval 2 investigates whether the CP of young
        brains provide information about the CP of aged brains. C) Interval 3 is intended
        to investigate whether CP differences among aged brains can be used to infer
        aging dynamics of younger brains.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g001\"
        xlink:type=\"simple\"/>\n</fig>\n<p>The above steps are depicted in the pipeline
        of <xref ref-type=\"fig\" rid=\"pone.0300720.g002\">Fig 2</xref> where the
        schematic is iterated once with the performance on the k residue data points
        from the larger set viewed as validation accuracy. The trained machine is
        then presented with the left-out data from the new category. The ML technique
        used was a support vector machine (SVM) with a linear kernel and a binary
        classifier. The techniques were implemented in R via the packages e1071 and
        kernlab.</p>\n<fig id=\"pone.0300720.g002\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g002</object-id>\n<label>Fig
        2</label>\n<caption>\n<title>An ML pipeline to evaluate whether brains age
        in a monotonic fashion.</title>\n<p>The sets A and B refer to the young and
        aged groups of the different scenarios that are considered when testing on
        subjects of interval 1, 2, and 3. An SVM is trained on 2m data points, asked
        to classify k residue data points from either the aged or young group, and
        classify the age phenotype of the subjects in interval 1, 2, or 3.</p>\n</caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g002\"
        xlink:type=\"simple\"/>\n</fig>\n</sec>\n<sec id=\"sec006\">\n<title>Methodology
        to assess monotonicity of brain differences with age</title>\n<p>It is natural
        to assume that a brain will possess characteristics that are more similar
        to brains close to its age than those of increasingly disparate age groups.
        A test of this notion is to present a trained machine with recordings across
        a spectrum of ages that it has not previously seen. The three scenarios in
        <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1</xref> are considered
        with the ML pipeline in <xref ref-type=\"fig\" rid=\"pone.0300720.g002\">Fig
        2</xref>. This will encompass training a machine on connectivity patterns
        (CPs) from an equal number of subjects from a young and an aged cohort in
        each scenario. The trained machines\u2019 decisions will scrutinize whether
        brains\u2013whose age the machine has not previously encountered\u2013have
        a CP that is more similar to an older or a younger cohort. The cartoons accompanying
        each of the scenarios in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1</xref> denote possible trajectories that we hypothesize for the left-out
        recordings that will be classified by the respective machine. Interval 1 is
        the most conspicuous since it is expected that as chronological age increases,
        brains exhibit properties that become increasingly similar to an extrema group
        of aged brains in a monotonic fashion. It is also expected that the youngest
        brains in the interval exhibit CPs that are close to the extrema of young
        subjects (i.e., an intercept &lt; 50%). The described relation is referred
        to as hypothesis 1 (H1) in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1A</xref>.</p>\n<p>The prospective hypotheses are less conspicuous for interval
        2. It is conceivable that older subjects exhibit CPs that follow an increasing
        trajectory away from younger brains that have been bifurcated into a younger
        (i.e., aged) and youngest (i.e., young) groups. This possibility is reflected
        by the two increasing lines labeled H1 and H2 in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1B</xref>. The difference in the intercept of the two lines reflects the notion
        that the youngest brains in interval 2 can be classified as being closer in
        CP to brains in the aged group that are the most proximal to them in years
        (H1), or alternatively as relatively young (H2) if the CPs in the unseen data
        are classified on a relative rather than absolute basis. Lastly, it is conceivable
        that the recordings exhibit CPs that do not deviate very much from the aged
        (yet relatively younger) brains in which case a horizontal line with an intercept
        greater than 50% would be noted (H3). The investigation of interval 2 probes
        at whether CPs of young brains provide information on the dynamics noted in
        older subjects.</p>\n<p>Interval 3 in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1C</xref> represents a somewhat inverted version of the study for interval
        2. It investigates whether older brains provide insight into the connectivity
        changes that occur among younger brains. A hypothesis shown by the strictly
        increasing line (H1) entails young brains exhibiting properties reminiscent
        of the youngest brains in an otherwise aged cohort, and the CP of the young
        brains gradually resembling that of the most aged brains as chronological
        age is increased. It is also conceivable that the gradual resemblance to the
        most aged brains does not occur, but rather the trained machine associates
        the brains in interval 3 as resembling the young cohort as the chronological
        age of the subjects approaches that of the subjects in the more proximal young
        cohort. This scenario is depicted via the inverted U-shaped trajectory (H2).
        Lastly, it may be that the CPs of subjects remain similar to the younger group
        as shown by the trajectory of a horizontal line with an intercept below 50%
        (H3). The investigation of interval 3 probes at whether aged brains provide
        information on the dynamics of connectivity earlier in life.</p>\n</sec>\n<sec
        id=\"sec007\">\n<title>Quantification of FC changes with age and sex</title>\n<p>The
        pairwise PCC values were used as the features for the ML analysis and to assess
        the connectivity among brain regions. For each subject the number of connections
        that exceeded the threshold |\u03C1 = 0.6| were totaled and referred to as
        the FC for the subject. The value of 0.6 has been motivated in works such
        as [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref019\">19</xref>, <xref ref-type=\"bibr\"
        rid=\"pone.0300720.ref025\">25</xref>]. For completeness, thresholds of |\u03C1
        = 0.45| and |\u03C1 = 0.7| are also considered in the analysis to assess the
        robustness of the findings. The evaluation with different FC thresholds is
        to account for the possibility of low SNR in the recordings. Typically, signals
        in a stable or high SNR regime would provide similar trends when a correlation
        threshold is uniformly adjusted. Importantly, we consider the positive and
        negative (i.e. anticorrelation) CC values separately when assessing the change
        in connectivity with aging for the three datasets. In testing for the statistical
        significance of an effect, the youngest age group is taken as a reference
        and a two-sample t-test is conducted among the positive, negative, and total
        connections in the subjects. A p-value of 0.05 is used as the threshold for
        statistical significance when evaluating the change in FC between the youngest
        age group and the older subjects. The change is assessed separately among
        male and female subjects with the objective of determining whether age-modulated
        FC is sex specific. As done with the entire population, the youngest age group
        is considered the reference for assessing FC changes, and a two-sample t-test
        is used to test for statistical significance (i.e. p &lt; 0.05). The standard
        deviations (s.d.) of the number of functional connections are also computed
        to study the inter-subject variability in connectivity during aging.</p>\n</sec>\n<sec
        id=\"sec008\">\n<title>Consideration of recording center and subject arousal
        effects</title>\n<p>The 1000FCP dataset consists of recordings from 17 centers,
        and thus warrants scrutiny of potential site effects. The NKI-Rockland (NKI-RS)
        center contains approximately 34% of the subjects in the 1000FCP. This number
        is significant when considering the next largest participant pool (i.e. Beijing)
        contributes approximately 13%. NKI-RS also contains the largest spread of
        subjects\u2019 chronological ages (<xref ref-type=\"table\" rid=\"pone.0300720.t001\">Table
        1</xref>). The monotonicity and change in FC analysis shall be repeated with
        only subjects from the NKI-RS center. A comparison of the findings for 1000FCP
        and its constituent NKI-RS will show whether the same trends are noted for
        both cases or if site effects may be affecting the findings. Furthermore,
        unlike SRPBS and camCAN, the 1000FCP contains a mixture of recordings where
        subjects had their eyes open and closed (<xref ref-type=\"table\" rid=\"pone.0300720.t002\">Table
        2</xref>). A difference in arousal level can affect FC strength and bias connectivity
        patterns. The monotonicity and change in FC analyses are conducted separately
        on 1000FCP recordings where subjects had their eyes open (N = 543). The reason
        for not additionally conducting an analysis on subjects with eyes closed is
        because of their relatively low number (N = 197), and lack of representation
        across the spectrum of ages in the 1000FCP dataset (<xref ref-type=\"table\"
        rid=\"pone.0300720.t002\">Table 2</xref>).</p>\n</sec>\n</sec>\n<sec id=\"sec009\"
        sec-type=\"results\">\n<title>Results</title>\n<sec id=\"sec010\">\n<title>Monotonic
        changes in functional connectivity occur over an intermediate age interval</title>\n<p>In
        considering the 1000FCP data, the scenario in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1A</xref> encompassed a machine trained on features from 78 brains, 39 that
        comprise the 71+ age group and 39 of which have been randomly selected from
        the 21\u201330 group. The remaining 809 brains shall be considered as test
        data. Naturally, it is expected that the 419 remaining recordings from the
        21\u201330 age group be classified as young. In evaluating the accuracy on
        the test data, excellent performance is seen for the left-out young brains
        in the 21\u201330 age group via an AR of 0.84 across 419 subjects. The accuracy
        vindicated the machine\u2019s integrity to continue the monotonicity study
        and evaluate decisions on recordings in interval 1. The decisions made by
        the machine on the 390 brains of ages 31\u201370 years are shown in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g003\">Fig 3</xref>. We have considered
        the number of brains at each age that were classified as old to arrive at
        percentages for the ages encompassed in interval 1. The bar plot illustrates
        the number of brains at an age that have been classified as young or aged.
        The accompanying line plot represents the percentage of subjects that were
        classified as aged after the application of a 5-year sliding window for smoothing.
        Although the increase is not monotonic, an increasing trend is noted in the
        percentage. The absence of complete monotonicity is due to cross-subject variability
        as variance inherently exists among all facets of recordings from different
        people. Furthermore, there is the limitation that the number of samples at
        each age in <xref ref-type=\"fig\" rid=\"pone.0300720.g003\">Fig 3</xref>
        was not very large (min sample size = 3, max sample size = 19). Such confounding
        factors are natural and expected to provide uncertainty to the findings. This
        is noted by the moderate Spearman correlation value of 0.7 between the subjects\u2019
        ages and the percentage of subjects classified as aged. To test for a trend,
        a linear regression with intercept \u03B2<sub>0</sub> and slope \u03B2<sub>1</sub>
        was fit to the results. As previously mentioned, a positive trend and a low
        intercept are expected for the brains in interval 1. The intercept \u03B2<sub>0</sub>
        = 31.58 is rather low indicating that the classification of the youngest brains
        in interval 1 are indeed skewed towards the young group. A slope of \u03B2<sub>1</sub>
        = 0.952 demonstrates a positive association between the increase in age and
        CPs resembling the older phenotype. The results justify H1 as holding for
        interval 1 of <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1A</xref>.</p>\n<fig
        id=\"pone.0300720.g003\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0300720.g003</object-id>\n<label>Fig
        3</label>\n<caption>\n<title>The results of the brain age monotonicity analysis
        for interval 1.</title>\n<p>The histograms show the number of subjects classified
        as young and aged at every considered age. A 5-year sliding window was applied
        and a linear regression was fit to the results with intercept \u03B2<sub>0</sub>
        and slope \u03B2<sub>1</sub>. A machine was trained on the youngest and oldest
        groups and presented with test data of intermediate-aged subjects. For 1000FCP
        we have \u03B2<sub>0</sub> = 31.58, \u03B2<sub>1</sub> = 0.952. The Spearman
        correlation of 0.7 computed among the percentages of subjects classified as
        aged and the ages indicates a moderate degree of monotonicity between the
        two quantities. With SRPBS, \u03B2<sub>0</sub> = 7.285, \u03B2<sub>1</sub>
        = 2.696, and a Spearman correlation of 0.948 demonstrates a high degree of
        monotonicity between the two quantities. A consideration of camCAN leads to
        \u03B2<sub>0</sub> = 0 and \u03B2<sub>1</sub> = 2.234. The Spearman correlation
        of 0.986 signifies monotonicity between the two quantities. For NKI-RS subjects
        we note \u03B2<sub>0</sub> = 39.74, \u03B2<sub>1</sub> = 0.877, and the Spearman
        correlation of 0.608 reflects monotonicity.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g003\"
        xlink:type=\"simple\"/>\n</fig>\n<p>For the SRPBS subjects, a machine is trained
        on 72 subjects randomly selected from the 18\u201330 age group and the 72
        in the 61+ group. The test set consists of 565 subjects, 255 of which are
        residual from the 18\u201330 year old (y.o.) range. The machine classified
        247 of the residual recordings as young leading to AR = 0.968 and vindicating
        the machine efficacy. The histograms in <xref ref-type=\"fig\" rid=\"pone.0300720.g003\">Fig
        3</xref> illustrate the number of subjects assigned as young and aged at every
        considered age. To test for a trend, a linear regression was applied to the
        results in interval 1. The low intercept (\u03B2<sub>0</sub> = 7.285) and
        the positive slope (\u03B2<sub>1</sub> = 2.696) were expected while a Spearman
        correlation of 0.948 indicates a high degree of monotonicity in the brains
        classified as having an aged profile with increasing biological age. The hypothesis
        H1 in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1A</xref> is validated.
        Similarly, for the camCAN dataset a machine was trained on 45 randomly selected
        subjects from the 18\u201330 age group and the 45 subjects 81+ y.o. Of the
        34 remaining subjects in the younger group 33 were classified as young leading
        to AR = 0.9705. A linear fit to the percentage of subjects classified as aged
        in <xref ref-type=\"fig\" rid=\"pone.0300720.g003\">Fig 3</xref> yields the
        intercept \u03B2<sub>0</sub> = 0 and slope \u03B2<sub>1</sub> = 2.234. The
        Spearman correlation of 0.986 computed among the percentages of subjects classified
        as aged and their chronological ages indicates monotonicity between the two
        quantities. The analysis supports H1 as the brain aging dynamics of intermediate
        aged subjects when extrema groups are used as the references. The NKI-RS analysis
        entailed a machine trained on features from 32 recordings of subjects in the
        71+ age group and 32 randomly selected from the 21\u201330 age group. The
        remaining 33 recordings from the young group (21\u201330 y.o.) were classified
        by the trained machine at an AR of 0.696. The decisions on the residual 210
        brains spanning 31\u201370 years are shown in <xref ref-type=\"fig\" rid=\"pone.0300720.g003\">Fig
        3</xref>. An increasing trend (\u03B2<sub>1</sub> = 0.877), relatively low
        intercept (\u03B2<sub>0</sub> = 39.74), and a formidable Spearman correlation
        value of 0.608 are noted. The results also support hypothesis H1 as an explanation
        for brain aging dynamics in interval 1.</p>\n</sec>\n<sec id=\"sec011\">\n<title>Young
        brain functional connectivity is not indicative of alterations in older subjects</title>\n<p>Considering
        the 1000FCP subjects, the ML pipeline is applied with the partition in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1B</xref> to probe whether
        there is a monotonic relationship. A machine is trained on 170 brains, 85
        of which have been randomly selected from the 21\u201330 age group, and 85
        that comprise the 31\u201340 age group. The remaining 717 subjects in the
        dataset are used to investigate whether brains are perceived as young or aged
        by the machine. The 373 remaining brains from the 21\u201330 age group are
        expected to be classified as young, however, the decisions are not obvious
        for the 344 brains that constitute interval 2. The AR noted is 0.646 for the
        held-out brains in the young group. It is expected that the AR levels for
        <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1B</xref> be lower than
        those reported for <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1A</xref>\u2013this
        is attributed to the difficulty in distinguishing among brains that are closer
        in age. We consider the decisions made by the trained machine on the 344 elder
        brains (41\u201371+ y.o.) of interval 2. In <xref ref-type=\"fig\" rid=\"pone.0300720.g004\">Fig
        4</xref> the percentage of brains classified as aged does not show a monotonically
        increasing relationship (Spearman correlation = -0.243). The point 77+ on
        the abscissa is considered as the final age because of the relatively few
        samples available above this age\u2013the point is comprised of 14 subjects
        ranging from 77 to 85 y.o. When fit with a linear regression, the intercept
        \u03B2<sub>0</sub> = 71.4 is rather high indicating that the youngest brains
        in interval 2 appear more similar to the proximal brains in the aged group
        rather than the relatively young group that was used during training. The
        slope of \u03B2<sub>1</sub> = -0.147 does not support an increasing trend
        for the 41+ y.o. subjects of interval 2. The Spearman correlation of -0.243
        between chronological age and the percentage of brains classified as aged
        indicates that the change in CP dynamics of the younger brains is not conserved
        among the progressively older brains. We conclude that hypothesis H3 in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1B</xref> is the most representative
        trajectory for interval 2.</p>\n<fig id=\"pone.0300720.g004\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g004</object-id>\n<label>Fig
        4</label>\n<caption>\n<title>The results of the brain age monotonicity analysis
        for interval 2.</title>\n<p>The histograms show the number of subjects classified
        as young and aged at every considered age. A 5-year sliding window was applied
        and a linear regression was fit to the results with intercept \u03B2<sub>0</sub>
        and slope \u03B2<sub>1</sub>. A machine was trained on the two youngest groups
        of subjects and then asked to classify older recordings. For 1000FCP we attain
        \u03B2<sub>0</sub> = 71.4 and \u03B2<sub>1</sub> = -0.147 indicating little
        change in the classification of increasingly older brains as aged. Furthermore,
        a Spearman correlation of -0.243 reflects a non-monotonic relationship. With
        the SRPBS subjects \u03B2<sub>0</sub> = 82.159 and \u03B2<sub>1</sub> = 0.1
        suggest little change in the classification of increasingly older brains as
        aged. The Spearman correlation of 0.149 reflects a non-monotonic relationship
        among the ages and the percentage classified as aged. For camCAN we attain
        \u03B2<sub>0</sub> = 77.48, \u03B2<sub>1</sub> = 0.329 demonstrating little
        change in the classification of increasingly older brains as aged. The Spearman
        correlation of 0.74 reflects a moderately monotonic relationship among the
        subjects\u2019 ages and the percentage classified as aged. The consideration
        of NKI-RS subjects of interval 2 leads to \u03B2<sub>0</sub> = 65.48, \u03B2<sub>1</sub>
        = 0.453, and a Spearman correlation of 0.417. This indicates an increasing
        relationship but little monotonicity.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g004\"
        xlink:type=\"simple\"/>\n</fig>\n<p>Applying the analysis to the SRPBS dataset
        involved a machine trained on 126 subjects randomly selected from the 18\u201330
        age group and 126 comprising the 31\u201340 group. The test set consisted
        of the remaining 457 subjects. Of the 201 residual subjects from the 18\u201330
        y.o. group, 146 were classified as young leading to AR = 0.726. In interval
        2 we attain intercept and slope values of \u03B2<sub>0</sub> = 82.159, \u03B2<sub>1</sub>
        = 0.1 indicating little change in the appearance of increasingly older brains
        from the more proximal aged group. A Spearman correlation of 0.149 in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g004\">Fig 4</xref> denotes negligible
        monotonicity in the percentage of subjects classified as aged with an increasing
        number of years. The findings support hypothesis H3 that studying the aging
        trajectory in younger brains (i.e. 18\u201340 y.o.) provides little information
        about their aging trajectories in later years. Analysis with the camCAN subjects
        considered the training data comprised of 79 subjects from the 18\u201330
        as well as the 31\u201340 age groups, and testing done on the 493 residual
        subjects. The 26 subjects from the older group were classified as aged at
        an AR of 0.653 by the trained machine. After computing the percentages of
        468 subjects deemed as old at each age in the 41+ range, the linear fit provided
        \u03B2<sub>0</sub> = 77.48 and \u03B2<sub>1</sub> = 0.329. This indicates
        little increase in the classification of the older subjects with the increase
        in their chronological ages. The Spearman correlation of 0.74 between the
        percentage of brains classified as aged and the chronological age reflects
        a moderately monotonic relationship. The findings signify H1 as the most expressive
        of the hypotheses for the trajectory in interval 2. NKI-RS subjects in the
        age group 21\u201330 and 31\u201340 were used to train an SVM for the interval
        2 analysis. Following the selection of 27 random recordings from the younger
        group, the 38 left out recordings were classified at a below-chance level
        of AR = 0.473. By computing the percentages of the 215 subjects that were
        41+ y.o. and classified as aged, a linear fit provided \u03B2<sub>0</sub>
        = 65.48 and \u03B2<sub>1</sub> = 0.453 (<xref ref-type=\"fig\" rid=\"pone.0300720.g004\">Fig
        4</xref>). While the slope indicates an increasing trend, a Spearman correlation
        of 0.417 between the percentage of brains classified as aged and the subjects\u2019
        ages in interval 2 reflects the absence of a monotonic relationship. The analysis
        signifies H3 as the most representative hypothesis for the NKI-RS trajectory
        in interval 2.</p>\n</sec>\n<sec id=\"sec012\">\n<title>Connectivity patterns
        of older subjects reflects aging dynamics in young brains</title>\n<p>Through
        the scenario depicted in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1C</xref> we explore if older brains exhibit CPs that can be used to differentiate
        among younger brains, and whether the differentiation occurs in a monotonic
        fashion with age. We hypothesize the trained machine to provide a low intercept
        when investigating a trend in the percentage of brains classified as aged.
        However, it is not obvious if a monotonic increase or a positive association
        will be seen. For the 1000FCP dataset an SVM is trained on 78 brains; 39 randomly
        selected from the 61\u201370 age group and 39 from the 71+ age group. The
        residual subjects from the 61\u201370 age group are expected to be classified
        as young, and an AR of 0.714 was noted on the 28 held-out brains from this
        group. The decisions made by the trained machine on the 781 younger brains
        (ages 21\u201360 years) are shown in <xref ref-type=\"fig\" rid=\"pone.0300720.g005\">Fig
        5</xref>. The intercept of \u03B2<sub>0</sub> = 24.2 is somewhat high since
        the ideal intercept would be near zero. This demonstrates that the relatively
        young brains that were used to train the machine are not very representative
        of the FC changes in the youngest subjects of the study. The slope in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g005\">Fig 5</xref> is \u03B2<sub>1</sub>
        = 0.58 indicating a marginal but increasing trend in the percentage of brains
        classified as aged across interval 3. A Spearman correlation of 0.795 is noted
        among the subjects\u2019 ages and the percentage of brains classified as aged.
        We conclude that H1 is the best hypothesis for interval 3. This indicates
        that the difference in CP among aged brains is reflective of FC dynamics earlier
        in life.</p>\n<fig id=\"pone.0300720.g005\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g005</object-id>\n<label>Fig
        5</label>\n<caption>\n<title>The results of the brain age monotonicity analysis
        for interval 3.</title>\n<p>The histograms show the number of subjects classified
        as young and aged at every considered age. A 5-year sliding window was applied
        and a linear regression was fit to the results with intercept \u03B2<sub>0</sub>
        and slope \u03B2<sub>1</sub>. A machine was trained on the two oldest age
        groups and received younger subject recordings as test data. With the 1000FCP
        dataset, the values \u03B2<sub>0</sub> = 24.2, \u03B2<sub>1</sub> = 0.58,
        and the Spearman correlation of 0.795 indicate a gradual increase and moderate
        monotonicity. For SRPBS, \u03B2<sub>0</sub> = 3.11, \u03B2<sub>1</sub> = 0.788,
        and the Spearman correlation of 0.853 demonstrates monotonicity in the number
        of subjects classified as aged with increasing age. With camCAN, the values
        \u03B2<sub>0</sub> = 32.52, \u03B2<sub>1</sub> = -0.205, and the Spearman
        correlation of -0.448 indicate a gradual decrease and small degree of monotonicity.
        The NKI-RS subjects of interval 3 provide \u03B2<sub>0</sub> = 45.12 and \u03B2<sub>1</sub>
        = -0.176 to reflect a gradually decreasing relationship. The Spearman correlation
        of -0.161 indicates an absence of monotonicity.</p>\n</caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g005\"
        xlink:type=\"simple\"/>\n</fig>\n<p>Applying the ML pipeline to the SRPBS
        dataset, a machine is trained on 69 subjects in the 51\u201360 age group and
        69 subjects randomly selected from the 61+ group. The testing was performed
        on the remaining 571 subjects. Of the 3 remaining subjects from the 61+ y.o.
        group, 2 were correctly classified as aged (AR = 0.667). By applying the ML
        pipeline of <xref ref-type=\"fig\" rid=\"pone.0300720.g002\">Fig 2</xref>
        to this scenario, we attain the results in <xref ref-type=\"fig\" rid=\"pone.0300720.g005\">Fig
        5</xref> for interval 3. A linear fit provides a low intercept (\u03B2<sub>0</sub>
        = 3.11) and a positive slope of \u03B2<sub>1</sub> = 0.788. The Spearman correlation
        of 0.853 signifies that differences among aged brains (i.e. 61+ y.o.) provide
        a high degree of information about the aging trajectory of younger brains.
        The quantified results indicate that hypothesis H1 is the most explanatory
        of the three hypotheses for interval 3. The study with the camCAN subjects
        involved training on 45 young (71\u201380 y.o.) and 45 aged (81+ y.o.) subjects
        and subsequently testing on the 561 residual recordings. The 72 residue subjects
        in the 71\u201380 group were classified accurately as young via AR = 0.666.
        For the remaining 489 recordings that comprise interval 3, the linear fit
        provides \u03B2<sub>0</sub> = 32.52 and \u03B2<sub>1</sub> = -0.205. The Spearman
        correlation of -0.448 reflects a small degree of monotonicity in the number
        of subjects classified as aged when the reference was taken to be the aging
        dynamics of older brains. The scenario H3 is the endorsed hypothesis as the
        properties of the two chronologically oldest groups do not markedly differentiate
        between the ages of the recordings from the younger subjects. The ML analysis
        for the NKI-RS subjects involved training on 32 young (61\u201370 y.o.) and
        32 aged (71+ y.o.) recordings. The 13 residual subjects in the 61\u201370
        group were classified as young via AR = 0.692. The decisions made by the machine
        on the 230 younger subjects comprising interval 3 yield \u03B2<sub>0</sub>
        = 45.12 and \u03B2<sub>1</sub> = -0.176 when fit with a linear model (<xref
        ref-type=\"fig\" rid=\"pone.0300720.g005\">Fig 5</xref>). A Spearman correlation
        of -0.161 does not reflect monotonicity and H3 is recognized as the most supported
        hypothesis.</p>\n</sec>\n<sec id=\"sec013\">\n<title>Functional connectivity
        changes are categorical with aging</title>\n<p>In light of the ML analysis
        providing predictions from measures of FC, we pursue a quantitative evaluation
        of the FC and how it varies across the age spectrum. For the 1000FCP dataset,
        <xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig 6A</xref> shows the mean
        and standard deviation (s.d.) of the FC for subjects across the seven decades.
        A significant decrease in mean FC in noted among the 51\u201360, 71\u201380,
        and 81+ groups (p &lt; 0.05). The positive FC values that showed a significant
        decrease coincided with the total FC except for the 31\u201340 age group.
        Although less apparent, the presence of anticorrelations was not negligible,
        and the decrease in the negative FC values was significant for the 81+ group.
        The alteration in FC with aging was also prevalent for the SRPBS subjects,
        however the direction of the change was different as there is an increase
        in FC with age (<xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig 6B</xref>).
        The increase accelerated among the 51\u201360 and 71+ groups and, aside for
        the positive correlations in the 61\u201370 y.o. group, is seen for positive,
        negative, and total connectivity measures. The change in the number of negative
        connections is not insignificant and follows an increasing trend that coincides
        with the conventionally considered (i.e. positive) correlations. The camCAN
        subjects show a decrease in FC that is steady but significant with increasing
        age (<xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig 6C</xref>). Interestingly,
        while being negligible in value in comparison to the number of positive correlations,
        the anticorrelations show an opposite trajectory by increasing with aging.
        For the NKI-RS dataset, <xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig
        6D</xref> shows the mean of the FC for subjects. A significant decrease in
        mean FC is noted among the 81+ y.o. group and for the positive FC values of
        the 71\u201380 y.o. group (p &lt; 0.05).</p>\n<fig id=\"pone.0300720.g006\"
        position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0300720.g006</object-id>\n<label>Fig
        6</label>\n<caption>\n<title/>\n<p>A study of the change in FC for subjects
        across decades from the A) 1000FCP, B) SRPBS, C) camCAN, and D) the NKI-RS
        recording center. The mean FC was computed by averaging across subjects the
        number of times that the Pearson CCs from the connectivity matrix exceeded
        a threshold of |\u03C1| = 0.6. The bifurcation of the FC in positive and negative
        (i.e. anticorrelations) directions is also shown. Two-sample t-tests are used
        to assess the significance of the change in FC with the youngest age group
        taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons between positive, negative, and total
        FC values. The s.d. of the number of functional connections is illustrated
        to study the inter-subject variability across the age spectrum.</p>\n</caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g006\"
        xlink:type=\"simple\"/>\n</fig>\n<p>We examine the inter-subject variability
        in FC with aging. In the case of 1000FCP, there is an increase in variability
        among middle age to elder (61\u201370) subjects, and a reduction in FC variability
        for the two oldest decades (<xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig
        6A</xref>). It is intriguing that the increase in FC consistency for the oldest
        subjects is precipitous and present among the positive and negative correlations.
        Similarly, the peak inter-subject FC variability occurs in middle age for
        the SRPBS subjects (51\u201360 y.o.) with decreasing variance for older and
        younger age groups (<xref ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig 6B</xref>).
        The youngest subjects (18\u201330 y.o.) exhibit the most consistency. The
        variance in the inter-subject FC for the camCAN subjects shows a steady decrease
        along the decades. There is a bimodal division as the older subjects (61+
        y.o.) have a more consistent CP than the younger subjects (<xref ref-type=\"fig\"
        rid=\"pone.0300720.g006\">Fig 6C</xref>). It is interesting that the datasets
        provide very different results on the variability in inter-subject FC across
        the broad age spectrum. While the 1000FCP and camCAN subjects show the least
        variability in the oldest age groups, the SRPBS subjects show the lowest variability
        for the youngest subjects. Furthermore, the 1000FCP and SRPBS subjects show
        the highest variability for middle-age (61\u201370 and 51\u201360, respectively),
        while the youngest decade (18\u201330 y.o.) camCAN subjects exhibited the
        largest inter-subject FC variability. In the case of the NKI-RS subjects there
        is an increase in variability among middle age to elder (61\u201370 y.o.)
        subjects, and a reduction in FC variability for the two oldest decades (<xref
        ref-type=\"fig\" rid=\"pone.0300720.g006\">Fig 6D</xref>). The trend is very
        similar to the aggregate 1000FCP scenario since the increase in FC consistency
        is precipitous for the oldest subjects and exists for positive and negative
        correlations. In summary, the change in the total FC is categorical with aging
        across the populations of subjects. The inter-subject variance, however, follows
        an inverted U-shaped trajectory in two datasets, and a bimodal trajectory
        showing a decrease in variability with aging in the third case.</p>\n</sec>\n<sec
        id=\"sec014\">\n<title>Brain aging dynamics are similar among sexes, but accentuated
        in males</title>\n<p>In considering the 1000FCP subjects, the results in <xref
        ref-type=\"fig\" rid=\"pone.0300720.g007\">Fig 7</xref> indicate that a decrease
        in FC with increasing age is more pronounced in males. Specifically, the two
        middle-age groups of males (41\u201350, 51\u201360) exhibited a significant
        decrease in their positive FC measures (p &lt; 0.05) while only the 51\u201360
        y.o. group of females showed a similar decline. The significant decrease in
        FC is noted in the total FC of males for the two oldest groups. A similar
        decrease is noted in females of 81 years and older. Interestingly, the oldest
        females witness a greater reduction in FC than the male subjects. For the
        SRPBS dataset there is an increase in FC with aging for both males and females,
        although the increase is only significant for the male subjects. Specifically,
        the increase in all three classes of correlations are significant for the
        male subjects in the 41\u201350 and 51\u201360 y.o. range, while only the
        negative correlations are significant for the female subjects of the same
        age groups (<xref ref-type=\"fig\" rid=\"pone.0300720.g008\">Fig 8</xref>).
        Perhaps more importantly, the males show their largest number of negative
        and total connections in the oldest age group. The subjects in the camCAN
        cohort exhibit a similar trend with the progressive change in FC being more
        prominent in males. While a significant decrease in total FC is noted in the
        71\u201380 and 81+ age groups for both sexes, the change starts earlier in
        males via the 61\u201370 y.o. group (<xref ref-type=\"fig\" rid=\"pone.0300720.g009\">Fig
        9</xref>). The earlier alteration to FC in males is also noted among their
        anticorrelations across the age spectrum. The change in FC for the NKI-RS
        subjects is similar to that seen for the aggregate 1000FCP dataset (<xref
        ref-type=\"fig\" rid=\"pone.0300720.g010\">Fig 10</xref>). The decrease in
        connectivity is only significant for the oldest age group of male and female
        subjects. The change is more pronounced in males because the total and positive
        FC values are statistically significant, while only the positive FC values
        are significant for females.</p>\n<fig id=\"pone.0300720.g007\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g007</object-id>\n<label>Fig
        7</label>\n<caption>\n<title>An assessment of the differences in FC between
        male and female subjects in the three datasets.</title>\n<p>The mean and s.d.
        of the number of connections are plotted separately for the male and female
        subjects from the 1000FCP dataset. The mean FC was computed by averaging across
        subjects the number of times the Pearson CCs from the connectivity matrix
        exceeded a threshold of |\u03C1| = 0.6. The division of the FC in positive
        and negative (i.e. anticorrelation) directions is also shown. Two-sample t-tests
        are used to assess the significance of the change in FC with the youngest
        age group taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons between positive, negative, and total
        FC values. The s.d. of the number of FCs is shown to study the inter-subject
        variability for each sex and age group.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g007\"
        xlink:type=\"simple\"/>\n</fig>\n<fig id=\"pone.0300720.g008\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g008</object-id>\n<label>Fig
        8</label>\n<caption>\n<title>Assessment of the differences in FC between male
        and female subjects in the three datasets.</title>\n<p>The mean and s.d. of
        the number of connections are plotted separately for the male and female subjects
        from the SRPBS dataset. The mean FC was computed by averaging across subjects
        the number of times the Pearson CCs from the connectivity matrix exceeded
        a threshold of |\u03C1| = 0.6. The division of the FC in positive and negative
        (i.e. anticorrelation) directions is also shown. Two-sample t-tests are used
        to assess the significance of the change in FC with the youngest age group
        taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons between positive, negative, and total
        FC values. The s.d. of the number of FCs is shown to study the inter-subject
        variability for each sex and age group.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g008\"
        xlink:type=\"simple\"/>\n</fig>\n<fig id=\"pone.0300720.g009\" position=\"float\">\n<object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0300720.g009</object-id>\n<label>Fig
        9</label>\n<caption>\n<title>Assessment of the differences in FC between male
        and female subjects in the three datasets.</title>\n<p>The mean and s.d. of
        the number of connections are plotted separately for the male and female subjects
        from camCAN. The mean FC was computed by averaging across subjects the number
        of times the Pearson CCs from the connectivity matrix exceeded a threshold
        of |\u03C1| = 0.6. The division of the FC in positive and negative (i.e. anticorrelation)
        directions is also shown. Two-sample t-tests are used to assess the significance
        of the change in FC with the youngest age group taken as the reference. A
        p-value of 0.05 is the threshold for statistical significance in the pairwise
        comparisons between positive, negative, and total FC values. The s.d. of the
        number of FCs is shown to study the inter-subject variability for each sex
        and age group.</p>\n</caption>\n<graphic mimetype=\"image\" position=\"float\"
        xlink:href=\"info:doi/10.1371/journal.pone.0300720.g009\" xlink:type=\"simple\"/>\n</fig>\n<fig
        id=\"pone.0300720.g010\" position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0300720.g010</object-id>\n<label>Fig
        10</label>\n<caption>\n<title>Assessment of the differences in FC between
        male and female subjects in the three datasets.</title>\n<p>The mean and s.d.
        of the number of connections are plotted separately for the male and female
        subjects from the NKI-RS recording center. The mean FC was computed by averaging
        across subjects the number of times the Pearson CCs from the connectivity
        matrix exceeded a threshold of |\u03C1| = 0.6. The division of the FC in positive
        and negative (i.e. anticorrelation) directions is also shown. Two-sample t-tests
        are used to assess the significance of the change in FC with the youngest
        age group taken as the reference. A p-value of 0.05 is the threshold for statistical
        significance in the pairwise comparisons between positive, negative, and total
        FC values. The s.d. of the number of FCs is shown to study the inter-subject
        variability for each sex and age group.</p>\n</caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pone.0300720.g010\"
        xlink:type=\"simple\"/>\n</fig>\n<p>We examine the inter-subject variability
        in FC with aging separately among the sexes. A rising and precipitous fall
        in variability is noted among both sexes for the 1000FCP subjects (<xref ref-type=\"fig\"
        rid=\"pone.0300720.g007\">Fig 7</xref>). However, the peak variability occurs
        at the different junctures of 51\u201360 for males and 61\u201370 for females
        when considering the total FC. A similar inverted U-shape trend is noted with
        the SRPBS data (<xref ref-type=\"fig\" rid=\"pone.0300720.g008\">Fig 8</xref>)
        but with the peak variance in inter-subject FC at the 61\u201370 age group
        in males while the peak variability for females occurred during the 51\u201360
        interval. In <xref ref-type=\"fig\" rid=\"pone.0300720.g009\">Fig 9</xref>,
        the camCAN results for the female subjects showed a similar spike in inter-subject
        variability during middle age since the 41\u201350 and 51\u201360 year-old
        females had the least consistency. The males show a variation in FC that is
        incongruous to what we have noted thus far. Namely, they showed the greatest
        variance in the young (18\u201330 and 31\u201340) and a relatively constant
        variance in the latter decades. The NKI-RS male and female subjects show a
        rising and precipitous falling in FC variability with aging (<xref ref-type=\"fig\"
        rid=\"pone.0300720.g010\">Fig 10</xref>). The trends are similar to that for
        the aggregate 1000FCP since the peak variabilities occur at 51\u201360 for
        males and 61\u201370 for females. In both sexes the lowest variability is
        seen for the oldest age group.</p>\n</sec>\n</sec>\n<sec id=\"sec015\" sec-type=\"conclusions\">\n<title>Discussion</title>\n<p>In
        the course of healthy human aging, one may expect a monotonic relationship
        with young brains having properties that are increasingly similar to aged
        brains. The application of ML pipelines can aid in the discovery of fundamental
        facets of brain aging including the role of sex. While our use of SVM was
        motivated by prior works [<xref ref-type=\"bibr\" rid=\"pone.0300720.ref005\">5</xref>,
        <xref ref-type=\"bibr\" rid=\"pone.0300720.ref026\">26</xref>], the questions
        and classification-based methodology are novel. The three intervals studied
        in <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig 1</xref> investigate
        questions pertaining to the dynamics of brain aging among healthy subjects.
        A strong degree of monotonicity was noted when considering the two extrema
        age groups as references (interval 1 of <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1A</xref>). This was consistent among three datasets that contained subjects
        of diverse demographics. A discrepancy from a Spearman correlation value of
        one\u2013i.e., a completely monotonic relationship\u2013points towards several
        practical considerations. For instance, the study is prone to inter-subject
        variability since participants of the same age may have very different genetic
        traits, environmental factors, and life histories while participants in a
        different age group may be more similar to each other with respect to the
        aforementioned factors.</p>\n<p>The analysis that accommodated a new question
        of whether the CPs of young brains contain structure that is conserved among
        progressively older brains (interval 2 of <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1B</xref>) provides a less categorical answer. While the majority of brains
        were classified as more similar to the aged group, there was little indication
        of monotonicity in the classifiers\u2019 decisions across the age spectrum.
        The difference in CP among younger brains was not indicative of nor resonated
        to the CP changes of the older brains. Conversely, it is interesting that
        information can be gained about the connectivity of young brains through the
        CPs of strictly older brains (i.e. interval 3 of <xref ref-type=\"fig\" rid=\"pone.0300720.g001\">Fig
        1C</xref>). In two of the datasets a linear fit showed that the CP associated
        with old subjects (61+ y.o.) are informative of relative changes in much younger
        subjects. <xref ref-type=\"table\" rid=\"pone.0300720.t003\">Table 3</xref>
        contains the prominent hypotheses among the possible brain aging trajectories
        in each interval for the datasets. The ML parameters as well as the results
        attained via the post-processing are also listed. To the best of our knowledge,
        this work presents the first evaluation of monotonicity in brain aging and
        its quantification via ML. The analysis has gone beyond the paradigm of brain
        age prediction from fMRI signals or changes in brain connectivity to probe
        whether differences in CPs of young brains are reflective of the differences
        in later life. Interestingly, the complementary question of whether the difference
        in CPs of aged brains are informative of the changes seen by younger subjects
        provided a different answer. For each of the three intervals in the monotonicity
        study, a 5-year sliding window was applied for smoothing. This was done prior
        to fitting a linear regression to the percentage of subjects that were classified
        as aged across the spectrum. The analysis was also performed without the sliding
        window (<xref ref-type=\"supplementary-material\" rid=\"pone.0300720.s001\">S1
        Fig</xref>) and we did not witness a change in the conclusions. It is noteworthy
        that the Spearman CC values were smaller in magnitude without the sliding
        window. This is expected because not smoothing may obfuscate or hide trends
        if the data at a single age contains outliers or when fewer, non-representative
        subjects exist at an age. The interval 1 subjects in Figs <xref ref-type=\"fig\"
        rid=\"pone.0300720.g003\">3</xref>\u2013<xref ref-type=\"fig\" rid=\"pone.0300720.g005\">5</xref>
        that deviate from a monotonic relationship deserve further discussion. This
        is explained by the limitation in the number of subjects as well as the empirical
        nature of the collected data. Despite a smoothing operation having been applied,
        the percentage of subjects classified as aged was computed for every year
        in the interval. This temporal resolution further contributed to specific
        ages consisting of a fewer number of subjects and the likelihood of a non-representative
        CP affecting the results at a particular age. Another factor follows from
        the choice of the monotonicity measure. Although a commonly used metric, the
        Spearman CC is a measure of linear monotonicity. Conversely, the BOLD signal
        as well as the aging process are nonlinear processes at both the micro- and
        macroscale. As increased data, analysis, and results come forth, it will perhaps
        be possible to thoroughly assess the suitability of nonlinear measures of
        monotonicity for explaining brain aging dynamics.</p>\n<table-wrap id=\"pone.0300720.t003\"
        position=\"float\">\n<object-id pub-id-type=\"doi\">10.1371/journal.pone.0300720.t003</object-id>\n<label>Table
