        surface area</p></def>\n</def-item>\n<def-item><term>CMR</term>\n<def><p>cardiac
        magnetic resonance</p></def>\n</def-item>\n<def-item><term>ECV</term>\n<def><p>left
        ventricular myocardial extracellular volume fraction</p></def>\n</def-item>\n<def-item><term>FRDA</term>\n<def><p>Friedreich
        ataxia</p></def>\n</def-item>\n<def-item><term>GAA1</term>\n<def><p>number
        of GAA repeats in the smaller allele of the <italic>FXN</italic> gene</p></def>\n</def-item>\n<def-item><term>LGE</term>\n<def><p>late
        gadolinium enhancement</p></def>\n</def-item>\n<def-item><term>LV</term>\n<def><p>left
        ventricular</p></def>\n</def-item>\n<def-item><term>LVEDV</term>\n<def><p>left
        ventricular end-diastolic volume</p></def>\n</def-item>\n<def-item><term>LVEDVI</term>\n<def><p>left
        ventricular end-diastolic volume indexed to body surface area</p></def>\n</def-item>\n<def-item><term>LVEF</term>\n<def><p>left
        ventricular ejection fraction</p></def>\n</def-item>\n<def-item><term>LVESV</term>\n<def><p>left
        ventricular end-systolic volume</p></def>\n</def-item>\n<def-item><term>LVM</term>\n<def><p>left
        ventricular mass</p></def>\n</def-item>\n<def-item><term>LVMI</term>\n<def><p>left
