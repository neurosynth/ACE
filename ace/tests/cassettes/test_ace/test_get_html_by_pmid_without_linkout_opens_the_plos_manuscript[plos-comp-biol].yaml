        Publication Stage</meta-name>\n<meta-value>uncorrected-proof</meta-value>\n</custom-meta>\n</custom-meta-group>\n</article-meta>\n</front>\n<body>\n<sec
        id=\"sec001\" sec-type=\"intro\">\n<title>Introduction</title>\n<p>One of
        the most critical and challenging areas in cancer biology is the identification
        of driver genes and mutations. Cancer driver mutations fuel tumor progression,
        unlike neutral passenger mutations [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref001\">1</xref>].
        In recent years, machine learning and deep learning have shown great potential
        in bioinformatics, including applications for detecting cancer driver genes
        and mutations [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref002\">2</xref>\u2013<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref006\">6</xref>]. However, current
        deep learning models predominantly utilize sequence data and three-dimensional
        protein structures to infer driver mutations [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref001\">1</xref>],
        while functional genomics, especially gene editing, remains less explored.
        Additionally, the interpretability of these black-box models is often limited.</p>\n<p>Conventional
        gene perturbation strategies, such as knockout and RNAi-mediated knockdown,
        enable researchers to study a gene\u2019s loss-of-function effects on tumor
        progression, aiding in identifying cancer-driver genes and mutations [<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref007\">7</xref>]. CRISPR-Cas9 has advanced
        gene perturbation in terms of precision and scale [<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref008\">8</xref>]. The Cancer Dependency Map (DepMap)
        at the Broad Institute conducted genome-wide CRISPR-Cas9 knockout screens
        across a wide range of cancer cell lines [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref009\">9</xref>,<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref010\">10</xref>], providing gene dependency
        scores that reflect each gene\u2019s importance for cell proliferation and
        survival in a cell-line-specific manner. While DepMap dependency scores provide
        valuable insights into the essentiality of genes in cancer cells, they are
        not sufficient on their own to conclusively determine whether a gene is a
        driver of cancer. Accurate identification of cancer driver genes requires
        an integrated analysis of dependency scores with other data types, such as
        DNA mutations, pathway involvement, and gene expression.</p>\n<p>We hypothesize
        that mutations with driver activity can leave detectable signatures in the
        genome-wide dependency landscape, whereas passenger mutations are less likely
        to produce coherent dependency shifts. To test the hypothesis, we built a
        supervised learning model to predict the mutation status (mutated or not)
        of each candidate gene, using the dependency scores of all screened genes
        in a cell line. The model\u2019s fitness, expressed as the driver potential
        score of this candidate gene, prioritizes genes whose mutation status has
        a strong functional footprint in dependency data. We name this model <bold>xNNDriver</bold>
        (e<bold>x</bold>plainable <bold>N</bold>eural <bold>N</bold>etwork for <bold>Driver</bold>
        gene identification). Because the labels are derived from existing mutation
        annotations, xNNDriver is best viewed as a functional prioritization and interpretation
        framework rather than an independent de novo mutation-discovery tool. Additionally,
        genome-scale CRISPR knockouts measure gene loss-of-function effects on cancer-cell
        fitness. Although well suited to detecting oncogene addiction, these screens
        may have limited sensitivity for tumor suppressors that are already inactivated.
        However, tumor suppressor alterations can still be reflected in DepMap data
        when they reshape the dependencies of other genes across the genome. xNNDriver
        is designed to capture these broader mutation-associated dependency patterns,
        rather than relying only on the dependency score of the candidate gene itself.</p>\n<p>Our
        approach successfully identified both well-known driver genes and novel candidates.
        To discern the pathways through which these drivers contribute to tumorigenesis,
        we incorporated the Reactome pathway hierarchy [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref011\">11</xref>]
        into the network architecture, designing each neuron to represent a distinct
        biological pathway.</p>\n<p>To simultaneously infer multi-driver functional
        states in a cell line, we designed an interpretable autoencoder model that
        integrates both dependency scores and gene expression data. This unsupervised
        model is named <bold>xAEDriver (</bold>e<bold>x</bold>plainable <bold>A</bold>uto<bold>E</bold>ncoder
        for hidden overall <bold>Driver</bold> status identification). The latent
        layer of xAEDriver, which captures the key features of the input data in a
        compressed form, is guided by the mutation distribution of known driver single
        nucleotide variants (SNVs). The latent representations are constrained to
        resemble the population-level distribution of driver mutations, but they are
        not forced to correspond to specific genes or variants. We refer to these
        latent representations as <bold>D</bold>river <bold>V</bold>ariant <bold>R</bold>epresentations
        (DVRs). xAEDriver is also interpretable, so it can reveal biological pathways
        that offer a deeper understanding of the driver mutation status. Notably,
        cell lines stratified by DVRs exhibited distinct drug responses, supporting
        the use of dependency-derived driver states to interpret treatment-relevant
        vulnerabilities.</p>\n</sec>\n<sec id=\"sec002\" sec-type=\"results\">\n<title>Results</title>\n<sec
        id=\"sec003\">\n<title>The fitness of the supervised xNNDriver quantifies
        cancer driver potential from dependency landscapes</title>\n<p>Our supervised
        xNNDriver model links genome-wide gene dependency scores to the mutation status
        of a candidate driver gene in each cancer cell line. The mutation status of
        a true driver gene, but not passenger mutations, influences the impact of
        other genes\u2019 knockout on tumor survival (dependency). In other words,
        the distinct genome-wide dependency scores can predict the mutation status
        of driver genes (high model fitness), but not those of passenger genes (low
        model fitness). We define the resulting model fitness as the driver potential
        score, a measure of mutation-dependency association and functional prioritization
        rather than direct proof of causality. A schematic overview of the workflow
        is shown in <xref ref-type=\"fig\" rid=\"pcbi.1014869.g001\">Fig 1A</xref>.</p>\n<fig
        id=\"pcbi.1014869.g001\" position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pcbi.1014869.g001</object-id><label>Fig
        1</label><caption><title>Supervised xNNDriver model for prioritizing individual
        candidate driver genes.</title><p><bold>(A)</bold> Workflow of xNNDriver.
        Functional SNVs are aggregated to annotate the gene-level mutation status
        for each candidate driver gene. Individual neural network models are trained
        using gene dependency scores as input features and candidate gene mutation
        status as labels. Data are split into training and test sets, and the model
        follows the Reactome pathway hierarchy. Predictions from all layers are integrated
        via voting. The model fitness is evaluated using the driver potential score,
        where a higher score indicates a stronger mutation-dependency association
        and higher priority as a candidate driver. <bold>(B)</bold> Prediction performance
        for the top 15 genes with the highest driver potential scores. Point color
        represents the number of cell lines with functional mutations in each candidate
        gene. A total of 1,095 cell lines (mutated and non-mutated) are considered
        for each model. Gene names are color-coded by driver annotation from DepMap
        (purple: driver; black: non-driver). <bold>(C)</bold> Tissue-level driver
        potential scores. The color of each square indicates the driver potential
        score within test cell lines from a given tissue, and the number following
        the tissue name denotes the count of test cell lines in that tissue.</p></caption>\n<graphic
        mimetype=\"image\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.g001\"
        xlink:type=\"simple\"/></fig>\n<p>To construct the training data, we determined
        each candidate gene\u2019s mutation status based on the presence of functional
        somatic SNVs, as annotated by both the COSMIC [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref012\">12</xref>]
        and ClinVar [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref013\">13</xref>]
        databases. The model was trained using a biologically informed feedforward
        neural network whose architecture mirrors the pathway hierarchy acquired from
        the Reactome database. The input layer consists of screened genes with dependency
        scores, and the hidden layers represent pathways. The edges between the input
        layer and the first hidden layer capture pathway membership for each gene,
        while the edges between pathway layers represent the hierarchical relationships
        between pathway terms. Each pathway layer is followed by a predictive layer
        designed to predict the mutation status of a candidate driver gene. Predictions
        from all hidden layers are aggregated using a voting mechanism.</p>\n<p>The
        model fitness of xNNDriver reflects the strength of association between a
        candidate gene\u2019s mutation status and genome-wide dependency patterns.
        A high driver potential score therefore suggests that the gene\u2019s mutation
        status is linked to a broad functional dependency signature in cancer cells
        and prioritizes it for driver-focused interpretation. Important pathways contributing
        to predictions are identified by contrasting the activation values of neural
        networks between mutated and non-mutated cell lines. We iteratively apply
        the xNNDriver model to all candidate genes (3,008 genes) to prioritize cancer
        driver genes and their associated important pathways.</p>\n</sec>\n<sec id=\"sec004\">\n<title>xNNDriver
        prioritizes established drivers and literature-supported candidate driver
        genes</title>\n<p>We applied our supervised model, xNNDriver, to the 15% most
        frequently mutated genes in human cancers as determined by the CCLE project
        [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref014\">14</xref>], totaling
        3,008 candidate genes. <xref ref-type=\"fig\" rid=\"pcbi.1014869.g001\">Fig
        1B</xref> illustrates the driver potential scores of the 15 highest-scoring
        genes, with complete results provided in <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s006\">S1 Table</xref>. Among the top 15 genes, ten are
        well-established cancer driver genes as documented in DepMap, such as <italic>KRAS</italic>,
        <italic>NRAS</italic>, <italic>BRAF</italic>, <italic>PIK3CA</italic>, <italic>TP53</italic>,
        and so on. This strong concordance supports that the dependency landscape
        contains functional information that captures core cancer driver biology.</p>\n<p>The
        remaining genes, although not yet recognized as drivers in DepMap, have been
        suggested in the literature to possess driver-like functions. For example,
        Murakami et al. and Strazisar et al. [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref015\">15</xref>,<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref016\">16</xref>] reported that <italic>LATS2</italic>
        acts as a tumor suppressor essential for regulating the proliferation and/or
        survival of malignant mesothelioma cells. <italic>EZH2</italic> exhibits a
        dual role, functioning as either a tumor suppressor or an oncogene depending
        on the cellular context [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref017\">17</xref>].
        Additionally, Sasaki et al. [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref018\">18</xref>]
        identified <italic>KEAP1</italic> as an inhibitor of NRF2-induced cytoprotection
        and proposed it as a potential tumor suppressor. Collectively, these results
        demonstrate that xNNDriver can reprioritize known drivers and nominate literature-supported
        candidates for further validation.</p>\n<p>To test the robustness of our model,
        we redefined mutation status using all somatic SNVs rather than only functional
        ones. The top 30 genes under this alternative annotation are shown in <xref
        ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s001\">S1 Fig</xref>,
        with complete results in <xref ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s007\">S2
        Table</xref>. The recovery of major known drivers (<italic>KRAS</italic>,
        <italic>NRAS</italic>, <italic>BRAF</italic>, <italic>PIK3CA</italic>, <italic>TP53</italic>)
        and consistent identification of <italic>EZH2</italic> underscore the robustness
        of our approach.</p>\n<p>We next examined tissue-specific driver activity.
        For the top 15 genes (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g001\">Fig
        1B</xref>), we recalculated driver potential scores within individual tissue
        types. As shown in <xref ref-type=\"fig\" rid=\"pcbi.1014869.g001\">Fig 1C</xref>,
        higher tissue-level scores indicate a gene\u2019s stronger driver potential
        in that tissue. For instance, <italic>BRAF</italic> is strongly associated
        with thyroid cancers, consistent with the <italic>BRAF V600E</italic> mutation
        being the most common alteration in papillary thyroid carcinoma [<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref019\">19</xref>]. Similarly, <italic>PIK3CA</italic>
        mutations frequently drive breast cancers [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref020\">20</xref>].
        This tissue-resolved analysis highlights the context-specific roles of cancer
        drivers.</p>\n<p>Furthermore, we evaluated event-level performance for the
        15 highest-ranked genes by comparing held-out cell line\u2013gene predictions
        with curated functional SNV labels (<xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s002\">S2 Fig</xref>). Precision exceeded 90% for several
        established drivers, including <italic>KRAS</italic>, <italic>BRAF</italic>,
        <italic>TP53</italic>, and <italic>HRAS</italic>. Predicted-positive pairs
        without matching SNVs may represent false positives or alterations not included
        in the current labels, such as indels, copy-number alterations, structural
        variants, and other non-SNV mechanisms. Recall was approximately 78% for <italic>KRAS</italic>
        and 60% for <italic>BRAF</italic>. Missed events may reflect passenger or
        context-dependent mutations, incomplete dependency signals, or limited model
        sensitivity. Thus, xNNDriver identifies catalogued mutation events associated
        with detectable functional dependency footprints, although this cell line-gene-level
        analysis does not directly determine the functional effect of an individual
        variant.</p>\n<p>To assess performance under native class imbalance, we additionally
        calculated the area under the precision-recall curve (AUPRC) for the top 15
        xNNDriver genes without upsampling. Established drivers (e.g., <italic>KRAS</italic>,
        <italic>TP53</italic>, <italic>BRAF</italic>, <italic>NRAS</italic>) retained
        strong precision-recall performance, whereas several rare or marginal candidates
        (e.g., <italic>LATS2</italic>, <italic>ALK</italic>, <italic>BAP1</italic>)
        showed low AUPRC despite non-random AUROC (<xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s008\">S3 Table</xref>). Thus, AUROC-based driver potential
        and AUPRC provide complementary information: AUROC reflects overall discrimination,
        while AUPRC provides a more conservative estimate of positive-class recovery
        in imbalanced mutation settings. Together, these analyses demonstrate both
        the benefit of upsampling for detecting mutation-associated dependency signals,
        particularly for rare mutations, and the need for further experimental validation
        of candidates with limited positive-class precision.</p>\n<p>Baseline machine
        learning models, including Logistic Regression, Random Forest, and an unconstrained
        Multilayer Perceptron, achieved comparable or sometimes higher AUROC for individual
        genes (<xref ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s009\">S4
        Table</xref>). These results indicate that genome-wide dependency profiles
        contain mutation-associated signals that can be detected by multiple modeling
        approaches. xNNDriver showed a positive rank correlation with Logistic Regression,
        the strongest baseline model (Spearman \u03C1\u2009=\u20090.49; <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s009\">S4 Table</xref>), supporting consistency in dependency-based
        gene prioritization. However, the main advantage of xNNDriver is not raw classification
        accuracy alone, but its pathway-guided interpretability. By embedding the
        Reactome hierarchy directly into the network architecture, xNNDriver links
        candidate driver mutations to interpretable pathway-level dependency patterns,
        providing biological context that is not directly available from standard
        baseline models.</p>\n</sec>\n<sec id=\"sec005\">\n<title>Self-dependency
        contributes biologically meaningful signal but does not fully explain top
        driver predictions</title>\n<p>To address whether xNNDriver relied primarily
        on the candidate gene\u2019s own dependency score, we performed a leave-candidate-dependency-out
        analysis for the top 15 genes. In this analysis, the dependency score of the
        target candidate gene was removed from the input feature matrix, and model
        performance was recalculated (<xref ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s010\">S5
        Table</xref>). The strongest established drivers retained substantial predictive
        performance after this removal. For example, <italic>KRAS</italic> changed
        from 0.873 to 0.896, <italic>NRAS</italic> from 0.854 to 0.858, <italic>BRAF</italic>
        from 0.814 to 0.790, <italic>PIK3CA</italic> from 0.684 to 0.738, and <italic>TP53</italic>
        from 0.640 to 0.638. These results indicate that, for core drivers, mutation
        status is also encoded in dependency patterns across other genes, supporting
        the presence of distributed functional footprints.</p>\n<p>At the same time,
        several genes showed stronger dependence on the candidate gene\u2019s own
        dependency feature. <italic>LATS2</italic> decreased from 0.667 to 0.500,
        <italic>ALK</italic> from 0.598 to 0.498, <italic>XPO1</italic> from 0.571
        to 0.500, and <italic>MYC</italic> from 0.556 to 0.500 after self-dependency
        removal. We do not interpret this as a model defect, because self-dependency
        is itself an experimentally measured functional phenotype and may reflect
        direct vulnerability, oncogene addiction, or altered tolerance to gene loss.
        Instead, this analysis separates two biologically meaningful components of
        the driver potential score: direct self-dependency and distributed network-level
        dependency effects.</p>\n</sec>\n<sec id=\"sec006\">\n<title>xNNDriver reveals
        driver-associated pathway programs from dependency signatures</title>\n<p>Using
        the interpretable xNNDriver model, we discovered important pathways associated
        with high-scoring candidate driver genes. <xref ref-type=\"fig\" rid=\"pcbi.1014869.g002\">Fig
        2A</xref> shows the top 20 pathways, ranked by their importance measurements
        (<inline-formula id=\"pcbi.1014869.e001\"><alternatives><graphic id=\"pcbi.1014869.e001g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e001\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M1\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>values),
        for the 15 genes with the highest driver potential scores. The complete list
        of pathways passing the <inline-formula id=\"pcbi.1014869.e002\"><alternatives><graphic
        id=\"pcbi.1014869.e002g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e002\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M2\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        cutoff (default: 0.1) for these genes is provided in <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s011\">S6 Table</xref>. Metabolic pathways ranked prominently,
        including \u201Cmetabolism,\u201D \u201Cmetabolism of proteins,\u201D and
        \u201Cmetabolism of lipids.\u201D This aligns with Vander Heiden et al. [<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref021\">21</xref>], who demonstrated
        that altered cellular metabolism can drive tumor progression and inform cancer
        prognosis and therapy.</p>\n<fig id=\"pcbi.1014869.g002\" position=\"float\"><object-id
        pub-id-type=\"doi\">10.1371/journal.pcbi.1014869.g002</object-id><label>Fig
        2</label><caption><title>Analysis of important pathways from xNNDriver.</title><p><bold>(A)</bold>
        Top important pathways. The top 20 pathways are ranked by <inline-formula
        id=\"pcbi.1014869.e003\"><alternatives><graphic id=\"pcbi.1014869.e003g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e003\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M3\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        values, aggregated from models of the 15 highest-scoring driver genes. For
        pathways identified in multiple models, the maximum<inline-formula id=\"pcbi.1014869.e004\"><alternatives><graphic
        id=\"pcbi.1014869.e004g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e004\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M4\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        value is reported. <bold>(B)</bold> Pathway proximity to driver genes. Benjamini-Hochberg
        adjusted p-values are from the one-sided Wilcoxon signed-rank test comparing
        the shortest path lengths to the corresponding driver gene between identified
        and random pathways at the same hierarchy level. The random sampling procedures
        were repeated 20 times. Genes are sorted by their driver potential scores.
        The number in brackets next to the gene name indicates the number of important
        pathways identified from the corresponding gene model. The red dashed line
        marks the adjusted p-value cutoff of 0.05. <bold>(C)</bold> Correlation between
        pathway proximity and importance. Pearson correlation coefficients between
        relative shortest-path length differences and pathway rankings. The red dashed
        line marks the cutoff of 0. <bold>(D)</bold> Differential pathway expression
        variability. Benjamini-Hochberg adjusted p-values from one-sided Wilcoxon
        signed-rank tests comparing the expression CV values of all gene members of
        an important pathway between cell lines with and without the corresponding
        driver gene mutation are shown. The red dashed line marks the adjusted p-value
        cutoff of 0.05.</p></caption>\n<graphic mimetype=\"image\" position=\"float\"
        xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.g002\" xlink:type=\"simple\"/></fig>\n<p>Additionally,
        signal transduction pathways, such as \u201Cdiseases of signal transduction
        by growth factor receptors and second messengers,\u201D were also highly ranked.
        This is consistent with Rho et al. [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref022\">22</xref>],
        who highlighted growth factor signaling as a central mechanism in carcinogenesis.
        The \u201Csignaling by receptor tyrosine kinases\u201D pathway governs essential
        processes in cell growth and survival, with mutations in key members (e.g.,
        <italic>EGFR</italic>, <italic>HER2</italic>, <italic>MET</italic>) representing
        major cancer hallmarks [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref023\">23</xref>,<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref024\">24</xref>].</p>\n<p>Interestingly,
        several immune-related pathways, such as \u201Csignaling by interleukins,\u201D
        \u201Ccytokine signaling in the immune system,\u201D and \u201Cinnate immune
        system\u201D, were identified as important pathways associated with the top
        15 driver genes. These pathways are known to regulate inflammation, immune
        signaling, and tumor-immune interactions that contribute to cancer initiation
        and progression. Aberrant interleukin and cytokine signaling can activate
        oncogenic pathways such as JAK/STAT3 and PI3K-AKT, while dysregulation of
        innate immune signaling promotes chronic inflammation and immune evasion [<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref025\">25</xref>\u2013<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref027\">27</xref>].</p>\n</sec>\n<sec id=\"sec007\">\n<title>Driver-associated
        pathways show Reactome proximity and independent expression variability</title>\n<p>To
        assess the validity of the identified pathways, we measured their proximity
        to corresponding driver genes within the Reactome hierarchy. We calculated
        the shortest path length between each important pathway node (<inline-formula
        id=\"pcbi.1014869.e005\"><alternatives><graphic id=\"pcbi.1014869.e005g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e005\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M5\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>\u2265</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow><mml:mo>.</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>)
        and its corresponding driver gene, comparing against random pathway nodes
        at the same level (20 random samplings). As shown in <xref ref-type=\"fig\"
        rid=\"pcbi.1014869.g002\">Fig 2B</xref>, important pathway nodes are significantly
        closer to their corresponding driver genes than random ones (Benjamini-Hochberg
        adjusted p-values\u2009&lt;\u20090.05 for all comparisons, paired Wilcoxon
        signed-rank tests).</p>\n<p>We further evaluated the relationship between
        pathway importance and hierarchical proximity. Across nearly all drivers,
        the relative difference in shortest-path length between important and random
        pathways positively correlated with pathway rank (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g002\">Fig
        2C</xref>). Thus, the more important a pathway is, the closer it is to the
        driver gene compared to random pathways at the same layer. Notably, genes
        with higher driver potential scores exhibit stronger correlations, as shown
        in <xref ref-type=\"fig\" rid=\"pcbi.1014869.g002\">Fig 2C</xref>, where genes
        are ordered by their scores. Together, these results support the use of <inline-formula
        id=\"pcbi.1014869.e006\"><alternatives><graphic id=\"pcbi.1014869.e006g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e006\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M6\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        for interpretable pathway prioritization and reinforce the utility of the
        driver potential score as a functional association measure.</p>\n<p>To explore
        the underlying mechanisms by which the pathways promote tumorigenesis, we
        examined pathway expression stochasticity. In our previous study [<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref028\">28</xref>], we found that pathways important for
        cell type stratification often exhibit differential expression stochasticity,
        measured by the coefficient of variation (CV; standard deviation over mean),
        rather than differences in mean expression between cell type groups. Here,
        for each important pathway, we calculated the expression CV for all genes
        within the pathway, comparing cell lines with the corresponding driver gene
        mutated versus unmutated, and assessed significance using a Wilcoxon signed-rank
        test. As shown in <xref ref-type=\"fig\" rid=\"pcbi.1014869.g002\">Fig 2D</xref>,
        of the 357 pathways analyzed (<inline-formula id=\"pcbi.1014869.e007\"><alternatives><graphic
        id=\"pcbi.1014869.e007g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e007\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M7\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>\u2265</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow><mml:mo>.</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        across the 15 highest-scoring gene models, <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s011\">S6 Table</xref>), 193 display a Benjamini-Hochberg
        adjusted p-value below 0.05. These findings emphasize that expression variability
        rather than mean differences may characterize driver-associated pathways,
        which is an insight often overlooked by traditional gene set enrichment analyses.
        Importantly, xNNDriver does not use expression data, so these stochasticity
        patterns are independent of model training and reflect intrinsic pathway characteristics.</p>\n</sec>\n<sec
        id=\"sec008\">\n<title>The unsupervised xAEDriver model learns multiple-driver
        functional representations</title>\n<p>The success of xNNDriver suggests that
        genome-wide dependency scores for a tumor cell line contain information predictive
        of driver-associated functional states. Building on this, and recognizing
        that multiple driver mechanisms collectively shape tumorigenesis, we developed
        the unsupervised xAEDriver model to infer multiple driver variant representations
        (DVRs) that encapsulate cell-line-specific dependency and expression profiles
        while being regularized toward the population-level frequency distribution
        of known functional driver SNVs (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g003\">Fig
        3A</xref>). xAEDriver integrates gene dependency and expression data using
        an autoencoder with a fully connected encoder and a biologically informed
        decoder constrained by the Reactome pathway hierarchy. The latent layer captures
        lower-dimensional embeddings of the data. Here, to guide xAEDriver in generating
        hidden \u201Cdriver mutation\u201D information, we incorporated data from
        known functional driver SNVs to steer the autoencoder's training, ensuring
        that the lower-dimensional embeddings (referred to as DVRs) have frequency
        distributions similar to real driver SNVs (Materials and methods). We then
        applied layer-wise relevance propagation (LRP) to identify important pathways
        contributing to the reconstruction, enabling us to uncover additional biological
        insights related to the latent functional states.</p>\n<fig id=\"pcbi.1014869.g003\"
        position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pcbi.1014869.g003</object-id><label>Fig
        3</label><caption><title>Unsupervised xAEDriver model to reconstruct driver
        variant representations (DVRs).</title><p><bold>(A)</bold> Workflow of xAEDriver.
        Gene dependency and expression data are jointly used to train an autoencoder
        with a fully connected encoder and a biologically constrained decoder aligned
        with the Reactome hierarchy. The encoder produces low-dimensional embeddings
        (DVRs) representing cell-line-specific driver states. Known driver SNVs are
        incorporated into training using a truncated binomial modeling approach<bold>.
        (B)</bold> Illustration of cancer type matching ratio. As an example, among
        three cell lines with mutations of the DVR (value\u2009=\u20091), two match
        the reported cancer type (melanoma) for the corresponding (the most similar)
        known driver SNV, yielding a matching ratio of <inline-formula id=\"pcbi.1014869.e008\"><alternatives><graphic
        id=\"pcbi.1014869.e008g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e008\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M8\"><mml:mrow><mml:mfrac><mml:mrow><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mtext>3</mml:mtext></mml:mrow></mml:mrow></mml:mfrac></mml:mrow></mml:math></alternatives></inline-formula>.
        Similarly, for the most similar real driver SNV, the matching ratio is 1 (<inline-formula
        id=\"pcbi.1014869.e009\"><alternatives><graphic id=\"pcbi.1014869.e009g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e009\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M9\"><mml:mrow><mml:mfrac><mml:mrow><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow></mml:mrow></mml:mfrac></mml:mrow></mml:math></alternatives></inline-formula>).
        <bold>(C)</bold> Comparison of cancer-type matching ratios between DVRs (blue)
        and their most similar known driver SNVs (red). The data are sorted in descending
        order based on the matching ratios of the DVRs.</p></caption>\n<graphic mimetype=\"image\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.g003\"
        xlink:type=\"simple\"/></fig>\n</sec>\n<sec id=\"sec009\">\n<title>DVRs recapitulate
        driver-mutation frequency and represent the overall driver mutation status
        of a cancer cell line</title>\n<p>To evaluate the effectiveness of the guided
        learning in xAEDriver, we compared the mutation distribution of known driver
        SNVs with that of DVRs across all cell lines (<xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s003\">S3 Fig</xref>). The mutation distribution of DVRs
        closely matched that of actual driver mutations, as demonstrated by the Earth
        Mover\u2019s Distance (EMD) of 5.4 (on a 0\u20131,000 scale) between their
        mutation patterns. EMD, a metric for assessing distribution similarity, represents
        the minimum effort required to transform one distribution into another [<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref029\">29</xref>]. These results underscore
        the effectiveness of the regularization term in mimicking the distribution
        of real mutations, guiding xAEDriver to actually learn DVRs in the hidden
        layer.</p>\n<p>Next, we examined whether each DVR\u2019s artificial mutation
        status (coded as 1 in the artificial representation vector) matched the reported
        cancer type of its closest real SNV, determined via Euclidean distance. The
        cancer type matching ratio was calculated as illustrated in <xref ref-type=\"fig\"
        rid=\"pcbi.1014869.g003\">Fig 3B</xref>. After excluding 481 DVRs with non-unique
        matched real SNVs, 61 out of 440 DVRs achieved a matching ratio\u2009\u2265\u20090.5
        (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g003\">Fig 3C</xref>), suggesting
        that many DVRs capture cancer-type-specific mutation patterns. Among the remaining
        379 DVRs with a matching ratio below 0.5, 263 (or 69%) still had a matching
        ratio greater than or equal to that of their corresponding real SNV. This
        suggests that the associated real mutations are often observed in a cancer
        type different from the one reported. This could be due to several factors:
        the driver mutation may drive tumorigenesis in another cellular context or
        a different cancer type, or the mutation may emerge during cancer progression
        as a compensatory mechanism or an accelerating \u201Csecond hit\u201D.</p>\n</sec>\n<sec
        id=\"sec010\">\n<title>xAEDriver highlights pathways central to tumor progression</title>\n<p>Using
        layer-wise relevance propagation (LRP) in xAEDriver, we computed pathway relevance
        scores (<inline-formula id=\"pcbi.1014869.e010\"><alternatives><graphic id=\"pcbi.1014869.e010g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e010\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M10\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>)
        for each pathway <inline-formula id=\"pcbi.1014869.e011\"><alternatives><graphic
        id=\"pcbi.1014869.e011g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e011\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M11\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        and cell line <inline-formula id=\"pcbi.1014869.e012\"><alternatives><graphic
        id=\"pcbi.1014869.e012g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e012\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M12\"><mml:mrow><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>,
        where higher values indicate greater contribution to the reconstruction of
        the autoencoder. Averaging across all cell lines yielded overall pathway importance
        (<inline-formula id=\"pcbi.1014869.e013\"><alternatives><graphic id=\"pcbi.1014869.e013g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e013\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M13\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>).
        <xref ref-type=\"fig\" rid=\"pcbi.1014869.g004\">Fig 4</xref> shows the top
        20 pathways ranked by <inline-formula id=\"pcbi.1014869.e014\"><alternatives><graphic
        id=\"pcbi.1014869.e014g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e014\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M14\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        values, with the complete list provided in <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s012\">S7 Table</xref>. The top pathways, such as \u201Ccomplement
        cascade\u201D (rank 1), \u201CTNFR2 non-canonical NF-kB pathway\u201D (rank
        2), and \u201CHuR (ELAVL1) binds and stabilizes mRNA\u201D (rank 6), have
        been previously linked to tumor progression. For example, Rutkowski et al.
        [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref030\">30</xref>] highlighted
        the role of the complement cascade in driving cancer by promoting key hallmarks
        of its progression. Albini et al. [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref031\">31</xref>]
        demonstrated that <italic>RAF2</italic> inactivating mutations increase alternative
        NF-kB pathway activation in mantle cell lymphoma, diffuse large B-cell lymphoma,
        and multiple myeloma. Cai et al. [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref032\">32</xref>]
        revealed that <italic>ELAVL1</italic> is an m6A-binding protein highly expressed
        in multiple tumors that regulates RNA stability to promote tumor progression.
        These results confirm that xAEDriver effectively uncovers biologically meaningful
        pathways central to tumor biology.</p>\n<fig id=\"pcbi.1014869.g004\" position=\"float\"><object-id
        pub-id-type=\"doi\">10.1371/journal.pcbi.1014869.g004</object-id><label>Fig
        4</label><caption><title>Important pathways identified from xAEDriver.</title><p>The
        top 20 pathways ordered by <inline-formula id=\"pcbi.1014869.e015\"><alternatives><graphic
        id=\"pcbi.1014869.e015g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e015\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M15\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        values are shown.</p></caption>\n<graphic mimetype=\"image\" position=\"float\"
        xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.g004\" xlink:type=\"simple\"/></fig>\n</sec>\n<sec
        id=\"sec011\">\n<title>DVRs link multi-driver functional states to drug response</title>\n<p>Having
        established that xAEDriver captures meaningful driver variant representations
        (DVRs), we next investigated whether these DVRs are associated with functional
        outcomes in cancer cells, specifically their ability to reflect tissue-specific
        drug sensitivity patterns and provide mechanistic insights into differential
        drug responses. To address this, we constructed LASSO regression models to
        predict drug sensitivity (AUC) for each drug using the DVR binary matrix across
        our panel of cancer cell lines (Materials and methods). DVR-based models significantly
        outperformed those trained on an equivalent number of random somatic mutations
        in the test set. Twelve DVR models achieved a test-set <inline-formula id=\"pcbi.1014869.e016\"><alternatives><graphic
        id=\"pcbi.1014869.e016g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e016\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M16\"><mml:mrow><mml:msup><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow></mml:mrow></mml:msup><mml:mo>&gt;</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow><mml:mo>.</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow><mml:mrow><mml:mtext>5</mml:mtext></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>,
        whereas none of the 50 random models met this threshold (complete list in
        <xref ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s013\">S8 Table</xref>).</p>\n<p>For
        each of the twelve DVR-based models passing this performance threshold, we
        identified the ten most influential DVRs based on the absolute values of their
        LASSO coefficients, comparing them to a control set of ten randomly selected
        DVRs. The biological relevance of these top DVRs was evaluated using a tissue
        concordance score (Materials and methods), which quantifies the alignment
        between each DVR\u2019s mutation distribution across tissues and the tissue
        distribution of the most drug-sensitive cell lines (lowest AUC values). These
        top DVRs showed significantly higher tissue concordance scores than random
        controls, indicating that they capture tissue-specific drug response patterns
        (mean p\u2009=\u20090.0015<inline-formula id=\"pcbi.1014869.e017\"><alternatives><graphic
        id=\"pcbi.1014869.e017g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e017\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M17\"><mml:mrow><mml:mo>\xB1</mml:mo></mml:mrow></mml:math></alternatives></inline-formula>0.0018
        across 10 independent random samplings, paired Wilcoxon signed-rank test,
        <xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">Fig 5A</xref>). These results
        demonstrate that DVRs effectively prioritize biologically meaningful, tissue-specific
        features associated with drug sensitivity.</p>\n<fig id=\"pcbi.1014869.g005\"
        position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pcbi.1014869.g005</object-id><label>Fig
        5</label><caption><title>DVRs from xAEDriver reveal drug-response patterns
        via LASSO regression and distance-based stratification.</title><p><bold>(A)</bold>
        Differential tissue concordance of DVRs. The displayed points correspond to
        one representative random-control sampling, in which the top 10 DVRs from
        LASSO models for twelve LASSO-explainable drugs show significantly higher
        tissue concordance scores than random DVRs (p\u2009=\u20090.0005, paired Wilcoxon
        signed-rank test). Across 10 independent random-control samplings, this comparison
        remained significant (mean p\u2009=\u20090.0015, SD\u2009=\u20090.0018). <bold>(B-E)</bold>
        Differential drug sensitivity. Cell lines stratified by DVR dissimilarity,
        DVR-divergent (high dissimilarity) and DVR-convergent (low dissimilarity),
        exhibit distinct drug responses. The DVR-convergent group shows significantly
        higher sensitivity (lower AUC) to drugs <bold>(B)</bold> Velban, <bold>(C)</bold>
        ICL1100013, <bold>(D)</bold> Mirin, and <bold>(E)</bold> Alecensa (all Benjamini-Hochberg
        adjusted p\u2009=\u20090.02, t-tests). <bold>(F)</bold> Pathway hierarchy
        tree for the top 10 important pathways in the DVR-divergent and DVR-convergent
        groups. Highlighted pathways illustrate representative differences in <inline-formula
        id=\"pcbi.1014869.e018\"><alternatives><graphic id=\"pcbi.1014869.e018g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e018\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M18\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        (pathway importance) between groups. Gray nodes denote parent pathways connecting
        these top-ranked nodes, while non-relevant child and sibling nodes are omitted
        for clarity.</p></caption>\n<graphic mimetype=\"image\" position=\"float\"
        xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.g005\" xlink:type=\"simple\"/></fig>\n<p>Next,
        we stratified cancer cell lines based on their DVR binary matrix using a distance-based
        approach (Materials and methods). This analysis divided the cell lines into
        a DVR-divergent (high dissimilarity) group (n\u2009=\u200976) and a DVR-convergent
        (low dissimilarity) group (n\u2009=\u2009430). Comparison of drug responses
        between these two groups identified seven drugs with significantly different
        AUC values (Benjamini-Hochberg adjusted p-value\u2009&lt;\u20090.05, t-test).
        <xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">Fig 5B</xref>\u2013<xref
        ref-type=\"fig\" rid=\"pcbi.1014869.g005\">5E</xref> highlight four representative
        drugs, including Velban, ICL1100013, Mirin, and Alecensa. Interestingly, all
        four drugs were more effective in the larger DVR-convergent group, suggesting
        shared vulnerabilities across a broad spectrum of cancer cell lines. The boxplots
        for the other three drugs, SN38, Mps-1-IN-1, and Y-39983, are shown in <xref
        ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s004\">S4 Fig</xref>.</p>\n<p>To
        further assess the relationship between DVR and drug response, we correlated
        the pairwise Euclidean distances between cell lines in the DVR space with
        the pairwise Pearson\u2019s correlations of their drug response (AUC) profiles.
        This analysis revealed a significant, though modest, negative correlation
        (PCC\u2009= \u22120.04, p-value\u2009=\u20095.5<inline-formula id=\"pcbi.1014869.e019\"><alternatives><graphic
        id=\"pcbi.1014869.e019g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e019\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M19\"><mml:mrow><mml:mo>\xD7</mml:mo></mml:mrow></mml:math></alternatives></inline-formula>10<sup>-39</sup>),
        indicating that cell lines with greater DVR dissimilarity tend to exhibit
        less similar drug sensitivity patterns. These results demonstrate that DVR-based
        stratification can effectively distinguish cell lines with distinct drug response
        profiles.</p>\n<p>To explore the biological mechanisms underlying these differences,
        we analyzed pathway relevance within each cell line group. All 680 pathways
        were ranked by their average relevance scores across cell lines (<xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s014\">S9 Table</xref>), revealing group-specific enrichment
        among the top pathways (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">Fig
        5F</xref>). For example, the \u201CAdaptive immune system\u201D pathway ranked
        7th in the DVR-convergent group but 654th in the DVR-divergent group, consistent
        with higher sensitivity to Velban and ICL1100013 in the DVR-convergent group
        (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">Fig 5B</xref>\u2013<xref
        ref-type=\"fig\" rid=\"pcbi.1014869.g005\">5C</xref>). Previous findings show
        that local low-dose Velban injection enhances adaptive immunity via dendritic
        cell maturation [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref033\">33</xref>],
        while ICL1100013 targets <italic>NMT1</italic>, an enzyme critical for T-cell
        receptor signaling and immune function [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref034\">34</xref>,<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref035\">35</xref>]. Similarly, the \u201CBase
        excision repair\u201D (BER) pathway ranked much higher in the DVR-convergent
        group (10th vs. 564th in the DVR-divergent group), consistent with increased
        sensitivity to Mirin (an <italic>MRE11</italic> inhibitor) and Alecensa (an
        <italic>ALK</italic> inhibitor) (<xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">Fig
        5D</xref>\u2013<xref ref-type=\"fig\" rid=\"pcbi.1014869.g005\">5E</xref>).
        These associations are mechanistically coherent: <italic>MRE11</italic> plays
        key roles in BER and single-strand break repair [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref036\">36</xref>],
        while Alecensa resistance, characterized by low <italic>SFTPD</italic> expression,
        has been linked to elevated BER pathway activity [<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref037\">37</xref>]. Together, these findings suggest that
        enhanced immune and DNA repair pathway activities underlie the heightened
        drug sensitivity observed in the DVR-convergent group.</p>\n<p>Overall, these
        results demonstrate that DVR-based representations capture biologically and
        therapeutically relevant signals, enabling the identification of tissue-specific
        patterns, drug sensitivities, and underlying pathway mechanisms in cancer
        cell lines.</p>\n</sec>\n<sec id=\"sec012\">\n<title>Ablation study supports
        the importance of frequency-guided regularization</title>\n<p>To assess whether
        the truncated binomial distribution penalty provides a useful inductive bias
        or instead introduces circularity by injecting known driver mutation statistics
        into the latent representation, we performed an ablation study. We trained
        a binomial-penalty-ablated xAEDriver model in which the autoencoder was optimized
        using only reconstruction loss and L2 weight regularization, while removing
        the frequency-guided penalty from the latent layer.</p>\n<p>The binomial penalty
        used in xAEDriver is intentionally low-information. It does not encode driver
        gene identity, pathway membership, tissue type, drug response, or any one-to-one
        correspondence between DVRs and known driver SNVs. Instead, it constrains
        only the marginal frequency distribution of DVR presence across cell lines,
        encouraging the latent variables to have a sparsity pattern broadly similar
        to observed functional driver SNVs. Many different DVR-cell line assignments
        could satisfy the same frequency distribution; therefore, the biological and
        pharmacological associations of DVRs must still be learned from the dependency
        and expression data during autoencoder training.</p>\n<p>Removal of the binomial
        penalty substantially reduced downstream performance. The number of drugs
        with held-out test-set R\xB2\u2009&gt;\u20090.05 decreased from 12 to 2, and
        the maximum test-set R\xB2 declined from approximately 0.34 to 0.08 (<xref
        ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s015\">S10 Table</xref>).
        Tissue concordance of the top predictive DVRs also became non-significant,
        with the paired Wilcoxon signed-rank test p-value changing from 0.0015 to
        0.5. In addition, DVR-based stratification no longer identified any drugs
        with significantly different sensitivity between DVR-divergent and DVR-convergent
        cell lines, compared with seven drugs identified by the original model using
        Benjamini-Hochberg adjusted p-value\u2009&lt;\u20090.05.</p>\n<p>These results
        indicate that the binomial penalty improves the biological coherence and downstream
        utility of the learned latent space. Rather than imposing specific biological
        annotations, the frequency-guided penalty acts as a weak population-level
        prior that discourages degenerate latent representations and helps xAEDriver
        recover DVRs that remain informative for drug response, tissue concordance,
        and pathway-level interpretation.</p>\n</sec>\n</sec>\n<sec id=\"sec013\"
        sec-type=\"conclusions\">\n<title>Discussion</title>\n<p>In this study, we
        introduce interpretable functional-genomics frameworks for linking cancer
        driver alterations to genome-wide dependency landscapes, pathway programs,
        and drug-response structure in cancer cell lines. xNNDriver prioritizes candidate
        driver genes by quantifying how strongly their mutation status is reflected
        in dependency profiles, while xAEDriver learns multi-driver functional representations
        that summarize broader oncogenic states. Together, these models show that
        DepMap dependency data encode biologically interpretable signals of driver
        activity and treatment-relevant vulnerability.</p>\n<p>xNNDriver reframes
        driver identification from a purely mutation-frequency paradigm to a systems-level
        functional consequence paradigm. The fact that known drivers score highly
        supports the biological signal embedded in dependency landscapes. Furthermore,
        the model is applied uniformly to 3,008 candidate genes and identifies both
        established and literature-supported but not yet DepMap-annotated candidates.
        Importantly, the driver potential score quantifies the functional footprint
        of mutations rather than their recurrence alone.</p>\n<p>Given that the dependency
        score of the candidate driver gene provides a quantifiable functional signature
        of driver activity, it was included as an input feature and could be intrinsically
        selected during model training. For example, loss of an oncogene often reduces
        cell viability (low dependency score), whereas loss of a tumor suppressor
        enhances growth (high dependency score). As shown in <xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s005\">S5 Fig</xref>, <italic>TP53</italic>, a tumor suppressor,
        exhibits the highest mean dependency score (0.426), while <italic>NRAS</italic>,
        an oncogene, shows a low value (\u22120.654). However, <italic>HRAS</italic>,
        another oncogenic driver, displays a near-neutral score (\u22120.107), underscoring
        that single-gene dependency alone provides only partial information about
        driver status. Indeed, the self-dependency exclusion experiment showed that
        top drivers retained substantial predictive performance after their own dependency
        scores were removed, indicating that xNNDriver also captures distributed dependency
        signals across other genes. For some candidates, performance decreased after
        removal, suggesting a stronger contribution from direct self-dependency. Thus,
        we interpret the driver potential score as an integrated mutation-dependency
        association measure that can reflect self-dependency, network-level dependency
        effects, or both.</p>\n<p>xNNDriver-prioritized pathways frequently exhibited
        lower expression CV in driver-mutant cell lines, even when differences in
        mean expression were modest. Because these estimates were derived from bulk
        RNA-seq across cell lines, they reflect inter-cell-line pathway-state variability
        rather than single-cell transcriptional noise. Reduced variability may indicate
        driver-induced canalization, in which oncogenic alterations lock downstream
        pathways into more stable transcriptional states. In non-mutated contexts,
        higher pathway variability may reflect dynamic responses to environmental,
        genetic, and regulatory cues, whereas driver mutations may restrict this flexibility
        by enforcing a constitutive pathway state. This state-locking provides a plausible
        mechanistic link to the dependency footprints captured by xNNDriver, because
        tumor cells may become more reliant on the altered pathway or its compensatory
        networks and less able to adapt to CRISPR perturbations. Because expression
        data were not used to train xNNDriver, the observed decrease in pathway expression
        variability provides independent biological support for the functional dependency
        footprints identified by the model.</p>\n<p>To model complex combinatorial
        functional states, we developed the unsupervised xAEDriver model. While xNNDriver
        excels at evaluating individual driver genes, it is not inherently designed
        to capture systemic, multi-driver states. In contrast, xAEDriver represents
        a conceptual shift from single-driver evaluation to multi-driver functional
        state inference by encoding cell-line-specific patterns that mimic the behavior
        of real functional driver variants through guided learning.</p>\n<p>DVRs showed
        biologically interpretable and drug-associated patterns. Using LASSO regression,
        we demonstrated that the DVR-based predictions of drug response also exhibited
        strong tissue-type specificity, supporting their biological relevance. Furthermore,
        DVR-based stratification of cancer cell lines revealed distinct groups with
        significantly different drug sensitivity profiles and pathway activities.
        This stratification identified specific vulnerabilities, such as enhanced
        response to immune-related or DNA repair-targeting drugs, highlighting the
        translational potential of DVRs in predicting therapeutic responses and informing
        precision oncology strategies.</p>\n<p>The ablation analysis of xAEDriver
        supports the importance of frequency-guided regularization in shaping biologically
        interpretable DVRs, but the role of the truncated binomial prior should be
        interpreted with caution. This prior does not encode specific driver gene
        identities, pathway annotations, tissue labels, drug-response information,
        or one-to-one mappings between DVRs and known driver SNVs. Instead, it provides
        only a coarse prevalence constraint, encouraging DVRs to follow the broad
        sparsity pattern observed for functional driver SNVs while leaving the specific
        DVR-cell line assignments to be learned from dependency and expression data.
        This design helps balance flexibility and biological structure in the latent
        space: it discourages overly dense or degenerate representations optimized
        only for reconstruction, while still allowing DVRs to capture novel combinations
        of functional states. Thus, we view the binomial penalty as a weak inductive
        bias that improves latent-space organization, rather than as evidence that
        mutation frequency itself determines driver importance. Future work may explore
        alternative priors, including cancer-type-specific or context-adaptive priors,
        to better capture rare driver states.</p>\n<p>To enhance interpretability,
        both xNNDriver and xAEDriver incorporated biologically informed neural network
        architectures guided by the Reactome pathway hierarchy. Rather than acting
        merely as a sparsity constraint, this design embeds the hierarchy directly
        into the network to aggregate signals across levels, enabling the mechanistic
        attribution of driver effects. We do not view the pathway-constrained architecture
        alone as proof of a causal mechanism; instead, pathway attributions are supported
        by standalone proximity analysis, expression-stochasticity analyses, and consistency
        with external literature. In xNNDriver, the identified important pathways
        demonstrate hierarchical coherence and expression variability patterns. In
        xAEDriver, a biologically constrained decoder preserves pathway structure
        while allowing the encoder to learn flexible representations, since fully
        constraining both sides proved too restrictive and often produced trivial
        DVRs. Ultimately, the pathways identified by both models confirm the biological
        robustness of our framework, providing interpretable and biologically grounded
        insights beyond conventional pathway enrichment analyses.</p>\n<p>Despite
        the utility of DepMap as a comprehensive functional-genomics resource, several
        limitations should be acknowledged. Genome-scale CRISPR knockout screens measure
        the effect of additional gene loss on cancer-cell fitness. This design is
        well suited to detecting direct dependencies on activated oncogenes, but its
        interpretation for tumor suppressors is more context-dependent. Some tumor
        suppressor alterations can still be captured when they are associated with
        direct dependency signals or broader dependency-landscape changes. For example,
        <italic>TP53</italic> exhibits a high mean dependency score (0.426), is strongly
        prioritized by xNNDriver, and remains predictive after <italic>TP53</italic>\u2019s
        own dependency score is removed from the input features (<xref ref-type=\"supplementary-material\"
        rid=\"pcbi.1014869.s010\">S5 Table</xref>). This indicates that tumor suppressor-associated
        dependency signals can extend beyond dependency on the candidate gene itself.
        However, tumor suppressors that are already functionally inactivated, poorly
        represented in relevant tissue contexts, or mainly altered through non-SNV
        mechanisms may remain difficult to detect. <italic>RB1</italic> illustrates
        this limitation: despite its established role in retinoblastoma and other
        cancers, it shows no strong eye-specific signal and generally low scores in
        <xref ref-type=\"fig\" rid=\"pcbi.1014869.g001\">Fig 1C</xref>. This may reflect
        pre-existing <italic>RB1</italic> loss, limited tissue representation, and
        incomplete capture of non-SNV loss-of-function mechanisms, including indels,
        copy-number loss, structural alterations, or epigenetic silencing. Therefore,
        low xNNDriver scores should not be interpreted as evidence against the established
        roles of canonical tumor suppressors. Future versions of the framework should
        integrate multiple alteration types to better capture tumor-suppressor biology.</p>\n<p>Second,
        DepMap also identifies pan-essential housekeeping genes whose loss broadly
        impairs cell fitness. Such dependencies may contribute to driver-associated
        functional footprints but are unlikely to provide a favorable therapeutic
        window because of potential on-target, off-tumor toxicity. Therefore, xNNDriver
        pathway scores indicate functional associations rather than direct therapeutic
        tractability, which requires additional evaluation of tumor selectivity and
        normal-tissue tolerance.</p>\n<p>Looking ahead, expanding the models to include
        larger and more diverse datasets will improve the detection of both common
        and rare driver mutations across different cancer types. This broader scope
        will refine our understanding of gene dependencies and mutation synergies,
        leading to more accurate prediction of therapeutic vulnerabilities. Ultimately,
        the integration of dependency data with mutational and pharmacological information
        will advance precision oncology by enabling more personalized and effective
        cancer treatment strategies.</p>\n</sec>\n<sec id=\"sec014\" sec-type=\"materials|methods\">\n<title>Materials
        and methods</title>\n<sec id=\"sec015\">\n<title>Datasets</title>\n<sec id=\"sec016\">\n<title>The
        DepMap database.</title>\n<p>We utilized data from the Cancer Dependency Map
        (DepMap) projects (23Q2 version). This release contains data from CRISPR-Cas9
        knockout screens across multiple tumor types, as part of Broad\u2019s Achilles
        [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref038\">38</xref>] and Sanger\u2019s
        SCORE projects [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref039\">39</xref>].
        It also includes genomic and transcriptomic characterizations from the CCLE
        project [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref040\">40</xref>].</p>\n<p>The
        primary dataset includes CRISPR-Cas9 essentiality screens for 17,931 genes
        across 1,095 cell lines [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref009\">9</xref>,<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref010\">10</xref>], resulting in a cell-line-by-screened-gene
        matrix. Each entry represents the \u201Cdependency score\u201D of a screened
        gene, which was processed from the log-fold change in sgRNA read counts before
        and after knockout. A lower dependency score indicates a stronger reduction
        in cell viability following gene knockout, implying that the gene is essential
        for cell survival. Quality control and normalization were performed by DepMap.</p>\n<p>Somatic
        point mutations for the DepMap cell lines were obtained from the same source
        [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref041\">41</xref>]. We specifically
        filtered for SNVs, resulting in a final set of 1,290,926 mutations for downstream
        analysis. Gene expression data (RNA-seq) were also retrieved as transcripts
        per million (TPM) for 19,194 genes across 1,450 cell lines, log-transformed
        with a pseudo-count of one. A total of 1,019 cell lines had both dependency
        score and gene expression data available.</p>\n<p>We also downloaded drug
        sensitivity data for the cell lines [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref042\">42</xref>].
        From the raw data, fold-change viability values were calculated using the
        R package gdscIC50 [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref043\">43</xref>],
        and standard four-parameter monotonic log-logistic dose-response curves were
        fitted using the R package dr4pl [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref044\">44</xref>].
        Drug sensitivity was then quantified as the area under the curve (AUC), covering
        320 drugs across 962 cell lines. Among these, 506 cell lines also had dependency
        scores and gene expression data available.</p>\n</sec>\n<sec id=\"sec017\">\n<title>The
        COSMIC database.</title>\n<p>We obtained mutation data from the Catalogue
        of Somatic Mutations in Cancer (COSMIC) Cancer Mutation Census [<xref ref-type=\"bibr\"
        rid=\"pcbi.1014869.ref012\">12</xref>], filtering for SNVs. To identify functionally
        significant mutations, we retained those annotated as \u201Chigh\u201D or
        \u201Cmoderate\u201D impact based on consequence predictions from the Ensembl
        Variation database [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref045\">45</xref>].</p>\n</sec>\n<sec
        id=\"sec018\">\n<title>The ClinVar database.</title>\n<p>ClinVar compiles
        relationships between human genetic variants and phenotypic outcomes [<xref
        ref-type=\"bibr\" rid=\"pcbi.1014869.ref013\">13</xref>]. Although primarily
        focused on germline mutations, it includes somatic variants as well. We downloaded
        the ClinVar summary table and filtered for SNVs annotated as: pathogenic,
        likely pathogenic, affects, drug response, or confers sensitivity.</p>\n<p>We
        merged the filtered COSMIC and ClinVar SNVs, yielding 28,459 clinically significant
        variants also documented in DepMap. Among these, 340 were located in known
        driver genes with mutations observed in at least one cell line, which we designated
        as known driver mutations for model training and validation.</p>\n</sec>\n</sec>\n<sec
        id=\"sec019\">\n<title>xNNDriver: Supervised model for identifying driver
        genes</title>\n<sec id=\"sec020\">\n<title>Training and test data.</title>\n<p>Gene
        names from the considered datasets were converted to Ensembl IDs using the
        DAVID portal [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref046\">46</xref>],
        ensuring consistency with the Reactome database. Genes absent from the Reactome
        database were excluded. Dependency scores were split into training (75%) and
        test (25%) sets, with five-fold cross-validation on the training set for hyperparameter
        tuning. Because mutation-positive samples were much fewer than negatives,
        we balanced the classes during the training process by random upsampling of
        positive samples to achieve a 1:1 ratio.</p>\n</sec>\n<sec id=\"sec021\">\n<title>Pathway
        hierarchy.</title>\n<p>The Reactome database [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref011\">11</xref>]
        was used to construct a hierarchical pathway tree using the NetworkX Python
        library. Internal nodes represent pathways, and leaves correspond to genes.
        To simplify the hierarchy and reduce redundancy, each gene was linked only
        to its closest pathway nodes. A hyperparameter <italic>l</italic> controlled
        the number of pathway levels included. Genes or pathways absent from the data
        were excluded. The resulting structure was encoded as a binary mask matrix
        <italic>M</italic>, where <inline-formula id=\"pcbi.1014869.e020\"><alternatives><graphic
        id=\"pcbi.1014869.e020g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e020\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M20\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>M</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>denotes
        a valid connection. Following our previous work [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref028\">28</xref>],
        multi-layer predictive designs were employed to enhance model accuracy.</p>\n</sec>\n<sec
        id=\"sec022\">\n<title>Neural network construction.</title>\n<p>We built a
        feedforward neural network based on the mask matrix. The input layer consists
        of CRISPR-Cas9 screened genes, with their corresponding dependency scores
        as input data. The size of the input layer corresponds to the number of genes
        allocated to the lowest level of the pathway hierarchy. For each layer, the
        input is denoted as <inline-formula id=\"pcbi.1014869.e021\"><alternatives><graphic
        id=\"pcbi.1014869.e021g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e021\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M21\"><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        and the output as <inline-formula id=\"pcbi.1014869.e022\"><alternatives><graphic
        id=\"pcbi.1014869.e022g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e022\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M22\"><mml:mrow><mml:mrow><mml:mi>y</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>.
        The output of each layer is calculated as: <inline-formula id=\"pcbi.1014869.e023\"><alternatives><graphic
        id=\"pcbi.1014869.e023g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e023\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M23\"><mml:mrow><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:mrow><mml:mi>f</mml:mi></mml:mrow><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">[</mml:mo><mml:mo stretchy=\"false\">(</mml:mo><mml:mrow><mml:mi>M</mml:mi></mml:mrow><mml:mrow><mml:mi>W</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">)</mml:mo><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mo>+</mml:mo><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mo
        fence=\"true\" form=\"postfix\" stretchy=\"true\">]</mml:mo></mml:mrow><mml:mo>,</mml:mo></mml:mrow></mml:math></alternatives></inline-formula>
        where <inline-formula id=\"pcbi.1014869.e024\"><alternatives><graphic id=\"pcbi.1014869.e024g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e024\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M24\"><mml:mrow><mml:mrow><mml:mi>f</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the activation function (tanh), <inline-formula id=\"pcbi.1014869.e025\"><alternatives><graphic
        id=\"pcbi.1014869.e025g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e025\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M25\"><mml:mrow><mml:mrow><mml:mi>M</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the mask matrix, <inline-formula id=\"pcbi.1014869.e026\"><alternatives><graphic
        id=\"pcbi.1014869.e026g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e026\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M26\"><mml:mrow><mml:mrow><mml:mi>W</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the weight matrix, and <inline-formula id=\"pcbi.1014869.e027\"><alternatives><graphic
        id=\"pcbi.1014869.e027g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e027\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M27\"><mml:mrow><mml:mrow><mml:mi>b</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the bias vector. Here, <inline-formula id=\"pcbi.1014869.e028\"><alternatives><graphic
        id=\"pcbi.1014869.e028g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e028\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M28\"><mml:mrow><mml:mrow><mml:mi>M</mml:mi></mml:mrow><mml:mrow><mml:mi>W</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the element-wise multiplication (Hadamard product) of <inline-formula id=\"pcbi.1014869.e029\"><alternatives><graphic
        id=\"pcbi.1014869.e029g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e029\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M29\"><mml:mrow><mml:mrow><mml:mi>M</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        and <inline-formula id=\"pcbi.1014869.e030\"><alternatives><graphic id=\"pcbi.1014869.e030g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e030\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M30\"><mml:mrow><mml:mrow><mml:mi>W</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>.</p>\n<p>The
        tanh activation function was selected to provide bounded and signed hidden
        representations. Because xNNDriver pathway importance is based on activation
        differences between mutation-positive and mutation-negative cell lines, bounding
        activations to [-1, 1] improves comparability across pathway layers and gene-specific
        models. In addition, the sign of tanh activations allows the model to preserve
        opposing dependency patterns, rather than truncating negative signals as ReLU
        would. Although tanh may saturate in deeper networks, the relatively shallow
        Reactome-guided architecture used here reduces this concern.</p>\n<p>Binary
        predictions were generated using a sigmoid function: <inline-formula id=\"pcbi.1014869.e031\"><alternatives><graphic
        id=\"pcbi.1014869.e031g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e031\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M31\"><mml:mrow><mml:mrow><mml:mi>\u03C3</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">(</mml:mo><mml:mrow><mml:mi>z</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">)</mml:mo><mml:mo>=</mml:mo><mml:mfrac><mml:mrow><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow><mml:mo>+</mml:mo><mml:msup><mml:mrow><mml:mrow><mml:mi>e</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mo>\u2212</mml:mo><mml:mrow><mml:mi>z</mml:mi></mml:mrow></mml:mrow></mml:msup></mml:mrow></mml:mfrac><mml:mo>.</mml:mo></mml:mrow></mml:math></alternatives></inline-formula>
        A cell line was classified as 1 (mutated) if <inline-formula id=\"pcbi.1014869.e032\"><alternatives><graphic
        id=\"pcbi.1014869.e032g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e032\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M32\"><mml:mrow><mml:mrow><mml:mi>\u03C3</mml:mi></mml:mrow><mml:mo>&gt;</mml:mo></mml:mrow></mml:math></alternatives></inline-formula>0.5.
        Training used the Adam optimizer, cross-entropy loss, and L<sub>2</sub> regularization.
        Final predictions were aggregated across all predictive layers via majority
        voting, and model performance was quantified by the AUC metric on the test
        set, referred to as the driver potential score.</p>\n</sec>\n<sec id=\"sec023\">\n<title>Hyperparameter
        tuning.</title>\n<p>We applied stepwise hyperparameter tuning with five-fold
        cross-validation on the training set of the model for the candidate gene <italic>KRAS</italic>
        to optimize hyperparameters. Hyperparameters were tuned sequentially in the
        following order: the number of levels in the pathway hierarchy tree (<inline-formula
        id=\"pcbi.1014869.e033\"><alternatives><graphic id=\"pcbi.1014869.e033g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e033\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M33\"><mml:mrow><mml:mrow><mml:mi>l</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>),
        L<sub>2</sub> regularization hyperparameter, learning rate, batch size, and
        number of epochs. The optimal hyperparameter values based on the highest driver
        potential score were <inline-formula id=\"pcbi.1014869.e034\"><alternatives><graphic
        id=\"pcbi.1014869.e034g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e034\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M34\"><mml:mrow><mml:mrow><mml:mi>l</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        = 3, regularization\u2009=\u20090.0001, learning rate\u2009=\u20090.01, batch
        size\u2009=\u2009128, and epochs\u2009=\u2009100.</p>\n</sec>\n<sec id=\"sec024\">\n<title>Event-level
        validation.</title>\n<p>Beyond the aggregate driver potential score, we performed
        event-level validation to assess whether xNNDriver can correctly identify
        individual mutation events in held-out cell lines. For each of the top 15
        candidate driver genes, precision was calculated as the fraction of cell lines
        predicted as mutation-positive that indeed harbored the corresponding functional
        mutation in DepMap, and recall was calculated as the fraction of truly mutated
        cell lines that the model correctly identified. These per-gene metrics were
        evaluated on the same held-out test set (~25% of all cell lines) used for
        driver potential scoring.</p>\n</sec>\n<sec id=\"sec025\">\n<title>Baseline
        model comparison.</title>\n<p>To contextualize xNNDriver\u2019s predictive
        performance, we benchmarked it against three conventional classifiers: Logistic
        Regression, Random Forest, and a standard Multilayer Perceptron without pathway
        constraints (all with default hyperparameters). All baseline models were trained
        using the same genome-wide dependency score features, mutation-status labels,
        and 75/25 training/test split as xNNDriver, but without embedding the Reactome
        pathway hierarchy into the model architecture. For the top 15 candidate genes,
        we compared the test-set AUROC of each baseline model with the corresponding
        xNNDriver driver potential score. To further assess whether xNNDriver produced
        gene rankings consistent with a simpler predictive model, we trained Logistic
        Regression across candidate genes with valid xNNDriver driver potential scores
        greater than 0.5 (433 genes) and calculated the Spearman rank correlation
        between Logistic Regression AUROC and xNNDriver driver potential score.</p>\n</sec>\n<sec
        id=\"sec026\">\n<title>Identification of important pathways in xNNDriver.</title>\n<p>Pathway
        importance was measured as the absolute difference in activation values between
        cell lines with and without mutation for a given pathway <inline-formula id=\"pcbi.1014869.e035\"><alternatives><graphic
        id=\"pcbi.1014869.e035g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e035\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M35\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>:
        <inline-formula id=\"pcbi.1014869.e036\"><alternatives><graphic id=\"pcbi.1014869.e036g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e036\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M36\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>d</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mo
        stretchy=\"false\">|</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>A</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow></mml:mrow></mml:msub><mml:mo>\u2212</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>A</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow></mml:msub><mml:mo
        stretchy=\"false\">|</mml:mo></mml:mrow></mml:math></alternatives></inline-formula><italic>.</italic>
        If a pathway appears in the paths of multiple prediction layers (nested subnetworks),
        we chose the maximum value of <inline-formula id=\"pcbi.1014869.e037\"><alternatives><graphic
        id=\"pcbi.1014869.e037g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e037\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M37\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>d</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        across all paths as the final importance measure, denoted as <inline-formula
        id=\"pcbi.1014869.e038\"><alternatives><graphic id=\"pcbi.1014869.e038g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e038\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M38\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>.
        Pathways with a <inline-formula id=\"pcbi.1014869.e039\"><alternatives><graphic
        id=\"pcbi.1014869.e039g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e039\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M39\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        value greater than a predefined threshold (default: 0.1) were considered important.
        If the pathway node was an artificial node introduced to preserve the pathway
        tree structure, the original pathway node was retrieved.</p>\n</sec>\n<sec
        id=\"sec027\">\n<title>Proximity analysis in the Reactome hierarchy.</title>\n<p>For
        each candidate driver gene, we calculated the shortest path length between
        its important pathways and the gene within the Reactome tree using NetworkX.
        Random pathways from the same hierarchical level served as controls. Statistical
        significance was assessed using paired Wilcoxon signed-rank tests. Correlations
        between relative path-length differences (the shortest path length for an
        important node minus that for a random pathway node, divided by the former)
        and <inline-formula id=\"pcbi.1014869.e040\"><alternatives><graphic id=\"pcbi.1014869.e040g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e040\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M40\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>ranks
        (sorted descendingly) were computed using Pearson correlation coefficients
        across 20 randomizations.</p>\n</sec>\n<sec id=\"sec028\">\n<title>Expression
        stochasticity of the pathways.</title>\n<p>Pathway expression variability
        was quantified by the coefficient of variation (CV: standard deviation over
        mean) of member genes across cell lines with or without the candidate gene
        mutation. Differences in CV distributions were tested using the Wilcoxon signed-rank
        test. Here, we use the term \u201Cexpression stochasticity\u201D operationally
        to describe inter-cell-line variability in pathway expression measured from
        bulk RNA-seq, rather than single-cell transcriptional bursting within individual
        cells.</p>\n</sec>\n</sec>\n<sec id=\"sec029\">\n<title>xAEDriver: Unsupervised
        model for multi-driver representation learning</title>\n<sec id=\"sec030\">\n<title>Training
        data preparation.</title>\n<p>The model xAEDriver utilized both gene dependency
        score and gene expression data as input features. Cell lines present in only
        one of the two data sources were excluded. For each gene <inline-formula id=\"pcbi.1014869.e041\"><alternatives><graphic
        id=\"pcbi.1014869.e041g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e041\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M41\"><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        in cell line <inline-formula id=\"pcbi.1014869.e042\"><alternatives><graphic
        id=\"pcbi.1014869.e042g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e042\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M42\"><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>,
        each feature was normalized within genes: <inline-formula id=\"pcbi.1014869.e043\"><alternatives><graphic
        id=\"pcbi.1014869.e043g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e043\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M43\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>r</mml:mi></mml:mrow><mml:mrow><mml:mi>m</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mtext>\_\_</mml:mtext><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mfrac><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mtext>\_\_</mml:mtext><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>\u2212</mml:mo><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">(</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mo>\xB7</mml:mo><mml:mo>,</mml:mo><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo
        stretchy=\"false\">)</mml:mo></mml:mrow><mml:mrow><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mo>\xB7</mml:mo><mml:mo>,</mml:mo><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo
        fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mml:mo></mml:mrow><mml:mo>\u2212</mml:mo><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">(</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mo>\xB7</mml:mo><mml:mo>,</mml:mo><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo
        stretchy=\"false\">)</mml:mo></mml:mrow></mml:mfrac></mml:mrow></mml:math></alternatives></inline-formula>.
        This gene-wise normalization step maps both CRISPR dependency scores and RNA-seq
        gene expression data onto a comparable numerical scale. After normalization,
        the gene dependency and expression data were merged into a unified matrix
        by aligning cell lines.</p>\n</sec>\n<sec id=\"sec031\">\n<title>Guided learning
        using known driver SNVs.</title>\n<p>Known driver SNV frequencies across cell
        lines were modeled using a truncated binomial distribution to exclude both
        endpoints. Let <inline-formula id=\"pcbi.1014869.e044\"><alternatives><graphic
        id=\"pcbi.1014869.e044g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e044\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M44\"><mml:mrow><mml:mrow><mml:mi>X</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        represent the number of cell lines in which a known driver SNV is present
        as the mutated allele. The truncated binomial distribution for <inline-formula
        id=\"pcbi.1014869.e045\"><alternatives><graphic id=\"pcbi.1014869.e045g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e045\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M45\"><mml:mrow><mml:mrow><mml:mi>X</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is:</p>\n<disp-formula id=\"pcbi.1014869.e046\"><alternatives><graphic id=\"pcbi.1014869.e046g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e046\"
        xlink:type=\"simple\"/><mml:math display=\"block\" id=\"M46\"><mml:mrow><mml:mtable><mml:mtr><mml:mtd><mml:mrow><mml:mi>P</mml:mi></mml:mrow><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>X</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow><mml:mo
        fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mml:mo></mml:mrow><mml:mo>=</mml:mo><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">{</mml:mo><mml:mtable><mml:mtr><mml:mtd><mml:mrow><mml:mi>@</mml:mi><mml:mi>l</mml:mi><mml:mi>r</mml:mi></mml:mrow><mml:mfrac><mml:mrow><mml:mo
        maxsize=\"2.047em\" minsize=\"2.047em\">(</mml:mo><mml:mfrac linethickness=\"0\"><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:mfrac><mml:mo
        maxsize=\"2.047em\" minsize=\"2.047em\">)</mml:mo><mml:msup><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msup><mml:msup><mml:mrow><mml:mo
        stretchy=\"false\">(</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow><mml:mo>\u2212</mml:mo><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:mo
        stretchy=\"false\">)</mml:mo></mml:mrow><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msup></mml:mrow><mml:mrow><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow><mml:mo>\u2212</mml:mo><mml:mo
        stretchy=\"false\">(</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow><mml:mo>\u2212</mml:mo><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:msup><mml:mo
        stretchy=\"false\">)</mml:mo><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mrow></mml:msup><mml:mo>\u2212</mml:mo><mml:msup><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mrow></mml:msup></mml:mrow></mml:mfrac><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow><mml:mo>,</mml:mo><mml:mi>\u2026</mml:mi><mml:mo>,</mml:mo><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mo>\u2212</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mtd></mml:mtr><mml:mtr><mml:mtd><mml:mrow><mml:mtext>~~~~~~~~~~~~~~0</mml:mtext></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:mrow><mml:mtext>0</mml:mtext></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>r</mml:mi></mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mtd></mml:mtr></mml:mtable><mml:mspace
        width=\"negativethinmathspace\"/><mml:mspace width=\"negativethinmathspace\"/><mml:mspace
        width=\"negativethinmathspace\"/><mml:mo>,</mml:mo><mml:mo fence=\"true\"
        form=\"postfix\" stretchy=\"true\"/></mml:mrow></mml:mtd></mml:mtr></mml:mtable></mml:mrow></mml:math></alternatives></disp-formula>\n<p>where
        <inline-formula id=\"pcbi.1014869.e047\"><alternatives><graphic id=\"pcbi.1014869.e047g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e047\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M47\"><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        (= (1,019) is the number of cell lines, and <inline-formula id=\"pcbi.1014869.e048\"><alternatives><graphic
        id=\"pcbi.1014869.e048g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e048\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M48\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is the unknown probability of SNV being present in the population. Note that
        for all known driver SNVs, <inline-formula id=\"pcbi.1014869.e049\"><alternatives><graphic
        id=\"pcbi.1014869.e049g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e049\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M49\"><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is neither 0 nor <inline-formula id=\"pcbi.1014869.e050\"><alternatives><graphic
        id=\"pcbi.1014869.e050g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e050\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M50\"><mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>.
        Parameter <inline-formula id=\"pcbi.1014869.e051\"><alternatives><graphic
        id=\"pcbi.1014869.e051g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e051\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M51\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        was estimated via maximum likelihood from the 340 known driver SNVs.</p>\n</sec>\n<sec
        id=\"sec032\">\n<title>Autoencoder construction.</title>\n<p>The autoencoder
        consists of a fully connected encoder and a biologically informed decoder.
        The encoder and decoder share a symmetric structure in terms of node numbers
        at each layer, and both use the tanh activation function. However, in the
        decoder, certain neuron connections are masked according to the pathway-gene
        mask matrix, while the encoder remains fully connected.</p>\n<p>The pathway-gene
        mask matrix was constructed following the approach outlined in the description
        for xNNDriver. The key distinction was in how we handled genes that appeared
        in both the dependency score and expression datasets. Before integrating dependency
        and expression data, each feature was normalized across cell lines by subtracting
        its mean and dividing by its range, placing the two modalities on comparable
        numerical scales. Then, the pathway was linked to both the \u201Cdependency\u201D
        node and the \u201Cexpression\u201D node, and both entries in the mask matrix
        were set to one. The binary mask matrix <inline-formula id=\"pcbi.1014869.e052\"><alternatives><graphic
        id=\"pcbi.1014869.e052g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e052\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M52\"><mml:mrow><mml:mrow><mml:mi>M</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        specifies only the allowed topology and does not impose equal weights across
        modalities. Dependency and expression edges are assigned independently learned
        weights during training, allowing the autoencoder to balance modality-specific
        information and noise. For genes present in only one dataset, connections
        were handled as described before.</p>\n<p>The lower-dimensional representation,
        referred to as driver variant representations (DVRs), is produced in the latent
        layer, which consists of 1024 neurons. Each DVR is represented by a neuron
        in the latent layer with values constrained to 0 or 1, indicating the mutation
        presence or absence of the DVR. The sigmoid activation function is used in
        the latent layer, ensuring the binary nature of the DVRs (rounded to 0 or
        1). The autoencoder was trained by the Adam optimizer, and the cost function
        includes both reconstruction loss (measured as the mean squared error between
        the output layer and the input layer) and regularization terms, which include
        an L<sub>2</sub> regularization term and a binomial distribution penalty.</p>\n<p>Specifically,
        the binomial distribution penalty term encourages the DVRs to resemble real
        driver SNVs. In each epoch, after obtaining the lower-dimensional representations,
        we computed the sum for each DVR neuron across all cell lines and denoted
        it as <inline-formula id=\"pcbi.1014869.e053\"><alternatives><graphic id=\"pcbi.1014869.e053g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e053\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M53\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>.
        The binomial distribution penalty term is defined as the negative logarithmic
        likelihood across all DVRs (q\u2009=\u20091,024), calculated as:</p>\n<disp-formula
        id=\"pcbi.1014869.e054\"><alternatives><graphic id=\"pcbi.1014869.e054g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e054\"
        xlink:type=\"simple\"/><mml:math display=\"block\" id=\"M54\"><mml:mrow><mml:mtable><mml:mtr><mml:mtd><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>l</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mi>_</mml:mi></mml:mrow></mml:msub><mml:mrow><mml:mi>p</mml:mi></mml:mrow><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>n</mml:mi></mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow><mml:mrow><mml:mi>l</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:mo>\u2212</mml:mo><mml:mfrac><mml:mrow><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>q</mml:mi></mml:mrow></mml:mrow></mml:mfrac><mml:msubsup><mml:mo>\u2211</mml:mo><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:mrow><mml:mtext>1</mml:mtext></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>q</mml:mi></mml:mrow></mml:mrow></mml:msubsup><mml:mrow><mml:mrow><mml:mi>l</mml:mi></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>g</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mi>P</mml:mi></mml:mrow><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mml:mo><mml:mrow><mml:mi>X</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo
        fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mml:mo></mml:mrow><mml:mo>.</mml:mo></mml:mtd></mml:mtr></mml:mtable></mml:mrow></mml:math></alternatives></disp-formula>\n<p>If
        <inline-formula id=\"pcbi.1014869.e055\"><alternatives><graphic id=\"pcbi.1014869.e055g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e055\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M55\"><mml:mrow><mml:mrow><mml:mi>P</mml:mi></mml:mrow><mml:mrow><mml:mo
        fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mml:mo><mml:mrow><mml:mi>X</mml:mi></mml:mrow><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mrow><mml:mi>x</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo
        fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mml:mo></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is equal to 0, the training process will be terminated, and the rounded DVRs
        from the previous epoch will be used as the final output.</p>\n</sec>\n<sec
        id=\"sec033\">\n<title>Hyperparameter tuning.</title>\n<p>Grid search was
        used to tune the model\u2019s hyperparameters. For each hyperparameter combination,
        we recorded the average loss over five repeats and selected the combination
        yielding the lowest loss as the default. The default values for the L<sub>2</sub>
        regularization hyperparameter and binomial distribution penalty hyperparameters
        were set to 0.1 and 0.001, respectively. The default learning rate was 0.01.
        The default number of epochs was 1,000. The batch size was fixed at 1,019,
        corresponding to the total number of cell lines, as it is required to remain
        constant to compute the binomial distribution penalty.</p>\n</sec>\n<sec id=\"sec034\">\n<title>Measuring
        pathway importance by layer-wise relevance propagation.</title>\n<p>To assess
        the contribution of pathways in generating DVRs, we employed layer-wise relevance
        propagation (LRP) with the epsilon rule [<xref ref-type=\"bibr\" rid=\"pcbi.1014869.ref047\">47</xref>].
        LRP decomposes the prediction by propagating relevance scores backward through
        the autoencoder\u2019s layers. For a given cell line <italic>c</italic>, the
        relevance score <inline-formula id=\"pcbi.1014869.e056\"><alternatives><graphic
        id=\"pcbi.1014869.e056g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e056\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M56\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>r</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        for neuron <italic>j</italic> is calculated as:</p>\n<disp-formula id=\"pcbi.1014869.e057\"><alternatives><graphic
        id=\"pcbi.1014869.e057g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e057\"
        xlink:type=\"simple\"/><mml:math display=\"block\" id=\"M57\"><mml:mrow><mml:mtable><mml:mtr><mml:mtd><mml:msub><mml:mrow><mml:mrow><mml:mi>r</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mo>\u2211</mml:mo><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mfrac><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mrow><mml:mi>w</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow><mml:mrow><mml:mrow><mml:mi>\u03B5</mml:mi></mml:mrow><mml:mo>+</mml:mo><mml:msub><mml:mo>\u2211</mml:mo><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mrow><mml:mi>w</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:mrow></mml:mfrac><mml:msub><mml:mrow><mml:mrow><mml:mi>r</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>k</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:mtd></mml:mtr></mml:mtable></mml:mrow></mml:math></alternatives></disp-formula>\n<p>where
        <italic>k</italic> denotes a neuron in the subsequent layer (closer to the
        output), and <italic>i</italic> iterates over all neurons in the same layer
        as <italic>j</italic> that connect to <italic>k</italic>. Given the pathway-constrained
        hierarchy of our architecture, these connections are sparse, meaning <inline-formula
        id=\"pcbi.1014869.e058\"><alternatives><graphic id=\"pcbi.1014869.e058g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e058\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M58\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>w</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        is non-zero only for biologically established links. Here, <inline-formula
        id=\"pcbi.1014869.e059\"><alternatives><graphic id=\"pcbi.1014869.e059g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e059\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M59\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        and <inline-formula id=\"pcbi.1014869.e060\"><alternatives><graphic id=\"pcbi.1014869.e060g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e060\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M60\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>a</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        represent the forward-pass activation values, <inline-formula id=\"pcbi.1014869.e061\"><alternatives><graphic
        id=\"pcbi.1014869.e061g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e061\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M61\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>w</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        and <inline-formula id=\"pcbi.1014869.e062\"><alternatives><graphic id=\"pcbi.1014869.e062g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e062\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M62\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>w</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>k</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>
        are the corresponding connection weights, and <inline-formula id=\"pcbi.1014869.e063\"><alternatives><graphic
        id=\"pcbi.1014869.e063g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e063\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M63\"><mml:mrow><mml:mrow><mml:mi>\u03B5</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is a small positive constant. The relevance scores are propagated from the
        output layer to the input layer. We compute normalized relevance scores for
        each layer using z-scores, and the pathway importance is quantified by examining
        the decoder layer. The final normalized relevance score for pathway <inline-formula
        id=\"pcbi.1014869.e064\"><alternatives><graphic id=\"pcbi.1014869.e064g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e064\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M64\"><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        and cell line <inline-formula id=\"pcbi.1014869.e065\"><alternatives><graphic
        id=\"pcbi.1014869.e065g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e065\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M65\"><mml:mrow><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        is denoted as <inline-formula id=\"pcbi.1014869.e066\"><alternatives><graphic
        id=\"pcbi.1014869.e066g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e066\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M66\"><mml:mrow><mml:msub><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mi>j</mml:mi></mml:mrow><mml:mo>,</mml:mo><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:mrow></mml:msub></mml:mrow></mml:math></alternatives></inline-formula>.</p>\n</sec>\n<sec
        id=\"sec035\">\n<title>LASSO regression model for DVR-drug association.</title>\n<p>For
        each drug, a LASSO regression model was built with DVRs as predictors and
        drug AUC values as responses. Data were split into training (80%) and test
        (20%) sets. Models were trained using a LASSO regularization parameter (\u03B1)
        of 0.001 and a maximum of 2,000 iterations. Predictive models (<italic>R\xB2</italic>\u2009&gt;\u20090.05)
        were analyzed for their top 10 DVRs based on coefficient magnitude. LASSO
        models were also built on 50 sets of random mutation controls for comparison.</p>\n<p>To
        evaluate the biological relevance of the top DVRs, we calculated a tissue
        concordance score for each DVR. For a given drug, we defined two groups of
        cell lines: (1) the DVR-positive group, consisting of all cell lines in which
        the DVR was present (value\u2009=\u20091), and (2) the drug-sensitive group,
        consisting of an equal number of cell lines showing the strongest response
        to the drug (i.e., the lowest AUC values). The tissue concordance score was
        defined as the degree of overlap in tissue-type composition between these
        two groups, normalized by group size. This score reflects the degree of tissue-specific
        association between DVR presence and drug response.</p>\n<p>As a control,
        for each drug, we randomly selected ten DVRs that were not among the top ten
        and repeated the concordance analysis. We then compared the tissue concordance
        scores between the top DVRs and the random controls using a paired Wilcoxon
        signed-rank test to assess statistical significance.</p>\n<p>The regularization
        parameter \u03B1\u2009=\u20090.001 was empirically selected to balance feature
        sparsity and model capacity in high-dimensional functional genomics data:
        excessively large \u03B1 values force most coefficients to zero, while excessively
        small values lead to overfitting. To verify the robustness of this choice,
        we retrained the LASSO models across different \u03B1 values and evaluated
        the number of predictive models (test <inline-formula id=\"pcbi.1014869.e067\"><alternatives><graphic
        id=\"pcbi.1014869.e067g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e067\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M67\"><mml:mrow><mml:msup><mml:mrow><mml:mrow><mml:mi>R</mml:mi></mml:mrow></mml:mrow><mml:mrow><mml:mrow><mml:mtext>2</mml:mtext></mml:mrow></mml:mrow></mml:msup></mml:mrow></mml:math></alternatives></inline-formula>
        &gt; 0.05) and resulting tissue concordance <inline-formula id=\"pcbi.1014869.e068\"><alternatives><graphic
        id=\"pcbi.1014869.e068g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e068\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M68\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>-values
        (<xref ref-type=\"supplementary-material\" rid=\"pcbi.1014869.s016\">S11 Table</xref>).
        Extreme settings reduced predictive performance, whereas \u03B1\u2009=\u20090.001
        and \u03B1\u2009=\u20090.0005 both produced 12 predictive drug models and
        significant tissue concordance. We therefore retained \u03B1\u2009=\u20090.001
        as the primary setting within a robust effective range.</p>\n</sec>\n<sec
        id=\"sec036\">\n<title>Distance-based DVR stratification for drug sensitivity
        patterns.</title>\n<p>We calculated the total Euclidean distance of each cell
        line to all others in DVR space and stratified lines into DVR-divergent (large
        total distance) and DVR-convergent (small total distance) groups using the
        85th percentile cutoff. The 85th percentile was chosen as a data-driven threshold
        that balances signal purity and statistical power, as confirmed by a sensitivity
        analysis across adjacent percentiles (75th\u201390th). Drug sensitivity (AUC)
        differences were assessed with Welch\u2019s t-test, omitting cell lines lacking
        drug data.</p>\n</sec>\n</sec>\n</sec>\n<sec id=\"sec037\" sec-type=\"supplementary-material\">\n<title>Supporting
        information</title>\n<supplementary-material id=\"pcbi.1014869.s001\" mimetype=\"image/tiff\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s001\"
        xlink:type=\"simple\">\n<label>S1 Fig</label>\n<caption>\n<title>Prediction
        performance of xNNDriver for the top 30 genes with the highest driver potential
        scores using all SNVs.</title>\n<p>All somatic SNVs, no matter whether annotated
        as functional or not, are used. Data point color indicates the number of cell
        lines with mutations in that gene. Gene name color distinguishes whether a
        gene is a known driver or not (purple: driver, black: non-driver), as documented
        by DepMap.</p>\n<p>(TIF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pcbi.1014869.s002\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s002\"
        xlink:type=\"simple\">\n<label>S2 Fig</label>\n<caption>\n<title>Event-level
        validation of xNNDriver predictions for the top 15 candidate driver genes.</title>\n<p>Blue
        bars indicate precision, defined as the fraction of cell lines predicted as
        mutation-positive that carried the corresponding catalogued functional mutation
        in DepMap. Green bars indicate recall, defined as the fraction of cell lines
        with a catalogued functional mutation that were predicted as mutation-positive
        by xNNDriver. Predictions were evaluated on the held-out test set (~275 cell
        lines) for each gene.</p>\n<p>(TIF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pcbi.1014869.s003\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s003\"
        xlink:type=\"simple\">\n<label>S3 Fig</label>\n<caption>\n<title>Comparison
        of mutation frequency distributions between DVRs from xAEDriver and known
        functional driver SNVs.</title>\n<p>The histograms display the frequency of
        mutation occurrences across cell lines for (A) DVRs and (B) known driver SNVs.</p>\n<p>(TIF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pcbi.1014869.s004\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s004\"
        xlink:type=\"simple\">\n<label>S4 Fig</label>\n<caption>\n<title>Differential
        drug sensitivity for additional significant drugs.</title>\n<p>DVR-divergent
        and DVR-convergent cell lines show distinct drug responses for (A) SN38 (Benjamini-Hochberg
        adjusted <inline-formula id=\"pcbi.1014869.e069\"><alternatives><graphic id=\"pcbi.1014869.e069g\"
        mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e069\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M69\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        = 0.04), (B) Mps-1-IN-1 (adjusted <inline-formula id=\"pcbi.1014869.e070\"><alternatives><graphic
        id=\"pcbi.1014869.e070g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e070\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M70\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        = 0.03), and (C) Y-39983 (adjusted <inline-formula id=\"pcbi.1014869.e071\"><alternatives><graphic
        id=\"pcbi.1014869.e071g\" mimetype=\"image\" position=\"anchor\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.e071\"
        xlink:type=\"simple\"/><mml:math display=\"inline\" id=\"M71\"><mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:mrow></mml:math></alternatives></inline-formula>
        = 0.02), based on t-tests followed by Benjamini-Hochberg p value adjustments.</p>\n<p>(TIF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pcbi.1014869.s005\" mimetype=\"image/tiff\" position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s005\"
        xlink:type=\"simple\">\n<label>S5 Fig</label>\n<caption>\n<title>Distribution
        of mean dependency scores of all genes.</title>\n<p>The histogram illustrates
        the distribution of mean dependency scores across all cell lines for all genes
        in the DepMap gene dependency dataset.</p>\n<p>(TIF)</p>\n</caption>\n</supplementary-material>\n<supplementary-material
        id=\"pcbi.1014869.s006\" mimetype=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"
        position=\"float\" xlink:href=\"info:doi/10.1371/journal.pcbi.1014869.s006\"
        xlink:type=\"simple\">\n<label>S1 Table</label>\n<caption>\n<title>Comprehensive
        results of all xNNDriver models using functional SNVs.</title>\n<p>Each model
        corresponds to a frequently mutated candidate gene (3,008 in total). Information
        includes the following metrics: driver potential score, the number of cell
        lines with mutation presence, the number of cell lines without mutation presence,
